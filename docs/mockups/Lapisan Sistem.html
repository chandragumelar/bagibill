  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"id\" data-theme=\"light\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>BagiBill — Lapisan Sistem · Hapus, Undo, Offline, Gagal<\u002Ftitle>\n<style>\n/* ============================================================\n   BagiBill — LAPISAN SISTEM (di atas layar yang sudah ada)\n   Hapus & undo · offline & sinkron · gagal · memuat.\n   Token dari tokens.css, di-inline supaya satu file mandiri.\n   Konvensi kelas dipakai ulang; tidak ada nilai mentah ditulis\n   dua kali; tidak ada style inline per elemen kecuali --c warna\n   member & lebar/nilai bar. Semua di bawah token.\n   ============================================================ */\n\n:root{\n  --bb-font:-apple-system,BlinkMacSystemFont,\"SF Pro Text\",\"SF Pro Display\",system-ui,\"Segoe UI\",Roboto,sans-serif;\n\n  --fs-caption2:11px; --fs-caption:12px; --fs-footnote:13px; --fs-subhead:15px;\n  --fs-body:17px; --fs-headline:17px; --fs-title3:20px; --fs-title2:22px; --fs-title1:28px; --fs-large:34px;\n  --num-lg:40px; --num-xl:48px; --num-tracking:-0.02em;\n  --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700;\n  --line-tight:1.2; --line-body:1.3; --line-relaxed:1.45;\n\n  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;\n  --sp-6:24px; --sp-7:32px; --sp-8:40px; --sp-9:48px; --sp-10:64px;\n\n  --r-btn:10px; --r-card:14px; --r-field:10px; --r-pill:999px;\n\n  --dur-tap:120ms; --dur-base:200ms; --dur-sheet:320ms;\n  --ease:cubic-bezier(.2,.8,.2,1);\n  --ease-emphasized:cubic-bezier(.4,0,.2,1);\n\n  /* --- BARU: durasi lapisan sistem, masing-masing variabel sendiri --- */\n  --dur-undo:6000ms;     /* jendela undo — cukup buat sadar & tarik lagi */\n  --dur-toast:3200ms;    /* toast info/sukses non-undo, auto hilang */\n  --dur-move:260ms;      /* masuk/keluar elemen sistem (BEDA dari transisi tap) */\n  --dur-hold:1100ms;     /* tahan-untuk-hapus (aksi permanen) */\n\n  --m-1:#E5484D; --m-2:#E1620F; --m-3:#A9820C; --m-4:#4B9E2F;\n  --m-5:#12967A; --m-6:#0E8FB0; --m-7:#3A5BD9; --m-8:#5B4BD6;\n  --m-9:#7C3AED; --m-10:#A83BC0; --m-11:#C42C86; --m-12:#D33B63;\n}\n[data-theme=\"light\"]{\n  --n-0:#F6F7F9; --n-1:#FFFFFF; --n-2:#EDF0F3; --n-3:#E1E5EA; --n-4:#C8CED7;\n  --n-5:#98A0AC; --n-6:#69717E; --n-7:#49515D; --n-8:#282D35; --n-9:#12161C;\n  --surface:var(--n-1); --surface-sunken:var(--n-0); --surface-raised:var(--n-1); --border:var(--n-3);\n  --text:var(--n-9); --text-secondary:var(--n-7); --text-muted:var(--n-6);\n  --brand:#1E63E9; --brand-strong:#1750C9; --brand-tint:#E7EEFD; --on-brand:#FFFFFF;\n  --pos:#0E9E8E; --pos-text:#0A6E63; --pos-tint:#DBF4F0;\n  --neg:#E5484D; --neg-text:#B22026; --neg-tint:#FCE4E5;\n  --warn:#E8A317; --warn-text:#8A5A00; --warn-tint:#FBEFCF;\n  --btn-bg:var(--brand); --btn-bg-hover:#1A57CE; --btn-bg-active:#164BB0; --btn-fg:var(--on-brand);\n  --btn2-bg:var(--n-2); --btn2-bg-hover:var(--n-3); --btn2-bg-active:var(--n-4); --btn2-fg:var(--n-9); --btn2-border:var(--border);\n  --focus-ring:0 0 0 2px var(--surface),0 0 0 4px var(--brand);\n  --scrim:rgba(16,22,30,.32);\n  --elev-1:0 1px 2px rgba(16,22,30,.06); --elev-2:0 2px 10px rgba(16,22,30,.08); --elev-3:0 8px 26px rgba(16,22,30,.12);\n  --stage:#E8EAEE;\n\n  /* --- BARU: tangga bahaya aksi (light) ---\n     rendah  = reversible, ada undo → tenang, warna brand.\n     tinggi  = permanen, tak bisa ditarik → merah kuat + tahan.\n     terkunci= tidak diizinkan → NETRAL, bukan merah (bukan bahaya, cuma tak bisa). */\n  --risk-low:var(--brand);           --risk-low-tint:var(--brand-tint);\n  --risk-high:var(--neg);            --risk-high-strong:#C42127; --risk-high-tint:var(--neg-tint); --risk-high-text:var(--neg-text);\n  --risk-locked:var(--n-6);          --risk-locked-tint:var(--n-2);\n\n  /* --- BARU: offline tenang  vs  gagal butuh-tindakan ---\n     offline = keadaan normal, netral abu (BUKAN merah, BUKAN alarm).\n     sync    = lagi ngirim / kembali online → brand, lalu pos saat beres.\n     fail    = butuh tindakan (ulangi / muat ulang) → neg + jalan keluar. */\n  --offline-fg:var(--text-secondary); --offline-bg:var(--n-2); --offline-dot:var(--n-5);\n  --sync-fg:var(--brand);             --sync-bg:var(--brand-tint);\n  --syncdone-fg:var(--pos-text);      --syncdone-bg:var(--pos-tint);\n  --fail-fg:var(--neg-text);          --fail-bg:var(--neg-tint); --fail-border:color-mix(in srgb,var(--neg) 40%,transparent);\n}\n[data-theme=\"dark\"]{\n  --n-0:#0E1116; --n-1:#161A21; --n-2:#1D222B; --n-3:#242A34; --n-4:#313945;\n  --n-5:#48525F; --n-6:#79838F; --n-7:#9AA4B2; --n-8:#C8CED7; --n-9:#F2F4F7;\n  --surface:var(--n-1); --surface-sunken:var(--n-0); --surface-raised:var(--n-2); --border:var(--n-3);\n  --text:var(--n-9); --text-secondary:var(--n-7); --text-muted:var(--n-6);\n  --brand:#5B8CFF; --brand-strong:#7AA2FF; --brand-tint:#182338; --on-brand:#0B1220;\n  --pos:#2FC7B4; --pos-text:#54D6C6; --pos-tint:#0F2B29;\n  --neg:#FF6B6E; --neg-text:#FF8E90; --neg-tint:#331A1C;\n  --warn:#E0A63A; --warn-text:#F0C070; --warn-tint:#33270F;\n  --btn-bg:var(--brand); --btn-bg-hover:#74A0FF; --btn-bg-active:#8FB2FF; --btn-fg:var(--on-brand);\n  --btn2-bg:var(--n-2); --btn2-bg-hover:var(--n-3); --btn2-bg-active:var(--n-4); --btn2-fg:var(--n-9); --btn2-border:var(--border);\n  --focus-ring:0 0 0 2px var(--surface),0 0 0 4px var(--brand);\n  --scrim:rgba(0,0,0,.55);\n  --elev-1:0 1px 2px rgba(0,0,0,.4); --elev-2:0 4px 14px rgba(0,0,0,.5); --elev-3:0 10px 28px rgba(0,0,0,.6);\n  --stage:#0A0C10;\n\n  --risk-low:var(--brand);           --risk-low-tint:var(--brand-tint);\n  --risk-high:var(--neg);            --risk-high-strong:#FF7B7E; --risk-high-tint:var(--neg-tint); --risk-high-text:var(--neg-text);\n  --risk-locked:var(--n-6);          --risk-locked-tint:var(--n-2);\n\n  --offline-fg:var(--text-secondary); --offline-bg:var(--n-2); --offline-dot:var(--n-5);\n  --sync-fg:var(--brand-strong);      --sync-bg:var(--brand-tint);\n  --syncdone-fg:var(--pos-text);      --syncdone-bg:var(--pos-tint);\n  --fail-fg:var(--neg-text);          --fail-bg:var(--neg-tint); --fail-border:color-mix(in srgb,var(--neg) 45%,transparent);\n}\n\n*{box-sizing:border-box; margin:0; padding:0;}\nbody{font-family:var(--bb-font); background:var(--stage); color:var(--text); -webkit-font-smoothing:antialiased;\n  min-height:100vh; display:flex; flex-direction:column; align-items:center; gap:var(--sp-6); padding:var(--sp-7) var(--sp-4) var(--sp-9);}\n.num{font-variant-numeric:tabular-nums; font-feature-settings:\"tnum\" 1,\"lnum\" 1;}\n.scr::-webkit-scrollbar{width:0; height:0;}\n\n/* fokus keyboard selalu terlihat */\n:focus-visible{outline:none; box-shadow:var(--focus-ring);}\n\n/* ---- page controls ---- */\n.controls{display:flex; align-items:center; gap:var(--sp-3); background:var(--surface); border:1px solid var(--border);\n  border-radius:var(--r-pill); padding:var(--sp-1) var(--sp-1) var(--sp-1) var(--sp-4); box-shadow:var(--elev-1);}\n.controls span{font-size:var(--fs-footnote); font-weight:var(--fw-semibold); color:var(--text-secondary);}\n.controls button{border:none; background:var(--n-2); color:var(--n-8); height:34px; padding:0 var(--sp-4); border-radius:var(--r-pill);\n  font-size:var(--fs-subhead); font-weight:var(--fw-semibold); cursor:pointer; font-family:inherit;}\n\n.stage-row{display:flex; gap:var(--sp-8); align-items:flex-start; justify-content:center; flex-wrap:wrap;}\n\n/* ---- phone frame ---- */\n.phone{width:360px; height:800px; border-radius:44px; background:#000; padding:11px; position:relative;\n  box-shadow:0 30px 70px var(--scrim),0 8px 20px rgba(16,22,30,.18);}\n.screen{width:100%; height:100%; border-radius:34px; overflow:hidden; background:var(--surface-sunken);\n  display:flex; flex-direction:column; position:relative; color:var(--text);}\n.notch{position:absolute; left:50%; top:14px; transform:translateX(-50%); width:118px; height:32px; background:#000; border-radius:20px; z-index:20;}\n.statusbar{height:44px; flex:0 0 44px; display:flex; align-items:center; justify-content:space-between; padding:0 var(--sp-6); font-size:var(--fs-subhead);}\n.statusbar .t{font-weight:var(--fw-semibold);}\n.statusbar .r{display:flex; align-items:center; gap:var(--sp-1); font-size:var(--fs-caption);}\n.statusbar .r.is-off b{color:var(--text-muted);}\n.batt{width:22px; height:11px; border:1.5px solid var(--text); border-radius:3px; position:relative; display:inline-block;}\n.batt::after{content:\"\"; position:absolute; inset:1.5px; right:6px; background:var(--text); border-radius:1px;}\n\n/* ---- group header (bersama Transaksi/Saldo) ---- */\n.ghead{flex:0 0 auto; background:var(--surface); border-bottom:1px solid var(--border); padding:var(--sp-1) var(--sp-4) 0; box-shadow:var(--elev-1); z-index:3;}\n.ghead-top{display:flex; align-items:center; gap:var(--sp-2); height:36px;}\n.icobtn{border:none; background:none; color:var(--brand); font-size:26px; line-height:1; cursor:pointer; width:34px; height:34px;\n  display:flex; align-items:center; justify-content:center; padding:0; border-radius:var(--r-pill);}\n.icobtn.menu{font-size:20px; color:var(--text-secondary);}\n.gtitle{flex:1; min-width:0; text-align:center;}\n.gtitle h1{margin:0; font-size:var(--fs-body); font-weight:var(--fw-semibold); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}\n.ghead-mid{display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3) 0 var(--sp-4);}\n.avstack{display:flex; flex:0 0 auto;}\n.avstack .av{width:32px; height:32px; border-radius:var(--r-pill); border:2px solid var(--surface); color:#fff;\n  font-size:var(--fs-caption); font-weight:var(--fw-semibold); display:flex; align-items:center; justify-content:center; margin-left:-8px; background:var(--av,var(--n-5));}\n.avstack .av:first-child{margin-left:0;}\n.avstack .more{background:var(--n-3); color:var(--text-secondary);}\n.position{flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-end; text-align:right;\n  background:var(--surface-sunken); border:1px solid var(--border); border-radius:var(--r-card); padding:var(--sp-2) var(--sp-3);}\n.position .lbl{font-size:var(--fs-caption); color:var(--text-muted);}\n.position .amt{font-size:var(--fs-title3); font-weight:var(--fw-bold); letter-spacing:-.01em; line-height:1.15;}\n.position .amt.neg{color:var(--neg-text);} .position .amt.pos{color:var(--pos-text);}\n.position .sub{font-size:var(--fs-caption); color:var(--text-secondary);}\n.position .sub b{color:var(--text); font-weight:var(--fw-semibold);}\n.tabs{display:flex; gap:var(--sp-5);}\n.tab{border:none; background:none; font-family:inherit; font-size:var(--fs-subhead); font-weight:var(--fw-medium);\n  color:var(--text-muted); padding:var(--sp-2) 0 var(--sp-3); cursor:pointer; position:relative;}\n.tab.active{color:var(--text); font-weight:var(--fw-semibold);}\n.tab.active::after{content:\"\"; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--brand); border-radius:var(--r-pill);}\n\n/* simple top bar (untuk layar non-grup: tambah, member, join) */\n.topbar{flex:0 0 auto; background:var(--surface); border-bottom:1px solid var(--border); box-shadow:var(--elev-1);\n  display:flex; align-items:center; gap:var(--sp-2); padding:var(--sp-2) var(--sp-2); height:52px; z-index:3;}\n.topbar h1{flex:1; min-width:0; font-size:var(--fs-body); font-weight:var(--fw-semibold); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}\n.topbar .txt{font-size:var(--fs-subhead); font-weight:var(--fw-semibold); color:var(--brand); background:none; border:none; cursor:pointer; font-family:inherit; padding:0 var(--sp-2); min-width:56px;}\n.topbar .txt.ghost{color:var(--text-muted);}\n\n/* ---- scroll body ---- */\n.body{flex:1 1 auto; overflow-y:auto; position:relative; -webkit-overflow-scrolling:touch;}\n\n/* ============================================================\n   TRANSAKSI list (di baliknya state hapus/undo & baris gagal)\n   ============================================================ */\n.daysep{display:flex; align-items:baseline; justify-content:space-between; padding:var(--sp-4) var(--sp-4) var(--sp-2);\n  position:sticky; top:0; background:var(--surface-sunken); z-index:2;}\n.daysep .d{font-size:var(--fs-footnote); font-weight:var(--fw-semibold); color:var(--text-secondary);}\n.daysep .s{font-size:var(--fs-caption); color:var(--text-muted);}\n.group{background:var(--surface); margin:0 var(--sp-4) var(--sp-3); border:1px solid var(--border); border-radius:var(--r-card); overflow:hidden; box-shadow:var(--elev-1);}\n\n/* baris = pembungkus swipe + latar aksi hapus di belakang */\n.txwrap{position:relative; overflow:hidden; border-bottom:1px solid var(--border);}\n.txwrap:last-child{border-bottom:none;}\n.txwrap.gone{max-height:0; opacity:0; transition:max-height var(--dur-move) var(--ease), opacity var(--dur-move) var(--ease);}\n.txback{position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-end; gap:6px;\n  background:var(--risk-high-tint); color:var(--risk-high-text); padding:0 var(--sp-4); font-size:var(--fs-footnote); font-weight:var(--fw-semibold);}\n.txback svg{width:18px; height:18px;}\n.tx{position:relative; display:grid; grid-template-columns:40px minmax(0,1fr) auto; align-items:center; gap:var(--sp-4);\n  padding:var(--sp-3); background:var(--surface); cursor:grab; touch-action:pan-y; transition:transform var(--dur-tap) var(--ease);}\n.tx:active{cursor:grabbing;}\n.cat{width:40px; height:40px; border-radius:var(--r-pill); display:flex; align-items:center; justify-content:center; font-size:19px;\n  background:color-mix(in srgb, var(--cat,var(--n-5)) 16%, transparent);}\n.tx-main{min-width:0;}\n.tx-title{font-size:var(--fs-subhead); font-weight:var(--fw-medium); color:var(--text); line-height:1.3; overflow:hidden; text-overflow:ellipsis;\n  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}\n.tx-meta{display:flex; align-items:center; gap:var(--sp-2); margin-top:3px; min-width:0; flex-wrap:wrap;}\n.tx-meta .payer{font-size:var(--fs-caption); color:var(--text-muted); white-space:nowrap;}\n.tx-eff{display:flex; flex-direction:column; align-items:flex-end; justify-content:center; text-align:right; min-width:84px;}\n.eff-amt{font-size:var(--fs-subhead); font-weight:var(--fw-semibold); white-space:nowrap;}\n.eff-lbl{font-size:var(--fs-caption2); color:var(--text-muted); margin-top:1px;}\n.tx-eff.neg .eff-amt{color:var(--neg-text);} .tx-eff.pos .eff-amt{color:var(--pos-text);}\n\n/* baris GAGAL sebagian — cuma baris ini, layar lain baik-baik saja */\n.tx.is-failed{background:var(--fail-bg);}\n.tx.is-failed .cat{filter:grayscale(.4); opacity:.8;}\n.tx.is-failed .tx-title{color:var(--text-secondary);}\n.txfail{display:flex; align-items:center; gap:var(--sp-2); padding:var(--sp-2) var(--sp-3) var(--sp-3); background:var(--fail-bg);\n  font-size:var(--fs-caption); color:var(--fail-fg); border-top:1px dashed var(--fail-border);}\n.txfail svg{width:14px; height:14px; flex:0 0 auto;}\n.txfail .fill{flex:1 1 auto;}\n.txfail b{font-weight:var(--fw-semibold);}\n.rowbtn{margin-left:auto; appearance:none; border:1px solid var(--fail-border); background:var(--surface); color:var(--fail-fg);\n  font-family:inherit; font-size:var(--fs-caption); font-weight:var(--fw-semibold); border-radius:var(--r-pill); padding:0 var(--sp-3);\n  height:36px; min-width:44px; cursor:pointer; display:inline-flex; align-items:center; gap:5px;}\n.rowbtn svg{width:13px; height:13px;}\n\n/* ---- FAB ---- */\n.fab{position:absolute; right:var(--sp-4); bottom:var(--sp-6); display:flex; align-items:center;\n  background:var(--brand); border-radius:var(--r-pill); box-shadow:var(--elev-3); z-index:8;}\n.fab-scan{border:none; background:none; color:var(--on-brand); width:48px; height:52px; font-size:20px; cursor:pointer;\n  border-radius:var(--r-pill) 0 0 var(--r-pill); display:flex; align-items:center; justify-content:center; opacity:.92; position:relative;}\n.fab-scan::after{content:\"\"; width:1px; height:24px; background:color-mix(in srgb,var(--on-brand) 30%,transparent); position:absolute; right:0;}\n.fab-main{border:none; background:none; color:var(--on-brand); height:52px; padding:0 var(--sp-5) 0 var(--sp-4);\n  font-size:var(--fs-subhead); font-weight:var(--fw-semibold); cursor:pointer; font-family:inherit; display:flex; align-items:center; gap:var(--sp-2); border-radius:0 var(--r-pill) var(--r-pill) 0;}\n.fab-main .plus{font-size:20px; line-height:0;}\n\n/* ============================================================\n   TAMBAH PENGELUARAN (di baliknya state simpan-gagal + posisi toast)\n   ============================================================ */\n.form{padding:var(--sp-4) var(--sp-4) var(--sp-9); display:flex; flex-direction:column; gap:var(--sp-4);}\n.amountbox{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); padding:var(--sp-5) var(--sp-4); text-align:center; box-shadow:var(--elev-1);}\n.amountbox .lbl{font-size:var(--fs-caption); color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em;}\n.amountbox .val{font-size:var(--num-lg); font-weight:var(--fw-bold); letter-spacing:var(--num-tracking); margin-top:var(--sp-1);}\n.amountbox .val .rp{font-size:var(--fs-title3); color:var(--text-secondary); margin-right:4px;}\n.field{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); padding:var(--sp-3) var(--sp-4);\n  display:flex; align-items:center; gap:var(--sp-3); box-shadow:var(--elev-1);}\n.field .k{font-size:var(--fs-caption); color:var(--text-muted); width:88px; flex:0 0 auto;}\n.field .v{font-size:var(--fs-subhead); font-weight:var(--fw-medium); flex:1 1 auto;}\n.field .v.ph{color:var(--text-muted); font-weight:var(--fw-regular);}\n.field .chev{color:var(--n-5); font-size:18px;}\n.field .av2{width:26px;height:26px;border-radius:var(--r-pill);color:#fff;font-size:var(--fs-caption2);font-weight:var(--fw-bold);display:flex;align-items:center;justify-content:center;background:var(--av,var(--n-5));}\n.splitrow{display:flex; gap:6px;}\n\n/* bilah tombol bawah tetap (target toast harus di ATAS ini) */\n.bottombar{flex:0 0 auto; padding:var(--sp-3) var(--sp-4) calc(var(--sp-4) + env(safe-area-inset-bottom));\n  background:var(--surface); border-top:1px solid var(--border); box-shadow:0 -2px 10px rgba(16,22,30,.05); position:relative; z-index:9;}\n.btn{appearance:none; border:none; font-family:inherit; cursor:pointer; font-size:var(--fs-headline); font-weight:var(--fw-semibold);\n  border-radius:var(--r-btn); padding:var(--sp-3) var(--sp-4); min-height:50px; width:100%;\n  display:flex; align-items:center; justify-content:center; gap:var(--sp-2); transition:background var(--dur-tap), transform var(--dur-tap);}\n.btn:active{transform:scale(.99);}\n.btn svg{width:17px; height:17px;}\n.btn--primary{background:var(--btn-bg); color:var(--btn-fg);}\n.btn--primary:hover{background:var(--btn-bg-hover);}\n.btn--secondary{background:var(--btn2-bg); color:var(--btn2-fg); border:1px solid var(--btn2-border);}\n.btn--secondary:hover{background:var(--btn2-bg-hover);}\n.btn--danger{background:var(--risk-high); color:#fff;}\n.btn[disabled]{opacity:.6; pointer-events:none;}\n.btn .spin{width:17px;height:17px;border:2.2px solid color-mix(in srgb,var(--btn-fg) 40%,transparent);border-top-color:var(--btn-fg);border-radius:50%;animation:spin .8s linear infinite;}\n\n/* inline error di atas tombol simpan (simpan gagal) */\n.savefail{display:flex; align-items:flex-start; gap:var(--sp-2); padding:var(--sp-3) var(--sp-3); margin-bottom:var(--sp-3);\n  background:var(--fail-bg); border:1px solid var(--fail-border); border-radius:var(--r-card); color:var(--fail-fg); font-size:var(--fs-caption);}\n.savefail svg{width:16px; height:16px; flex:0 0 auto; margin-top:1px;}\n.savefail .g{flex:1 1 auto; line-height:var(--line-body);}\n.savefail b{font-weight:var(--fw-semibold);}\n.save btn--secondary{margin-top:var(--sp-2);}\n\n@media (prefers-reduced-motion:reduce){\n  *{transition-duration:1ms !important; animation-duration:1ms !important; animation-iteration-count:1 !important;}\n  /* cincin undo tak beranimasi; ANGKA (via JS) tetap menghitung mundur */\n}\n\n/* ---- dev switcher ---- */\n.dev{width:250px; flex:0 0 auto; position:sticky; top:var(--sp-6); background:var(--surface); color:var(--text);\n  border-radius:var(--r-card); padding:var(--sp-4); box-shadow:var(--elev-2); font-size:var(--fs-footnote); border:1px solid var(--border);}\n.dev h4{font-size:var(--fs-caption); text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:var(--sp-3); font-weight:var(--fw-semibold);}\n.dev-group{display:flex; flex-direction:column; gap:6px; margin-bottom:var(--sp-4);}\n.dev-btn{appearance:none; text-align:left; font-family:inherit; font-size:var(--fs-footnote); border:1px solid var(--border); background:var(--surface-sunken);\n  color:var(--text); border-radius:var(--r-btn); padding:9px 11px; cursor:pointer; transition:all var(--dur-tap); display:flex; align-items:baseline; gap:8px;}\n.dev-btn:hover{border-color:var(--n-4);}\n.dev-btn.is-active{background:var(--brand); color:var(--on-brand); border-color:var(--brand);}\n.dev-btn .k{font-variant-numeric:tabular-nums; opacity:.6; font-weight:var(--fw-bold); min-width:14px;}\n.dev-btn .badge{margin-left:auto; font-size:9px; font-weight:var(--fw-bold); text-transform:uppercase; letter-spacing:.04em; opacity:.7; align-self:center;}\n.dev-theme{display:flex; gap:6px;}\n.dev-theme .dev-btn{flex:1; justify-content:center;}\n.dev-note{font-size:var(--fs-caption); color:var(--text-muted); line-height:var(--line-relaxed); margin-top:var(--sp-1);}\n\n/* ---- design notes ---- */\n.notes{max-width:820px; font-size:var(--fs-footnote); color:var(--text-secondary); line-height:1.65;}\n.notes h3{font-size:var(--fs-title3); color:var(--text); margin:0 0 var(--sp-2);}\n.notes h4{font-size:var(--fs-subhead); color:var(--text); margin:var(--sp-5) 0 var(--sp-1);}\n.notes b{color:var(--text);}\n.notes code{background:var(--n-2); padding:1px 5px; border-radius:6px; font-size:var(--fs-caption);}\n.notes ul{margin:var(--sp-1) 0 0; padding-left:var(--sp-5);}\n.notes li{margin-bottom:var(--sp-1);}\na{color:var(--brand); text-decoration:none;} a:hover{color:var(--brand-strong);}\n@media(max-width:900px){ .dev{position:static; width:360px;} }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<div class=\"controls\">\n  <span>BagiBill · Lapisan Sistem<\u002Fspan>\n  <button id=\"themeBtn\" onclick=\"toggleTheme()\">Gelap<\u002Fbutton>\n<\u002Fdiv>\n\n<div class=\"stage-row\">\n\n  <div class=\"phone\">\n    <div class=\"notch\"><\u002Fdiv>\n    <div class=\"screen\">\n      <div class=\"statusbar\" id=\"statusbar\">\n        <span class=\"t num\">9:41<\u002Fspan>\n        <span class=\"r\" id=\"statusR\"><span>●●●<\u002Fspan><b>5G<\u002Fb><span class=\"batt\"><\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div id=\"screenTop\"><\u002Fdiv>\n      <div id=\"screenBody\" class=\"body scr\"><\u002Fdiv>\n      <div id=\"screenBottom\"><\u002Fdiv>\n\n      <!-- toast zone (undo) -->\n      <div class=\"toastzone\" id=\"toastZone\"><\u002Fdiv>\n\n      <!-- sheet konfirmasi -->\n      <div class=\"scrim\" id=\"scrim\"><div class=\"sheet\" id=\"sheet\" role=\"dialog\" aria-modal=\"true\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <aside class=\"dev\">\n    <h4>10 keadaan<\u002Fh4>\n    <div class=\"dev-group\" id=\"devStates\"><\u002Fdiv>\n    <h4>Tema<\u002Fh4>\n    <div class=\"dev-theme\">\n      <button class=\"dev-btn is-active\" data-theme-btn=\"light\">Terang<\u002Fbutton>\n      <button class=\"dev-btn\" data-theme-btn=\"dark\">Gelap<\u002Fbutton>\n    <\u002Fdiv>\n    <p class=\"dev-note\" id=\"devNote\"><\u002Fp>\n  <\u002Faside>\n\n<\u002Fdiv>\n\n<div class=\"notes\" id=\"notes\"><\u002Fdiv>\n\n<script>\n/* ============================================================\n   DATA — sesuai mockup lain. Kamu = Nadia.\n   ============================================================ */\nconst ME = { name:\"Nadia Putri\", first:\"Nadia\", ini:\"NP\", c:\"var(--m-7)\" };\nconst MEMBERS = [\n  { id:\"me\",     name:\"Nadia Putri\",                first:\"Nadia\",  ini:\"NP\", c:\"var(--m-7)\",  role:\"kamu · admin\",  tx:12, locked:true  },\n  { id:\"farhan\", name:\"Farhan Maulana Abdurrahman\", first:\"Farhan\", ini:\"FM\", c:\"var(--m-8)\",  role:\"9 transaksi\",   tx:9,  locked:true  },\n  { id:\"sarah\",  name:\"Sarah\",                      first:\"Sarah\",  ini:\"SR\", c:\"var(--m-11)\", role:\"5 transaksi\",   tx:5,  locked:true  },\n  { id:\"andi\",   name:\"Andi\",                       first:\"Andi\",   ini:\"AN\", c:\"var(--m-4)\",  role:\"belum ada transaksi\", tx:0, locked:false },\n  { id:\"dewi\",   name:\"Dewi\",                       first:\"Dewi\",   ini:\"DW\", c:\"var(--m-2)\",  role:\"3 transaksi\",   tx:3,  locked:true  },\n];\n\n/* transaksi Trip Bali (dibuang & ditarik lagi lewat undo) */\nlet TX = [\n  { id:\"t1\", cat:\"var(--m-2)\", emo:\"\\u{1F357}\", title:\"Sate Padang Ajo Ramon\",  payer:\"Andi bayar\",   amt:-60000,   lbl:\"bagianmu\", kind:\"neg\" },\n  { id:\"t2\", cat:\"var(--m-3)\", emo:\"\\u2615\",     title:\"Kopi Kenangan · 4 gelas\", payer:\"Kamu bayar\",   amt: 72000,   lbl:\"buat kamu\", kind:\"pos\" },\n  { id:\"t3\", cat:\"var(--m-8)\", emo:\"\\u{1F3DD}\",  title:\"Sewa villa Uluwatu 3 malam\", payer:\"Farhan bayar\", amt:-3750000, lbl:\"bagianmu\", kind:\"neg\", fail:true },\n  { id:\"t4\", cat:\"var(--m-6)\", emo:\"\\u26FD\",     title:\"Bensin + tol Denpasar\",  payer:\"Farhan bayar\", amt:-75000,   lbl:\"bagianmu\", kind:\"neg\" },\n];\n\n/* ---- util ---- */\nconst $  = s => document.querySelector(s);\nconst rp = n => \"Rp \" + Math.abs(n).toLocaleString(\"id-ID\");\nfunction ic(name){\n  const p = {\n    undo:'<path d=\"M9 14L4 9l5-5\"/><path d=\"M4 9h11a5 5 0 0 1 0 10h-3\"/>',\n    trash:'<path d=\"M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m2 0-1 13a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 7\"/>',\n    warn:'<path d=\"M12 9v4m0 4h.01M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6A2 2 0 0 0 22 18L13.7 3.9a2 2 0 0 0-3.4 0z\"/>',\n    lock:'<rect x=\"4\" y=\"10\" width=\"16\" height=\"11\" rx=\"2\"/><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"/>',\n    off:'<path d=\"M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0\"/><path d=\"M12 20h.01\"/><path d=\"M3 3l18 18\"/>',\n    up:'<path d=\"M12 19V6M6 12l6-6 6 6\"/>',\n    check:'<path d=\"M5 13l4 4L19 7\"/>',\n    retry:'<path d=\"M21 12a9 9 0 1 1-2.6-6.3M21 4v5h-5\"/>',\n    receipt:'<path d=\"M5 3v18l2-1.5L9 21l2-1.5L13 21l2-1.5L17 21l2-1.5V3l-2 1.5L15 3l-2 1.5L11 3 9 4.5 7 3 5 4.5z\"/><path d=\"M9 8h6M9 12h6\"/>',\n    cloud:'<path d=\"M17.5 19a4.5 4.5 0 0 0 .5-9 6 6 0 0 0-11.6-1.5A4 4 0 0 0 6 19z\"/><path d=\"M12 12v6m0 0-2.5-2.5M12 18l2.5-2.5\"/>',\n    ban:'<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M5.6 5.6l12.8 12.8\"/>',\n    save:'<path d=\"M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z\"/><path d=\"M17 21v-8H7v8M7 3v5h8\"/>',\n  }[name]||'';\n  return `<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${p}<\u002Fsvg>`;\n}\n\n/* ============================================================\n   BASE SCREENS — dibangun ulang tiap state, pakai kelas bersama.\n   ============================================================ */\nfunction ghead(opts){\n  const netbar = opts.netbar || \"\";\n  return `\n   <header class=\"ghead\">\n    <div class=\"ghead-top\">\n      <button class=\"icobtn\" aria-label=\"Kembali\">&#8249;<\u002Fbutton>\n      <div class=\"gtitle\"><h1>${opts.title}<\u002Fh1><\u002Fdiv>\n      <button class=\"icobtn menu\" aria-label=\"Menu\">&#8943;<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"ghead-mid\">\n      <div class=\"avstack\">\n        <span class=\"av\" style=\"--av:var(--m-7)\">N<\u002Fspan>\n        <span class=\"av\" style=\"--av:var(--m-8)\">F<\u002Fspan>\n        <span class=\"av\" style=\"--av:var(--m-11)\">S<\u002Fspan>\n        <span class=\"av\" style=\"--av:var(--m-4)\">A<\u002Fspan>\n        <span class=\"av\" style=\"--av:var(--m-2)\">D<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"position\">\n        <span class=\"lbl\">Posisi kamu<\u002Fspan>\n        <span class=\"amt pos num\">+Rp&nbsp;1.240.000<\u002Fspan>\n        <span class=\"sub\"><b>3 orang<\u002Fb> bayar ke kamu<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <nav class=\"tabs\">\n      <button class=\"tab active\">Transaksi<\u002Fbutton>\n      <button class=\"tab\">Saldo<\u002Fbutton>\n      <button class=\"tab\">Ringkasan<\u002Fbutton>\n    <\u002Fnav>\n   <\u002Fheader>${netbar}`;\n}\n\nfunction txRow(t){\n  const eff = t.kind===\"pos\" ? \"pos\" : \"neg\";\n  const sign = t.amt>0 ? \"+\" : \"\\u2212\";\n  const failBlock = t.showFail ? `\n    <div class=\"txfail\">\n      ${ic('warn')}\n      <span class=\"fill\">Perubahan baris ini <b>gagal tersimpan<\u002Fb>. Yang lain aman.<\u002Fspan>\n      <button class=\"rowbtn\" data-retry=\"${t.id}\">${ic('retry')} Ulangi<\u002Fbutton>\n    <\u002Fdiv>` : \"\";\n  return `\n  <div class=\"txwrap\" data-row=\"${t.id}\">\n    <div class=\"txback\">${ic('trash')} Hapus<\u002Fdiv>\n    <div class=\"tx ${t.showFail?'is-failed':''}\" data-tx=\"${t.id}\">\n      <div class=\"cat\" style=\"--cat:${t.cat}\">${t.emo}<\u002Fdiv>\n      <div class=\"tx-main\">\n        <div class=\"tx-title\">${t.title}<\u002Fdiv>\n        <div class=\"tx-meta\"><span class=\"payer\">${t.payer}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tx-eff ${eff}\"><span class=\"eff-amt num\">${sign}${rp(t.amt)}<\u002Fspan><span class=\"eff-lbl\">${t.lbl}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    ${failBlock}\n  <\u002Fdiv>`;\n}\n\nfunction screenTransaksi(opts={}){\n  opts=opts||{};\n  const rows = TX.map(t=>txRow(Object.assign({},t,{showFail: opts.failId===t.id}))).join(\"\");\n  $(\"#screenTop\").innerHTML = ghead({ title:\"Trip Bali 2026\", netbar: opts.netbar||\"\" });\n  $(\"#screenBody\").className = \"body scr\";\n  $(\"#screenBody\").innerHTML = `\n    <div class=\"daysep\"><span class=\"d\">Hari ini<\u002Fspan><span class=\"s num\">Rp 3.957.000<\u002Fspan><\u002Fdiv>\n    <div class=\"group\" id=\"txGroup\">${rows}<\u002Fdiv>`;\n  $(\"#screenBottom\").innerHTML = `\n    <div class=\"fab\">\n      <button class=\"fab-scan\" aria-label=\"Scan struk\">&#128247;<\u002Fbutton>\n      <button class=\"fab-main\"><span class=\"plus\">+<\u002Fspan>Tambah<\u002Fbutton>\n    <\u002Fdiv>`;\n  bindSwipe();\n}\n\nfunction screenTambah(opts={}){\n  $(\"#screenTop\").innerHTML = `\n    <div class=\"topbar\">\n      <button class=\"txt ghost\">Batal<\u002Fbutton>\n      <h1>Tambah pengeluaran<\u002Fh1>\n      <span style=\"min-width:56px\"><\u002Fspan>\n    <\u002Fdiv>`;\n  $(\"#screenBody\").className = \"body scr\";\n  $(\"#screenBody\").innerHTML = `\n    <div class=\"form\">\n      <div class=\"amountbox\">\n        <div class=\"lbl\">Jumlah<\u002Fdiv>\n        <div class=\"val num\"><span class=\"rp\">Rp<\u002Fspan>240.000<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"field\"><span class=\"k\">Judul<\u002Fspan><span class=\"v\">Makan malam Jimbaran<\u002Fspan><\u002Fdiv>\n      <div class=\"field\"><span class=\"k\">Dibayar oleh<\u002Fspan><span class=\"v\" style=\"display:flex;align-items:center;gap:8px\"><span class=\"av2\" style=\"--av:var(--m-7)\">N<\u002Fspan>Kamu<\u002Fspan><span class=\"chev\">&#8250;<\u002Fspan><\u002Fdiv>\n      <div class=\"field\"><span class=\"k\">Dibagi ke<\u002Fspan>\n        <span class=\"v splitrow\">\n          <span class=\"av2\" style=\"--av:var(--m-7)\">N<\u002Fspan><span class=\"av2\" style=\"--av:var(--m-8)\">F<\u002Fspan>\n          <span class=\"av2\" style=\"--av:var(--m-11)\">S<\u002Fspan><span class=\"av2\" style=\"--av:var(--m-2)\">D<\u002Fspan>\n        <\u002Fspan><span class=\"chev\">&#8250;<\u002Fspan><\u002Fdiv>\n      <div class=\"field\"><span class=\"k\">Kategori<\u002Fspan><span class=\"v\">&#127869; Makan<\u002Fspan><span class=\"chev\">&#8250;<\u002Fspan><\u002Fdiv>\n      <div class=\"field\"><span class=\"k\">Catatan<\u002Fspan><span class=\"v ph\">Opsional<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>`;\n  const savefail = opts.savefail ? `\n    <div class=\"savefail\">\n      ${ic('warn')}\n      <span class=\"g\"><b>Gagal menyimpan.<\u002Fb> Pengeluaran belum tercatat — koneksi putus di tengah jalan. Datanya masih ada di form ini.<\u002Fspan>\n      <button class=\"rowbtn\" data-savefail-retry>${ic('retry')} Ulangi<\u002Fbutton>\n    <\u002Fdiv>` : \"\";\n  $(\"#screenBottom\").innerHTML = `\n    <div class=\"bottombar\">\n      ${savefail}\n      <button class=\"btn btn--primary\" id=\"saveBtn\">Simpan pengeluaran<\u002Fbutton>\n    <\u002Fdiv>`;\n  const rb = $(\"[data-savefail-retry]\");\n  if(rb) rb.addEventListener(\"click\", ()=>{\n    const b=$(\"#saveBtn\"); b.disabled=true; b.innerHTML=`<span class=\"spin\"><\u002Fspan> Menyimpan…`;\n    setTimeout(()=>{ b.disabled=false; b.innerHTML=\"Tersimpan \\u2713\"; },1400);\n    const sf=$(\".savefail\"); if(sf) sf.remove();\n  });\n}\n\nfunction screenMember(opts={}){\n  $(\"#screenTop\").innerHTML = `\n    <div class=\"topbar\">\n      <button class=\"icobtn\" aria-label=\"Kembali\" style=\"color:var(--brand)\">&#8249;<\u002Fbutton>\n      <h1>Kelola member<\u002Fh1>\n      <button class=\"txt\">Tambah<\u002Fbutton>\n    <\u002Fdiv>`;\n  $(\"#screenBody\").className = \"body scr\";\n  const rows = MEMBERS.map(m=>{\n    const dis = opts.disabledId===m.id;\n    const canRemove = !m.locked;\n    const remBtn = dis\n      ? `<span class=\"mact\" style=\"color:var(--text-muted);border-color:transparent;background:transparent;font-size:var(--fs-caption)\">Nonaktif<\u002Fspan>`\n      : canRemove\n        ? `<button class=\"mact rem\" data-remove=\"${m.id}\" aria-label=\"Hapus ${m.first}\">${ic('trash')}<\u002Fbutton>`\n        : `<button class=\"mact rem\" data-locked=\"${m.id}\" aria-label=\"Hapus ${m.first}\">${ic('trash')}<\u002Fbutton>`;\n    const sub = dis ? `${ic('ban')} Dinonaktifkan · transaksinya tetap`\n      : m.locked ? `${ic('lock')} ${m.role}` : m.role;\n    return `\n    <div class=\"mcard ${m.locked?'locked':''} ${dis?'disabled-m':''}\">\n      <span class=\"avatar\" style=\"--c:${m.c}\">${m.ini}<\u002Fspan>\n      <div class=\"mi\">\n        <div class=\"mn\">${m.name}${m.id==='me'?'<span class=\"you\">kamu<\u002Fspan>':''}<\u002Fdiv>\n        <div class=\"ms\">${sub}<\u002Fdiv>\n      <\u002Fdiv>\n      ${remBtn}\n    <\u002Fdiv>`;\n  }).join(\"\");\n  $(\"#screenBody\").innerHTML = `<div class=\"mlist\">${rows}\n    <div class=\"explain\" id=\"memberExplain\" hidden><\u002Fdiv>\n  <\u002Fdiv>`;\n  $(\"#screenBottom\").innerHTML = \"\";\n  $(\"#screenBody\").querySelectorAll(\"[data-locked]\").forEach(b=>b.addEventListener(\"click\",()=>explainLocked(b.dataset.locked)));\n  $(\"#screenBody\").querySelectorAll(\"[data-remove]\").forEach(b=>b.addEventListener(\"click\",()=>{\n    const c=b.closest(\".mcard\"); c.querySelector(\".ms\").innerHTML=`Dihapus dari grup`; c.classList.add(\"disabled-m\"); b.replaceWith(document.createTextNode(\"\"));\n  }));\n}\nfunction explainLocked(id){\n  const m = MEMBERS.find(x=>x.id===id);\n  const box = $(\"#memberExplain\"); if(!box) return;\n  box.hidden=false;\n  box.innerHTML = `\n    <span class=\"ic\">${ic('lock')}<\u002Fspan>\n    <div>\n      <b>${m.first} nggak bisa dihapus.<\u002Fb> Dia sudah tercatat di <b>${m.tx} transaksi<\u002Fb> — kalau dibuang, angka bagian orang lain jadi salah dan riwayatnya bolong.\n      <br>Yang bisa: <b>nonaktifkan<\u002Fb> dia. Namanya tetap di transaksi lama, tapi nggak muncul lagi buat pengeluaran baru.\n      <span class=\"disable-link\" data-disable=\"${m.id}\">${ic('ban')} Nonaktifkan ${m.first}<\u002Fspan>\n    <\u002Fdiv>`;\n  box.scrollIntoView && box.scrollIntoView({block:\"nearest\"});\n  const dl=box.querySelector(\"[data-disable]\");\n  dl.addEventListener(\"click\",()=>{ setState(5, {disabledId:m.id}); });\n}\n\nfunction screenJoin(opts={}){\n  $(\"#screenTop\").innerHTML = `\n    <div class=\"topbar\">\n      <button class=\"icobtn\" aria-label=\"Tutup\" style=\"color:var(--brand)\">&times;<\u002Fbutton>\n      <h1>Buka grup<\u002Fh1>\n      <span style=\"min-width:56px\"><\u002Fspan>\n    <\u002Fdiv>`;\n  $(\"#screenBody\").className = \"body scr\";\n  if(opts.fail){\n    $(\"#screenBody\").innerHTML = `\n      <div class=\"loadfail\">\n        <div class=\"art\">${ic('cloud')}<\u002Fdiv>\n        <h2>Grup ini gagal dimuat<\u002Fh2>\n        <p>Undangan Trip Bali 2026 ada di server, tapi HP-mu lagi nggak bisa nyambung. Data grupmu yang lain tetap kebuka seperti biasa.<\u002Fp>\n        <button class=\"btn btn--primary\" id=\"reloadBtn\">${ic('retry')} Muat ulang<\u002Fbutton>\n      <\u002Fdiv>`;\n    $(\"#reloadBtn\").addEventListener(\"click\",()=>setState(10));\n  } else {\n    $(\"#screenBody\").innerHTML = `\n      <div class=\"loadwrap\">\n        <div class=\"loadhead\"><span class=\"spin\"><\u002Fspan> Mengambil Trip Bali 2026 dari undangan…<\u002Fdiv>\n        <div class=\"sk sk-card\"><\u002Fdiv>\n        <div class=\"sk sk-line\" style=\"width:60%\"><\u002Fdiv>\n        <div class=\"sk sk-line\" style=\"width:90%\"><\u002Fdiv>\n        <div class=\"sk sk-card\" style=\"margin-top:16px\"><\u002Fdiv>\n        <div class=\"sk sk-line\" style=\"width:75%\"><\u002Fdiv>\n        <div class=\"sk sk-line\" style=\"width:45%\"><\u002Fdiv>\n      <\u002Fdiv>`;\n  }\n  $(\"#screenBottom\").innerHTML = \"\";\n}\n\n/* ============================================================\n   NETBAR (offline tenang / sinkron / beres)\n   ============================================================ */\nfunction netbarHTML(kind){\n  if(kind===\"offline\") return `\n    <div class=\"netbar\">\n      ${ic('off')}\n      <span><b>2 perubahan<\u002Fb> belum sampai ke Farhan, Sarah &amp; 2 lainnya<\u002Fspan>\n      <span class=\"pill\">Tersimpan di HP<\u002Fspan>\n    <\u002Fdiv>`;\n  if(kind===\"sync\") return `\n    <div class=\"netbar sync\">\n      <span class=\"spin\"><\u002Fspan>\n      <span>Online lagi — <b>mengirim 2 perubahan…<\u002Fb><\u002Fspan>\n    <\u002Fdiv>`;\n  if(kind===\"done\") return `\n    <div class=\"netbar done\">\n      ${ic('check')}\n      <span><b>Semua tersinkron.<\u002Fb> Anggota lain sudah lihat perubahanmu<\u002Fspan>\n    <\u002Fdiv>`;\n  return \"\";\n}\n\n/* ============================================================\n   TOAST UNDO — countdown cincin + angka, tumpuk, jendela terbatas\n   ============================================================ */\nlet pending = [];       // {id, item, row}\nlet cdTimer=null, cdRAF=null;\nconst CIRC = 100.5;     // 2πr, r=16\n\nfunction renderToast(){\n  const zone = $(\"#toastZone\");\n  if(pending.length===0){ zone.innerHTML=\"\"; return; }\n  const last = pending[pending.length-1];\n  const many = pending.length>1;\n  const cnt = many ? `<span class=\"cnt num\">${pending.length}<\u002Fspan>` : \"\";\n  const undoAll = many ? `<button class=\"tundo\" id=\"tUndoAll\">${ic('undo')} Urungkan semua<\u002Fbutton>` : \"\";\n  zone.innerHTML = `\n    <div class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\n      <div class=\"cd\">\n        <svg viewBox=\"0 0 44 44\"><circle class=\"track\" cx=\"22\" cy=\"22\" r=\"16\"/><circle class=\"prog\" id=\"cdProg\" cx=\"22\" cy=\"22\" r=\"16\"/><\u002Fsvg>\n        <span class=\"n num\" id=\"cdNum\">6<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"tmsg\">${many?`${pending.length} transaksi dihapus`:`&ldquo;${last.item.title}&rdquo; dihapus`}<span class=\"sub\">${many?'Ketuk urungkan untuk tarik yang terakhir':'Bisa ditarik lagi sebentar'}<\u002Fspan><\u002Fdiv>\n      ${cnt}\n      <button class=\"tundo\" id=\"tUndo\">${ic('undo')} Urungkan<\u002Fbutton>\n    <\u002Fdiv>\n    ${undoAll}`;\n  requestAnimationFrame(()=>{ const t=$(\"#toast\"); if(t) t.classList.add(\"show\"); });\n  $(\"#tUndo\").addEventListener(\"click\", undoLast);\n  const ua=$(\"#tUndoAll\"); if(ua) ua.addEventListener(\"click\", undoAllFn);\n}\n\nfunction startCountdown(remainingMs){\n  const total = remainingMs!=null ? remainingMs : parseFloat(getComputedStyle(document.documentElement).getPropertyValue(\"--dur-undo\"))||6000;\n  const prog=$(\"#cdProg\"), num=$(\"#cdNum\"), toast=$(\"#toast\");\n  if(!prog) return;\n  const start = performance.now();\n  cancelAnimationFrame(cdRAF); clearInterval(cdTimer);\n  function frame(now){\n    const el = now-start;\n    const frac = Math.max(0, 1 - el/total);\n    prog.style.strokeDashoffset = (CIRC*(1-frac)).toFixed(1);\n    const left = Math.ceil((total-el)/1000);\n    num.textContent = Math.max(0,left);\n    toast.classList.toggle(\"ending\", (total-el) <= 2100);\n    if(el < total) cdRAF=requestAnimationFrame(frame); else commitPending();\n  }\n  cdRAF=requestAnimationFrame(frame);\n  // Untuk prefers-reduced-motion RAF tetap jalan (hanya CSS transition/anim yang dipangkas),\n  // jadi angka countdown tetap turun walau cincin tak \"mengalir\".\n}\n\nfunction deleteTx(id, opts={}){\n  const idx = TX.findIndex(t=>t.id===id); if(idx<0) return;\n  const item = TX[idx];\n  const wrap = document.querySelector(`.txwrap[data-row=\"${id}\"]`);\n  if(wrap){ wrap.style.maxHeight = wrap.scrollHeight+\"px\"; requestAnimationFrame(()=>wrap.classList.add(\"gone\")); }\n  TX.splice(idx,1);\n  pending.push({ id, item, idx });\n  renderToast();\n  startCountdown(opts.remainingMs);\n}\nfunction undoLast(){\n  const p = pending.pop(); if(!p) return;\n  TX.splice(Math.min(p.idx, TX.length), 0, p.item);\n  reflowTx();\n  if(pending.length){ renderToast(); startCountdown(); } else { hideToast(); }\n}\nfunction undoAllFn(){\n  // kembalikan sesuai urutan asal\n  pending.sort((a,b)=>a.idx-b.idx).forEach(p=> TX.splice(Math.min(p.idx,TX.length),0,p.item));\n  pending=[]; reflowTx(); hideToast();\n}\nfunction commitPending(){ pending=[]; hideToast(); }\nfunction hideToast(){ cancelAnimationFrame(cdRAF); clearInterval(cdTimer); const t=$(\"#toast\"); if(t){ t.classList.remove(\"show\"); setTimeout(()=>{ if(pending.length===0) $(\"#toastZone\").innerHTML=\"\"; },260); } else $(\"#toastZone\").innerHTML=\"\"; }\nfunction reflowTx(){\n  const g=$(\"#txGroup\"); if(!g) return;\n  g.innerHTML = TX.map(t=>txRow(t)).join(\"\");\n  bindSwipe();\n}\n\n/* ---- swipe untuk hapus (reversible → gestur aman) ---- */\nfunction bindSwipe(){\n  document.querySelectorAll(\".tx[data-tx]\").forEach(tx=>{\n    let x0=null, dx=0, active=false;\n    const wrap = tx.closest(\".txwrap\");\n    tx.addEventListener(\"pointerdown\",e=>{ if(e.target.closest(\"[data-retry]\"))return; x0=e.clientX; active=true; tx.style.transition=\"none\"; tx.setPointerCapture&&tx.setPointerCapture(e.pointerId); });\n    tx.addEventListener(\"pointermove\",e=>{ if(!active)return; dx=Math.min(0, e.clientX-x0); tx.style.transform=`translateX(${dx}px)`; });\n    function end(){ if(!active)return; active=false; tx.style.transition=\"transform var(--dur-tap) var(--ease)\";\n      if(dx < -90){ tx.style.transform=\"translateX(-100%)\"; setTimeout(()=>deleteTx(tx.dataset.tx),120); }\n      else tx.style.transform=\"translateX(0)\"; dx=0; }\n    tx.addEventListener(\"pointerup\",end); tx.addEventListener(\"pointercancel\",end);\n  });\n}\n\n/* ============================================================\n   SHEET konfirmasi hapus grup — permanen, berat, jebak fokus\n   ============================================================ */\nlet lastFocus=null;\nfunction openGroupDelete(){\n  const sheet=$(\"#sheet\");\n  sheet.innerHTML = `\n    <div class=\"grab\"><\u002Fdiv>\n    <span class=\"danger-badge\">${ic('warn')} Permanen · tak bisa ditarik<\u002Fspan>\n    <div class=\"sheet-title\">Hapus grup Trip Bali 2026?<\u002Fdiv>\n    <div class=\"sheet-sub\">Ini beda dari menghapus satu transaksi. Grup dan seluruh isinya hilang buat <b>semua anggota<\u002Fb>, dan <b>nggak ada tombol urungkan<\u002Fb> setelah ini.<\u002Fdiv>\n    <ul class=\"losing\">\n      <li>${ic('receipt')} <span><b>29 transaksi<\u002Fb> &amp; 6 pelunasan<\u002Fspan><\u002Fli>\n      <li>${ic('warn')} <span>Saldo berjalan <b>5 orang<\u002Fb><\u002Fspan><\u002Fli>\n      <li>${ic('trash')} <span>Struk &amp; catatan yang menempel<\u002Fspan><\u002Fli>\n    <\u002Ful>\n    <div class=\"irrev\">${ic('lock')} Anggota lain akan lihat grup ini hilang tanpa pemberitahuan. Simpan dulu ringkasannya kalau masih perlu.<\u002Fdiv>\n    <button class=\"holdbtn\" id=\"holdBtn\"><span class=\"fill\"><\u002Fspan>${ic('trash')}<span class=\"lab\">Tahan untuk hapus permanen<\u002Fspan><\u002Fbutton>\n    <div class=\"holdhint\">Tahan tombol ~1 detik — biar nggak kepencet nggak sengaja<\u002Fdiv>\n    <button class=\"btn btn--secondary\" id=\"cancelDelete\">Batal, simpan grupnya<\u002Fbutton>`;\n  $(\"#scrim\").classList.add(\"is-open\");\n  lastFocus=document.activeElement;\n  bindHold($(\"#holdBtn\"));\n  $(\"#cancelDelete\").addEventListener(\"click\", closeSheet);\n  trapFocus(sheet);\n  setTimeout(()=>$(\"#cancelDelete\").focus(),80);\n}\nfunction closeSheet(){ $(\"#scrim\").classList.remove(\"is-open\"); releaseTrap(); if(lastFocus&&lastFocus.focus)lastFocus.focus(); }\n$(\"#scrim\").addEventListener(\"click\",e=>{ if(e.target.id===\"scrim\") closeSheet(); });\n\nfunction bindHold(btn){\n  let t=null, done=false;\n  const start=(e)=>{ if(e&&e.type===\"keydown\"&&e.repeat)return; if(done)return; btn.classList.add(\"holding\");\n    t=setTimeout(()=>{ done=true; btn.classList.remove(\"holding\"); btn.querySelector(\".lab\").textContent=\"Grup dihapus\";\n      btn.querySelector(\".fill\").style.transition=\"none\"; btn.querySelector(\".fill\").style.width=\"100%\"; btn.style.background=\"var(--risk-high)\"; btn.querySelector(\".lab\").style.color=\"#fff\";\n      setTimeout(()=>{ closeSheet(); setState(0); }, 650); }, parseFloat(getComputedStyle(document.documentElement).getPropertyValue(\"--dur-hold\"))||1100); };\n  const cancel=()=>{ if(done)return; clearTimeout(t); btn.classList.remove(\"holding\"); };\n  btn.addEventListener(\"pointerdown\",start); btn.addEventListener(\"pointerup\",cancel); btn.addEventListener(\"pointerleave\",cancel); btn.addEventListener(\"pointercancel\",cancel);\n  btn.addEventListener(\"keydown\",e=>{ if(e.key===\" \"||e.key===\"Enter\"){ e.preventDefault(); start(e);} });\n  btn.addEventListener(\"keyup\",e=>{ if(e.key===\" \"||e.key===\"Enter\"){ cancel(); } });\n}\n\n/* focus trap sederhana */\nlet trapHandler=null;\nfunction trapFocus(container){\n  const sel='button,[href],input,select,textarea,[tabindex]:not([tabindex=\"-1\"])';\n  trapHandler=(e)=>{\n    if(e.key===\"Escape\"){ closeSheet(); return; }\n    if(e.key!==\"Tab\")return;\n    const f=[...container.querySelectorAll(sel)].filter(el=>el.offsetParent!==null);\n    if(!f.length)return; const first=f[0], last=f[f.length-1];\n    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }\n    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }\n  };\n  document.addEventListener(\"keydown\",trapHandler);\n}\nfunction releaseTrap(){ if(trapHandler){ document.removeEventListener(\"keydown\",trapHandler); trapHandler=null; } }\n\n/* ============================================================\n   STATES (10) — tiap keadaan di atas layar paling masuk akal\n   ============================================================ */\nconst STATES = [\n  { key:\"undo\",     label:\"Baru dihapus · undo aktif\",       badge:\"Transaksi\" },\n  { key:\"undoend\",  label:\"Undo hampir habis waktunya\",      badge:\"Transaksi\" },\n  { key:\"undo2\",    label:\"Dua penghapusan beruntun\",        badge:\"Transaksi\" },\n  { key:\"groupdel\", label:\"Konfirmasi hapus grup\",           badge:\"Sheet\" },\n  { key:\"member\",   label:\"Member tak bisa dihapus\",         badge:\"Member\" },\n  { key:\"offline\",  label:\"Offline · ada member lain\",       badge:\"Detail\" },\n  { key:\"synced\",   label:\"Kembali online · terkirim\",       badge:\"Detail\" },\n  { key:\"savefail\", label:\"Simpan gagal\",                    badge:\"Tambah\" },\n  { key:\"rowfail\",  label:\"Satu baris gagal di daftar\",      badge:\"Transaksi\" },\n  { key:\"loading\",  label:\"Memuat dari jaringan\",            badge:\"Join\" },\n];\nconst NOTES_BY_STATE = {\n  undo:\"Buang lewat geser baris ke kiri (coba di layar) atau ketuk. Toast duduk di ATAS FAB, tak nutup total. Cincin + angka menghitung mundur; ganti keadaan = komit (undo hilang saat pindah layar).\",\n  undoend:\"Sisa waktu diperlihatkan lewat cincin yang hampir habis + warna menghangat — cukup buat sadar, tanpa memaksa panik.\",\n  undo2:\"Dua hapus beruntun menumpuk jadi satu toast: hitungnya di badge, timer di-set ulang, ada Urungkan (yang terakhir) dan Urungkan semua.\",\n  groupdel:\"Permanen. Bukan konfirmasi remeh: daftar apa yang hilang + tahan-untuk-hapus (gestur yang tak mungkin kepencet). Fokus terjebak; Esc = batal.\",\n  member:\"Bukan konfirmasi — penjelasan. Farhan punya transaksi, jadi tombol hapus netral (bukan merah) dan mengarah ke Nonaktifkan. Andi (0 transaksi) tetap bisa dihapus.\",\n  offline:\"Netral, bukan merah. Hanya menyebut 'ada perubahan belum sampai' dan hanya di grup ber-anggota. Ngetik tetap jalan.\",\n  synced:\"Jaringan balik → pita berubah 'mengirim…' lalu 'tersinkron'. Tanpa ini orang tak pernah tahu sudah aman.\",\n  savefail:\"Ada jalan keluar: Ulangi. Inline di atas tombol Simpan, tak menimpanya. Data form tetap ada. Tak menyalahkan, tak minta maaf.\",\n  rowfail:\"Kegagalan satu baris tinggal di baris itu — layar tak jadi halaman error. Ulangi khusus baris tsb.\",\n  loading:\"Satu-satunya yang benar-benar nunggu jaringan (buka grup dari undangan). Data lokal TAK pernah punya spinner. Tekan lagi tombol untuk lihat versi gagal-muat → Muat ulang.\",\n};\n\nfunction resetScreen(){ $(\"#toastZone\").innerHTML=\"\"; pending=[]; cancelAnimationFrame(cdRAF); clearInterval(cdTimer); closeSheet(); $(\"#statusR\").classList.remove(\"is-off\"); }\n\nfunction setState(i, extra){\n  extra=extra||{};\n  document.querySelectorAll(\"#devStates .dev-btn\").forEach((b,idx)=>b.classList.toggle(\"is-active\", idx===i));\n  const st = STATES[i]; resetScreen();\n  // reset TX kalau bukan lanjutan hapus\n  TX = [\n    { id:\"t1\", cat:\"var(--m-2)\", emo:\"\\u{1F357}\", title:\"Sate Padang Ajo Ramon\",  payer:\"Andi bayar\",   amt:-60000,   lbl:\"bagianmu\", kind:\"neg\" },\n    { id:\"t2\", cat:\"var(--m-3)\", emo:\"\\u2615\",     title:\"Kopi Kenangan · 4 gelas\", payer:\"Kamu bayar\",   amt: 72000,   lbl:\"buat kamu\", kind:\"pos\" },\n    { id:\"t3\", cat:\"var(--m-8)\", emo:\"\\u{1F3DD}\",  title:\"Sewa villa Uluwatu 3 malam\", payer:\"Farhan bayar\", amt:-3750000, lbl:\"bagianmu\", kind:\"neg\" },\n    { id:\"t4\", cat:\"var(--m-6)\", emo:\"\\u26FD\",     title:\"Bensin + tol Denpasar\",  payer:\"Farhan bayar\", amt:-75000,   lbl:\"bagianmu\", kind:\"neg\" },\n  ];\n  $(\"#devNote\").textContent = NOTES_BY_STATE[st.key] || \"\";\n\n  switch(st.key){\n    case \"undo\":\n      screenTransaksi(); $(\"#toastZone\").className=\"toastzone above-fab\";\n      setTimeout(()=>deleteTx(\"t1\"),120); break;\n    case \"undoend\":\n      screenTransaksi(); $(\"#toastZone\").className=\"toastzone above-fab\";\n      setTimeout(()=>deleteTx(\"t1\",{remainingMs:1600}),120); break;\n    case \"undo2\":\n      screenTransaksi(); $(\"#toastZone\").className=\"toastzone above-fab\";\n      setTimeout(()=>{ deleteTx(\"t1\"); setTimeout(()=>deleteTx(\"t4\"),400); },120); break;\n    case \"groupdel\":\n      screenTransaksi(); $(\"#toastZone\").className=\"toastzone above-fab\"; openGroupDelete(); break;\n    case \"member\":\n      screenMember({disabledId: extra.disabledId}); break;\n    case \"offline\":\n      screenTransaksi({netbar: netbarHTML(\"offline\")}); $(\"#toastZone\").className=\"toastzone above-fab\"; break;\n    case \"synced\":\n      screenTransaksi({netbar: netbarHTML(\"sync\")}); $(\"#toastZone\").className=\"toastzone above-fab\";\n      $(\"#statusR\").classList.add(\"is-off\");\n      setTimeout(()=>{ $(\"#statusR\").classList.remove(\"is-off\");\n        const nb=$(\"#screenTop .netbar\"); if(nb) nb.outerHTML=netbarHTML(\"done\");\n      },1900); break;\n    case \"savefail\":\n      screenTambah({savefail:true}); $(\"#toastZone\").className=\"toastzone above-bar\"; break;\n    case \"rowfail\":\n      screenTransaksi({failId:\"t3\"}); $(\"#toastZone\").className=\"toastzone above-fab\";\n      const rb=document.querySelector('[data-retry=\"t3\"]');\n      if(rb) rb.addEventListener(\"click\",()=>{\n        rb.innerHTML=`<span class=\"spin\" style=\"width:12px;height:12px;border-width:2px\"><\u002Fspan> Mengulang…`;\n        setTimeout(()=>{ const w=document.querySelector('.txwrap[data-row=\"t3\"]'); if(w){ w.querySelector('.txfail')?.remove(); w.querySelector('.tx')?.classList.remove('is-failed'); } },1300);\n      }); break;\n    case \"loading\":\n      screenJoin({fail: extra.fail}); $(\"#toastZone\").className=\"toastzone above-fab\"; break;\n  }\n}\n\n/* dev switcher */\nSTATES.forEach((s,i)=>{\n  const b=document.createElement(\"button\");\n  b.className=\"dev-btn\"; b.innerHTML=`<span class=\"k\">${i+1}<\u002Fspan>${s.label}<span class=\"badge\">${s.badge}<\u002Fspan>`;\n  b.addEventListener(\"click\",()=>{\n    // keadaan \"loading\" kedua kali → tunjukkan gagal-muat\n    if(STATES[i].key===\"loading\" && b.classList.contains(\"is-active\")) setState(i,{fail:true});\n    else setState(i);\n  });\n  $(\"#devStates\").appendChild(b);\n});\n\n/* theme */\nfunction applyTheme(t){\n  document.documentElement.setAttribute(\"data-theme\",t);\n  document.querySelectorAll(\"[data-theme-btn]\").forEach(x=>x.classList.toggle(\"is-active\",x.dataset.themeBtn===t));\n  $(\"#themeBtn\").textContent = t===\"dark\"?\"Terang\":\"Gelap\";\n}\nfunction toggleTheme(){ applyTheme(document.documentElement.getAttribute(\"data-theme\")===\"dark\"?\"light\":\"dark\"); }\ndocument.querySelectorAll(\"[data-theme-btn]\").forEach(b=>b.addEventListener(\"click\",()=>applyTheme(b.dataset.themeBtn)));\n\n/* init */\nsetState(0);\n\n/* ---- design notes ---- */\n$(\"#notes\").innerHTML = `\n<h3>Catatan desain — Lapisan sistem<\u002Fh3>\n<p>Bukan katalog komponen. Sepuluh keadaan yang muncul <b>di atas layar nyata<\u002Fb> (Transaksi, Tambah, Kelola Member, Buka Grup) — karena yang paling sering salah bukan bentuk polanya, tapi caranya bertabrakan dengan yang sudah menempati layar (FAB, bilah tombol, header, daftar).<\u002Fp>\n\n<h4>Tangga bahaya — satu tangga, beberapa anak<\u002Fh4>\n<p>Empat penghapusan, ongkos beda kalau salah, jadi treatment-nya beda dan terlihat sebelum dibaca:<\u002Fp>\n<ul>\n  <li><b>Reversible<\u002Fb> (pengeluaran, pelunasan) → langsung buang, <b>undo<\u002Fb> menyusul. Geser baris = boleh, karena bisa ditarik lagi. Warna tenang (brand). Token <code>--risk-low<\u002Fcode>.<\u002Fli>\n  <li><b>Permanen<\u002Fb> (hapus grup) → sheet berat: daftar yang hilang + <b>tahan-untuk-hapus<\u002Fb>. Gestur sengaja pilih yang <i>tak mungkin<\u002Fi> kepencet. Merah kuat, <code>--risk-high<\u002Fcode>.<\u002Fli>\n  <li><b>Terkunci<\u002Fb> (member ber-transaksi) → <b>bukan<\u002Fb> konfirmasi, tapi <b>penjelasan<\u002Fb> kenapa tombol tak melakukan yang dikira, lalu arahkan ke Nonaktifkan. Warna <b>netral<\u002Fb> bukan merah (ini bukan bahaya, cuma tak bisa), <code>--risk-locked<\u002Fcode>.<\u002Fli>\n<\u002Ful>\n\n<h4>Undo & waktunya<\u002Fh4>\n<p>Jendela <code>--dur-undo: 6s<\u002Fcode> — cukup buat sadar, tak bikin buru-buru. Sisa waktu berbentuk <b>cincin + angka<\u002Fb>, jauh lebih cepat dibaca dari kalimat; menjelang habis cincin menipis &amp; menghangat (<code>--warn<\u002Fcode>). <b>Dua hapus beruntun<\u002Fb> menumpuk jadi satu toast (badge hitung, timer di-set ulang, Urungkan / Urungkan semua). <b>Pindah layar = komit<\u002Fb>: ganti keadaan menutup jendela undo — ditunjukkan, bukan dinarasikan.<\u002Fp>\n\n<h4>Offline tenang vs gagal butuh-tindakan<\u002Fh4>\n<p>Offline <b>bukan kondisi rusak<\u002Fb>: pita <b>netral abu<\u002Fb> (bukan merah, bukan spanduk), cuma menyebut \"ada perubahan belum sampai\", dan <b>hanya<\u002Fb> di grup ber-anggota lain — di grup pribadi tak ditampilkan sama sekali. Ngetik jalan terus. Saat online balik: pita jadi <b>\"mengirim…\"<\u002Fb> (brand) lalu <b>\"tersinkron\"<\u002Fb> (pos) — tanpa itu orang tak pernah tahu sudah aman. Token <code>--offline-*<\u002Fcode> / <code>--sync-*<\u002Fcode> / <code>--fail-*<\u002Fcode> memisahkan tenang dari butuh-tindakan.<\u002Fp>\n\n<h4>Gagal — masing-masing beda jalan keluar<\u002Fh4>\n<p><b>Simpan gagal<\u002Fb> → <b>Ulangi<\u002Fb> (inline di atas tombol Simpan, tak menimpanya, data form tetap). <b>Muat gagal<\u002Fb> → <b>Muat ulang<\u002Fb> (layar penuh, khusus yang nunggu jaringan). <b>Baris gagal<\u002Fb> → tinggal di baris itu, layar tak jadi halaman error. Tak ada teks yang menyalahkan atau minta maaf: sebut apa yang terjadi + apa yang bisa dilakukan.<\u002Fp>\n\n<h4>Memuat<\u002Fh4>\n<p>Skeleton <b>hanya<\u002Fb> di layar yang benar-benar nunggu jaringan (buka grup dari undangan). Data lokal sudah ada → tak pernah ada spinner. Tekan tombol \"Memuat\" lagi untuk lihat versi <b>gagal-muat<\u002Fb>.<\u002Fp>\n\n<h4>Batasan yang dipatuhi<\u002Fh4>\n<ul>\n  <li><b>Toast di atas<\u002Fb> FAB / bilah tombol, tak menutupi tombol yang mungkin dituju maupun angka total. Undo ≥ 44px.<\u002Fli>\n  <li>Aksi merusak tak sebaris tombol simpan di layar lain (Simpan di bawah-tengah; hapus grup di sheet terpisah).<\u002Fli>\n  <li>Bukan cuma merah: tiap penanda punya ikon + kata (Hapus, Nonaktif, Offline, Ulangi, Permanen).<\u002Fli>\n  <li>Konfirmasi dibuat langka: cuma untuk yang permanen. Reversible pakai undo, terkunci pakai penjelasan.<\u002Fli>\n  <li>Fokus keyboard terlihat (<code>:focus-visible<\u002Fcode>); sheet hapus grup menjebak fokus &amp; Esc menutup.<\u002Fli>\n  <li><code>prefers-reduced-motion<\u002Fcode> dihormati; countdown angka tetap terbaca tanpa animasi (digerakkan JS, bukan CSS).<\u002Fli>\n<\u002Ful>\n\n<h4>Token baru (disusul ke tokens.css)<\u002Fh4>\n<ul>\n  <li><b>Durasi terpisah:<\u002Fb> <code>--dur-undo<\u002Fcode> (6s), <code>--dur-toast<\u002Fcode> (3.2s), <code>--dur-move<\u002Fcode> (260ms, transisi elemen sistem), <code>--dur-hold<\u002Fcode> (1.1s, tahan-hapus) — tak menumpang satu sama lain.<\u002Fli>\n  <li><b>Tangga bahaya:<\u002Fb> <code>--risk-low / --risk-high / --risk-high-strong / --risk-locked<\u002Fcode> (+ tint). Yang sebelumnya belum ada tokennya.<\u002Fli>\n  <li><b>Offline vs gagal:<\u002Fb> <code>--offline-* <\u002Fcode> (tenang, netral), <code>--sync-* / --syncdone-*<\u002Fcode> (kembali online), <code>--fail-*<\u002Fcode> (butuh tindakan). Pembeda yang brief bilang belum ada.<\u002Fli>\n  <li><code>--focus-ring<\u002Fcode> untuk cincin fokus konsisten.<\u002Fli>\n<\u002Ful>\n<p>Sisanya murni dari <code>tokens.css<\u002Fcode> — surface, border, teks, brand, pos/neg/warn, elevasi, spacing, radius. Warna kategori tetap diturunkan dari palet member.<\u002Fp>\n`;\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
