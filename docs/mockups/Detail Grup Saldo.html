document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:#12161C; --graph-grid:#242A34;\n}\n\n*{box-sizing:border-box; margin:0; padding:0;}\nbody{font-family:var(--bb-font); background:var(--stage); color:var(--text); -webkit-font-smoothing:antialiased;\n  min-height:100vh; display:flex; flex-direction:column; align-items:center; gap:var(--sp-6); padding:var(--sp-7) var(--sp-4) var(--sp-9);}\n.num{font-variant-numeric:tabular-nums; font-feature-settings:\"tnum\" 1,\"lnum\" 1;}\n.scr::-webkit-scrollbar{width:0; height:0;}\n\n/* ---- page controls ---- */\n.controls{display:flex; align-items:center; gap:var(--sp-3); background:var(--surface); border:1px solid var(--border);\n  border-radius:var(--r-pill); padding:var(--sp-1) var(--sp-1) var(--sp-1) var(--sp-4); box-shadow:var(--elev-1);}\n.controls span{font-size:var(--fs-footnote); font-weight:var(--fw-semibold); color:var(--text-secondary);}\n.controls button{border:none; background:var(--n-2); color:var(--n-8); height:34px; padding:0 var(--sp-4); border-radius:var(--r-pill);\n  font-size:var(--fs-subhead); font-weight:var(--fw-semibold); cursor:pointer; font-family:inherit;}\n\n.stage-row{display:flex; gap:var(--sp-8); align-items:flex-start; justify-content:center; flex-wrap:wrap;}\n\n/* ---- phone frame (mengikuti Transaksi) ---- */\n.phone{width:360px; height:800px; border-radius:44px; background:#000; padding:11px; position:relative;\n  box-shadow:0 30px 70px var(--scrim),0 8px 20px rgba(16,22,30,.18);}\n.screen{width:100%; height:100%; border-radius:34px; overflow:hidden; background:var(--surface-sunken);\n  display:flex; flex-direction:column; position:relative; color:var(--text);}\n.notch{position:absolute; left:50%; top:14px; transform:translateX(-50%); width:118px; height:32px; background:#000; border-radius:20px; z-index:6;}\n\n.statusbar{height:44px; flex:0 0 44px; display:flex; align-items:center; justify-content:space-between; padding:0 var(--sp-6); font-size:var(--fs-subhead);}\n.statusbar .t{font-weight:var(--fw-semibold);}\n.statusbar .r{display:flex; align-items:center; gap:var(--sp-1); font-size:var(--fs-caption);}\n.batt{width:22px; height:11px; border:1.5px solid var(--text); border-radius:3px; position:relative; display:inline-block;}\n.batt::after{content:\"\"; position:absolute; inset:1.5px; right:6px; background:var(--text); border-radius:1px;}\n\n/* ---- group header (SAMA dgn Transaksi) ---- */\n.ghead{flex:0 0 auto; background:var(--surface); border-bottom:1px solid var(--border); padding:var(--sp-1) var(--sp-4) 0; box-shadow:var(--elev-1); z-index:3;}\n.ghead-top{display:flex; align-items:center; gap:var(--sp-2); height:36px;}\n.icobtn{border:none; background:none; color:var(--brand); font-size:26px; line-height:1; cursor:pointer; width:30px; height:30px;\n  display:flex; align-items:center; justify-content:center; padding:0; border-radius:var(--r-pill);}\n.icobtn.menu{font-size:20px; color:var(--text-secondary);}\n.gtitle{flex:1; min-width:0; text-align:center;}\n.gtitle h1{margin:0; font-size:var(--fs-body); font-weight:var(--fw-semibold); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}\n\n.ghead-mid{display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3) 0 var(--sp-4);}\n.avstack{display:flex; flex:0 0 auto;}\n.avstack .av{width:32px; height:32px; border-radius:var(--r-pill); border:2px solid var(--surface); color:#fff;\n  font-size:var(--fs-caption); font-weight:var(--fw-semibold); display:flex; align-items:center; justify-content:center; margin-left:-8px; background:var(--av,var(--n-5));}\n.avstack .av:first-child{margin-left:0;}\n.avstack .more{background:var(--n-3); color:var(--text-secondary);}\n/* Kartu \"posisi kamu\" — SATU-satunya ringkasan; ketuk = di tab ini juga.\n   Nilai & tanda IDENTIK dgn baris saldo \"kamu\" di bawah (bukan susunan beda). */\n.position{flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-end; text-align:right;\n  background:var(--surface-sunken); border:1px solid var(--border); border-radius:var(--r-card); padding:var(--sp-2) var(--sp-3); cursor:pointer;}\n.position.here{border-color:var(--brand); background:color-mix(in srgb,var(--brand) 6%,var(--surface-sunken));}\n.position .lbl{font-size:var(--fs-caption); color:var(--text-muted); display:flex; align-items:center; gap:4px;}\n.position .lbl svg{width:12px; height:12px;}\n.position .amt{font-size:var(--fs-title3); font-weight:var(--fw-bold); letter-spacing:-.01em; line-height:1.15;}\n.position .amt.neg{color:var(--neg-text);} .position .amt.pos{color:var(--pos-text);}\n.position .sub{font-size:var(--fs-caption); color:var(--text-secondary);}\n.position .sub b{color:var(--text); font-weight:var(--fw-semibold);}\n\n/* tabs (SAMA dgn Transaksi) */\n.tabs{display:flex; gap:var(--sp-5);}\n.tab{border:none; background:none; font-family:inherit; font-size:var(--fs-subhead); font-weight:var(--fw-medium);\n  color:var(--text-muted); padding:var(--sp-2) 0 var(--sp-3); cursor:pointer; position:relative;}\n.tab.active{color:var(--text); font-weight:var(--fw-semibold);}\n.tab.active::after{content:\"\"; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--brand); border-radius:var(--r-pill);}\n\n/* ---- scroll body ---- */\n.body{flex:1 1 auto; overflow-y:auto; position:relative; padding-bottom:var(--sp-8);}\n\n/* ---- mode segmented ---- */\n.modewrap{padding:var(--sp-4) var(--sp-4) var(--sp-1); background:var(--surface); border-bottom:1px solid var(--border);}\n.seg{display:flex; background:var(--n-2); border-radius:var(--r-btn); padding:3px; gap:3px;}\n.seg-btn{flex:1; appearance:none; border:none; cursor:pointer; font-family:inherit; font-size:var(--fs-footnote); font-weight:var(--fw-semibold);\n  color:var(--text-secondary); background:transparent; border-radius:8px; padding:8px 6px; min-height:38px;\n  display:flex; align-items:center; justify-content:center; gap:6px; transition:color var(--dur-tap) var(--ease);}\n.seg-btn svg{width:15px; height:15px;}\n.seg-btn.is-active{background:var(--surface); color:var(--text); box-shadow:var(--elev-1);}\n.seg-hint{display:flex; gap:var(--sp-2); align-items:flex-start; margin-top:var(--sp-3); padding-bottom:var(--sp-3);\n  font-size:var(--fs-caption); color:var(--text-secondary); line-height:var(--line-body);}\n.seg-hint svg{width:14px; height:14px; flex:0 0 auto; margin-top:1px; color:var(--text-muted);}\n.seg-hint b{color:var(--text); font-weight:var(--fw-semibold);}\n.seg-count{color:var(--route-text); font-weight:var(--fw-semibold); background:var(--route-tint); border-radius:var(--r-pill); padding:1px 7px; white-space:nowrap;}\n\n/* ---- network diagram ---- */\n.graph{padding:var(--sp-4) var(--sp-4) var(--sp-2); background:var(--surface);}\n.graph-card{background:var(--graph-bg); border:1px solid var(--border); border-radius:var(--r-card); padding:var(--sp-2); position:relative; overflow:hidden;}\n.graph svg{display:block; width:100%; height:auto;}\n.graph-edge-hit{stroke:transparent; stroke-width:26; fill:none; cursor:pointer;}\n.graph-edge{fill:none; stroke-linecap:round; pointer-events:none; transition:opacity var(--dur-base) var(--ease);}\n.graph-arrow{pointer-events:none;}\n.graph-node-hit{cursor:pointer;}\n.graph-node{pointer-events:none;}\n.graph-node-ring{fill:none; stroke:var(--surface); stroke-width:2.5;}\n.graph-node-me{stroke:var(--brand); stroke-width:2.5; fill:none;}\n.graph-init{fill:#fff; font-weight:var(--fw-bold); font-size:13px; text-anchor:middle; font-family:var(--bb-font);}\n.graph-label{fill:var(--text); font-weight:var(--fw-semibold); font-size:11px; text-anchor:middle; font-family:var(--bb-font);}\n.graph-zero{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; pointer-events:none; background:color-mix(in srgb,var(--graph-bg) 82%,transparent); backdrop-filter:blur(2px); border-radius:var(--r-pill); padding:var(--sp-1) var(--sp-4);}\n.graph-zero b{display:block; font-size:var(--fs-title3); font-weight:var(--fw-bold); letter-spacing:var(--num-tracking); color:var(--text);}\n.graph-zero span{font-size:var(--fs-caption2); color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em;}\n.graph-cap{display:flex; align-items:flex-start; gap:6px; padding:var(--sp-3) var(--sp-1) 0; font-size:var(--fs-caption); color:var(--text-secondary); line-height:var(--line-body);}\n.graph-cap svg{width:13px; height:13px; flex:0 0 auto; margin-top:1px; color:var(--route);}\n.graph-cap b{color:var(--text); font-weight:var(--fw-semibold);}\n\n/* ---- section label ---- */\n.sectlabel{padding:var(--sp-5) var(--sp-4) var(--sp-2); font-size:var(--fs-caption); font-weight:var(--fw-semibold); color:var(--text-muted);\n  text-transform:uppercase; letter-spacing:.05em; display:flex; align-items:center; justify-content:space-between; gap:var(--sp-2);}\n.sectlabel .side{text-transform:none; letter-spacing:0; font-weight:var(--fw-medium); color:var(--n-5);}\n\n/* ---- avatar (nama WAJIB mendampingi) ---- */\n.avatar{--c:var(--n-5); width:34px; height:34px; border-radius:var(--r-pill); background:var(--c); color:#fff;\n  display:flex; align-items:center; justify-content:center; font-size:var(--fs-footnote); font-weight:var(--fw-bold); flex:0 0 auto; line-height:1;}\n.avatar.sm{width:26px; height:26px; font-size:var(--fs-caption2);}\n.avatar.lg{width:40px; height:40px; font-size:var(--fs-subhead);}\n\n/* ---- balance rows (satu pola, diulang) ---- */\n.list{padding:0 var(--sp-4); display:flex; flex-direction:column; gap:var(--sp-2);}\n.bal{width:100%; text-align:left; font-family:inherit; color:inherit; cursor:pointer;\n  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); padding:var(--sp-3) var(--sp-4);\n  display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:var(--sp-3); transition:border-color var(--dur-tap), transform var(--dur-tap);}\n.bal:active{transform:scale(.99);}\n.bal.is-me{border-color:var(--brand); background:color-mix(in srgb,var(--brand) 5%,var(--surface));}\n.bal-id{min-width:0;}\n.bal-name{font-size:var(--fs-subhead); font-weight:var(--fw-semibold); color:var(--text); display:flex; align-items:center; gap:6px; min-width:0;}\n.bal-name .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}\n.you{flex:0 0 auto; font-size:var(--fs-caption2); font-weight:var(--fw-bold); color:var(--brand); background:var(--brand-tint);\n  border-radius:var(--r-pill); padding:1px 7px; text-transform:uppercase; letter-spacing:.03em;}\n.bal-note{font-size:var(--fs-caption); color:var(--text-muted); margin-top:2px; display:flex; align-items:center; gap:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}\n.bal-note svg{width:11px; height:11px; flex:0 0 auto;}\n.bal-amt{text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:3px;}\n.bal-num{font-size:var(--fs-subhead); font-weight:var(--fw-bold); white-space:nowrap;}\n.bal.is-pos .bal-num{color:var(--pos-text);}\n.bal.is-neg .bal-num{color:var(--neg-text);}\n.bal.is-zero .bal-num{color:var(--text-muted);}\n\n/* tag arah — TIDAK andalkan warna saja: glyph +/- , panah, label kata */\n.tag{display:inline-flex; align-items:center; gap:4px; font-size:var(--fs-caption2); font-weight:var(--fw-bold); padding:2px 7px 2px 5px; border-radius:var(--r-pill);}\n.tag svg{width:11px; height:11px;}\n.tag--pos{color:var(--pos-text); background:var(--pos-tint);}\n.tag--neg{color:var(--neg-text); background:var(--neg-tint);}\n.tag--zero{color:var(--text-muted); background:var(--n-2);}\n\n/* invariant bar — jumlah semua saldo = 0 (elemen desain) */\n.zerobar{margin:var(--sp-3) var(--sp-4) 0; display:flex; align-items:center; gap:var(--sp-2); font-size:var(--fs-caption); color:var(--text-muted);\n  background:var(--surface-sunken); border:1px dashed var(--border); border-radius:var(--r-field); padding:var(--sp-2) var(--sp-3);}\n.zerobar svg{width:13px; height:13px; flex:0 0 auto; color:var(--pos);}\n.zerobar b{color:var(--text); font-weight:var(--fw-semibold);}\n\n/* ---- transfer rows ---- */\n.xfers{padding:0 var(--sp-4); display:flex; flex-direction:column; gap:var(--sp-2);}\n.xfer{width:100%; text-align:left; font-family:inherit; color:inherit; cursor:pointer;\n  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); padding:var(--sp-3) var(--sp-4);\n  display:flex; flex-direction:column; gap:var(--sp-3); transition:border-color var(--dur-tap), transform var(--dur-tap), box-shadow var(--dur-base);}\n.xfer:active{transform:scale(.995);}\n.xfer.is-mine{border-color:var(--brand);}\n.xfer.is-done{opacity:.6;}\n.xfer.flash{box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 40%,transparent); border-color:var(--brand);}\n.flow{display:flex; align-items:center; gap:var(--sp-2);}\n.flow-node{display:flex; align-items:center; gap:7px; min-width:0;}\n.flow-name{font-size:var(--fs-footnote); font-weight:var(--fw-semibold); color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}\n.flow-node.is-me .flow-name{color:var(--brand);}\n.flow-arrow{flex:1 1 auto; display:flex; align-items:center; justify-content:center; position:relative; min-width:30px; color:var(--n-5);}\n.flow-arrow::before{content:\"\"; position:absolute; left:2px; right:8px; top:50%; height:2px; background:currentColor; border-radius:2px; opacity:.45;}\n.flow-arrow svg{width:14px; height:14px; position:relative;}\n.xfer.is-mine .flow-arrow{color:var(--brand);}\n.xfer-body{display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3); flex-wrap:wrap; row-gap:var(--sp-2);}\n.xfer-act{margin-left:auto; flex-wrap:wrap; justify-content:flex-end;}\n.xfer-amt{font-size:var(--fs-title3); font-weight:var(--fw-bold); white-space:nowrap;}\n.xfer-amt .rp{font-size:var(--fs-footnote); font-weight:var(--fw-semibold); color:var(--text-secondary); margin-right:2px;}\n.xfer-act{display:flex; align-items:center; gap:6px;}\n.mini{appearance:none; border:1px solid var(--btn2-border); background:var(--btn2-bg); color:var(--btn2-fg); font-family:inherit;\n  font-size:var(--fs-caption); font-weight:var(--fw-semibold); border-radius:var(--r-pill); padding:8px 12px; min-height:36px; cursor:pointer; white-space:nowrap;\n  display:inline-flex; align-items:center; gap:4px; transition:background var(--dur-tap);}\n.mini:hover{background:var(--btn2-bg-hover);}\n.mini--primary{background:var(--brand); color:var(--on-brand); border-color:var(--brand);}\n.mini svg{width:13px; height:13px;}\n/* chip \"lewat perantara\" — label + ikon, bukan warna saja */\n.routed{display:inline-flex; align-items:center; gap:5px; align-self:flex-start; font-size:var(--fs-caption2); font-weight:var(--fw-semibold);\n  color:var(--route-text); background:var(--route-tint); border-radius:var(--r-pill); padding:3px 9px 3px 7px;}\n.routed svg{width:12px; height:12px;}\n/* partial */\n.partial-track{height:5px; border-radius:var(--r-pill); background:var(--n-3); overflow:hidden;}\n.partial-fill{height:100%; background:var(--pos); border-radius:var(--r-pill);}\n.partial-txt{display:flex; justify-content:space-between; font-size:var(--fs-caption2); color:var(--text-secondary); margin-top:5px;}\n.partial-txt b{color:var(--pos-text); font-weight:var(--fw-semibold);}\n\n/* ---- history ---- */\n.history{padding:var(--sp-2) var(--sp-4) var(--sp-5);}\n.hist-toggle{width:100%; appearance:none; border:none; background:transparent; cursor:pointer; font-family:inherit; min-height:44px;\n  display:flex; align-items:center; gap:var(--sp-2); color:var(--text-secondary); padding:var(--sp-3) var(--sp-2); font-size:var(--fs-footnote); font-weight:var(--fw-semibold);}\n.hist-toggle svg{width:14px; height:14px; transition:transform var(--dur-base);}\n.hist-toggle.is-open svg.chev{transform:rotate(90deg);}\n.hist-count{margin-left:auto; font-size:var(--fs-caption); color:var(--text-muted); font-weight:var(--fw-medium);}\n.hist-list{display:none; flex-direction:column;}\n.hist-list.is-open{display:flex;}\n.hist-row{display:flex; align-items:center; gap h1>Trip Bali 2026<\u002Fh1><\u002Fdiv>\n          <button class=\"icobtn menu\">⋯<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"ghead-mid\">\n          <div class=\"avstack\">\n            <span class=\"av\" style=\"--av:var(--m-7)\">N<\u002Fspan>\n            <span class=\"av\" style=\"--av:var(--m-8)\">F<\u002Fspan>\n            <span class=\"av\" style=\"--av:var(--m-11)\">S<\u002Fspan>\n            <span class=\"av\" style=\"--av:var(--m-4)\">A<\u002Fspan>\n            <span class=\"av\" style=\"--av:var(--m-2)\">D<\u002Fspan>\n          <\u002Fdiv>\n          <!-- posisi kamu: satu-satunya ringkasan; di tab Saldo kartu ini \"here\" -->\n          <div class=\"position here\" id=\"posCard\">\n            <span class=\"lbl\">Posisi kamu<\u002Fspan>\n            <span class=\"amt pos num\" id=\"posAmt\">+Rp&nbsp;1.240.000<\u002Fspan>\n            <span class=\"sub\" id=\"posSub\"><b>3 orang<\u002Fb> bayar ke kamu<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <nav class=\"tabs\">\n          <button class=\"tab\">Transaksi<\u002Fbutton>\n          <button class=\"tab active\">Saldo<\u002Fbutton>\n          <button class=\"tab\">Ringkasan<\u002Fbutton>\n        <\u002Fnav>\n      <\u002Fheader>\n\n      <!-- ===================== SALDO TAB BODY ===================== -->\n      <div class=\"body scr\" id=\"body\">\n\n        <!-- MODE -->\n        <div class=\"modewrap\">\n          <div class=\"seg\" role=\"tablist\">\n            <button class=\"seg-btn is-active\" data-mode=\"ringkas\">\n              <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 7h10M4 12h16M4 17h7\"><\u002Fpath><path d=\"M17 5l3 2-3 2\"><\u002Fpath><\u002Fsvg>\n              Ringkas\n            <\u002Fbutton>\n            <button class=\"seg-btn\" data-mode=\"langsung\">\n              <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"6\" cy=\"6\" r=\"2.4\"><\u002Fcircle><circle cx=\"18\" cy=\"6\" r=\"2.4\"><\u002Fcircle><circle cx=\"6\" cy=\"18\" r=\"2.4\"><\u002Fcircle><circle cx=\"18\" cy=\"18\" r=\"2.4\"><\u002Fcircle><path d=\"M8.4 6H15.6M6 8.4v7.2M18 8.4v7.2M8.4 18H15.6\"><\u002Fpath><\u002Fsvg>\n              Langsung\n            <\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"seg-hint\" id=\"segHint\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- NETWORK DIAGRAM -->\n        <div class=\"graph\">\n          <div class=\"graph-card\">\n            <svg id=\"graphSvg\" viewBox=\"0 0 300 264\" aria-label=\"Jaringan transfer antar anggota\"><\u002Fsvg>\n            <div class=\"graph-zero\"><b class=\"num\">Rp 0<\u002Fb><span>total saldo<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"graph-cap\" id=\"graphCap\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- SALDO TIAP ORANG -->\n        <div class=\"sectlabel\">Saldo tiap orang<span class=\"side\">bayar − bagian, dalam Rupiah<\u002Fspan><\u002Fdiv>\n        <div class=\"list\" id=\"balList\"><\u002Fdiv>\n        <div class=\"zerobar\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><\u002Fsvg>\n          <span>Yang <b>+<\u002Fb> nerima, yang <b>−<\u002Fb> bayar. Dijumlah selalu <b class=\"num\">Rp 0<\u002Fb> — ga ada uang yang hilang.<\u002Fspan>\n        <\u002Fdiv>\n\n        <!-- TRANSFER -->\n        <div class=\"sectlabel\">Transfer disarankan<span class=\"side\" id=\"xferSide\"><\u002Fspan><\u002Fdiv>\n        <div class=\"xfers\" id=\"xferList\"><\u002Fdiv>\n\n        <!-- RIWAYAT -->\n        <div class=\"history\">\n          <button class=\"hist-toggle\" id=\"histToggle\">\n            <svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n            Riwayat pelunasan\n            <span class=\"hist-count\" id=\"histCount\"><\u002Fspan>\n          <\u002Fbutton>\n          <div class=\"hist-list\" id=\"histList\"><\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <!-- OVERLAY: SEMUA LUNAS -->\n      <div class=\"overlay\" id=\"doneState\" hidden=\"\">\n        <div class=\"seal\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 13l4 4L19 7\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div class=\"ov-title\">Semua sudah beres<\u002Fdiv>\n        <div class=\"ov-sub\">Ga ada yang ngutang siapa-siapa lagi di Trip Bali 2026. Semua saldo nol.<\u002Fdiv>\n        <div class=\"ov-stat\">\n          <div><div class=\"ov-statnum num\">18<\u002Fdiv><div class=\"ov-statlbl\">transaksi<\u002Fdiv><\u002Fdiv>\n          <div><div class=\"ov-statnum num\">6<\u002Fdiv><div class=\"ov-statlbl\">pelunasan<\u002Fdiv><\u002Fdiv>\n          <div><div class=\"ov-statnum num\">5<\u002Fdiv><div class=\"ov-statlbl\">orang<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ov-cta\"><button class=\"btn btn--secondary\">Lihat riwayat pelunasan<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- OVERLAY: BELUM ADA TRANSAKSI -->\n      <div class=\"overlay\" id=\"emptyState\" hidden=\"\">\n        <div class=\"empty-art\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7h18v12H3z\"><\u002Fpath><path d=\"M3 11h18\"><\u002Fpath><path d=\"M7 3v4M17 3v4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div class=\"ov-title\">Belum ada saldo<\u002Fdiv>\n        <div class=\"ov-sub\">Begitu ada yang bayarin sesuatu, saldo tiap orang dan siapa transfer ke siapa muncul di sini otomatis.<\u002Fdiv>\n        <div class=\"ov-cta\"><button class=\"btn btn--primary\">Catat pengeluaran pertama<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- SHEET -->\n      <div class=\"scrim\" id=\"scrim\">\n        <div class=\"sheet\" id=\"sheet\"><div class=\"grab\"><\u002Fdiv><div id=\"sheetBody\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===================== DEV SWITCHER ===================== -->\n  <aside class=\"dev\">\n    <h4>Keadaan (9)<\u002Fh4>\n    <div class=\"dev-group\" id=\"devStates\">\n      <button class=\"dev-btn is-active\" data-state=\"ringkas\"><span class=\"k\">1<\u002Fspan>Mode Ringkas<span class=\"badge\">tab<\u002Fspan><\u002Fbutton>\n      <button class=\"dev-btn\" data-state=\"langsung\"><span class=\"k\">2<\u002Fspan>Mode Langsung<span class=\"badge\">tab<\u002Fspan><\u002Fbutton>\n      <button class=\"dev-btn\" data-state=\"trace\"><span class=\"k\">3<\u002Fspan>Telusuri satu angka<span class=\"badge\">sheet<\u002Fspan><\u002Fbutton>\n      <button class=\"dev-btn\" data-state=\"note\"><span class=\"k\">4<\u002Fspan>Catatan bayar + salin<span class=\"badge\">sheet<\u002Fspan><\u002Fbutton>\n      <button class=\"dev-btn\" data-state=\"tagih\"><span class=\"k\">5<\u002Fspan>Susun pesan tagih<span class=\"badge\">sheet<\u002Fspan><\u002Fbutton>\n      <button class=\"dev-btn\" data-state=\"partial\"><span class=\"k\">6<\u002Fspan>Pelunasan sebagian<span class=\"badge\">tab<\u002Fspan><\u002Fbutton>\n      <button class=\"dev-btn\" data-state=\"history\"><span class=\"k\">7<\u002Fspan>Riwayat pelunasan<span class=\"badge\">tab<\u002Fspan><\u002Fbutton>\n      <button class=\"dev-btn\" data-state=\"done\"><span class=\"k\">8<\u002Fspan>Semua lunas<span class=\"badge\">tab<\u002Fspan><\u002Fbutton>\n      <button class=\"dev-btn\" data-state=\"empty\"><span class=\"k\">9<\u002Fspan>Belum ada transaksi<span class=\"badge\">tab<\u002Fspan><\u002Fbutton>\n    <\u002Fdiv>\n    <h4>Tema<\u002Fh4>\n    <div class=\"dev-theme\">\n      <button class=\"dev-btn is-active\" data-theme-btn=\"light\">Terang<\u002Fbutton>\n      <button class=\"dev-btn\" data-theme-btn=\"dark\">Gelap<\u002Fbutton>\n    <\u002Fdiv>\n    <p class=\"dev-note\">Tab di bawah header grup. <b>Ringkas<\u002Fb> = transfer paling sedikit. <b>Langsung<\u002Fb> = utang per pasangan. Ketuk garis/baris transfer buat telusuri; ketuk simpul/baris saldo buat catatan &amp; tagih.<\u002Fp>\n  <\u002Faside>\n\n<\u002Fdiv>\n\n<div class=\"notes\" id=\"notes\"><\u002Fdiv>\n\n<script>\n/* ============================================================\n   DATA — Trip Bali 2026, 5 orang. Kamu = Nadia.\n   net > 0 = nerima (piutang) · net < 0 = bayar (utang).\n   Nets dijumlah = 0 (invarian). Sengaja berantakan biar Ringkas\n   kerasa gunanya. Dewi = kasus posisi berbalik antar mode.\n   ============================================================ */\nconst MEMBERS = {\n  me:     { name:\"Nadia Putri\",                first:\"Nadia\",  ini:\"NP\", c:\"var(--m-7)\",  net:  1240000, pay:\"BCA 1234567890 a.n. Nadia Putri\" },\n  farhan: { name:\"Farhan Maulana Abdurrahman\", first:\"Farhan\", ini:\"FM\", c:\"var(--m-8)\",  net: -2180000, pay:\"GoPay 0812-3456-7890 a.n. Farhan M. A.\" },\n  sarah:  { name:\"Sarah\",                      first:\"Sarah\",  ini:\"SR\", c:\"var(--m-11)\", net:  1475000, pay:\"Bank Jago 5566-7788-9900 a.n. Sarah\" },\n  andi:   { name:\"Andi\",                       first:\"Andi\",   ini:\"AN\", c:\"var(--m-4)\",  net:  -615000, pay:\"OVO 0857-1122-3344\" },\n  dewi:   { name:\"Dewi\",                       first:\"Dewi\",   ini:\"DW\", c:\"var(--m-2)\",  net:    80000, pay:\"BCA 8899001122 a.n. Dewi\" },\n};\nconst ME = \"me\";\nconst ORDER = [\"me\",\"farhan\",\"sarah\",\"andi\",\"dewi\"];\n\n/* Simpul di jaringan (viewBox 300x250) */\nconst NODE = {\n  me:     { x:150, y:36 },\n  farhan: { x:262, y:106 },\n  sarah:  { x:214, y:220 },\n  andi:   { x:86,  y:220 },\n  dewi:   { x:38,  y:106 },\n};\n\n/* RINGKAS — transfer paling sedikit (bisa lewat orang lain). 4 transfer. */\nconst RINGKAS = [\n  { from:\"farhan\", to:\"sarah\", amt:1475000 },\n  { from:\"farhan\", to:\"me\",    amt:705000, paid:400000 },\n  { from:\"andi\",   to:\"me\",    amt:535000, routed:true },\n  { from:\"andi\",   to:\"dewi\",  amt:80000,  routed:true },\n];\n/* LANGSUNG — utang per pasangan, apa adanya. 5 transfer. */\nconst LANGSUNG = [\n  { from:\"farhan\", to:\"me\",    amt:1240000 },\n  { from:\"farhan\", to:\"sarah\", amt:560000 },\n  { from:\"farhan\", to:\"dewi\",  amt:380000 },\n  { from:\"andi\",   to:\"sarah\", amt:615000 },\n  { from:\"dewi\",   to:\"sarah\", amt:300000 },\n];\n\n/* Riwayat pelunasan — terpisah dari daftar pengeluaran, tiap entri bisa di-undo */\nconst HISTORY = [\n  { from:\"farhan\", to:\"me\",   amt:400000, when:\"Hari ini 09:30\", note:\"sebagian · sisa Rp 305.000 tercatat\", part:true },\n  { from:\"dewi\",   to:\"sarah\",amt:300000, when:\"Kemarin 20:15\", note:\"lunas\" },\n  { from:\"sarah\",  to:\"me\",   amt:250000, when:\"6 Agu\",         note:\"lunas\" },\n];\n\n/* Telusuri: sumber tiap transfer. Kunci \"from>to\". */\nconst HREF = \"BagiBill - Detail Grup Transaksi (standalone).html\";\nconst TRACE = {\n  \"andi>dewi\": {\n    routed:{ text:\"Andi ga pernah ngutang ke <b>Dewi<\u002Fb>. Tapi Dewi harusnya <b>nerima Rp 80.000<\u002Fb> (dia nalangin bagian Farhan, dipotong utangnya ke Sarah). Setelah Andi nutup ke kamu, sisa Andi <b>Rp 80.000<\u002Fb> — pas buat Dewi. Total yang diterima tiap orang tetap sama.\" },\n    title:\"Kenapa saldo Dewi +Rp 80.000\",\n    sources:[\n      { name:\"Sewa villa Uluwatu 3 malam\", meta:\"Dewi bayar · bagian Farhan\", amt:380000, sign:\"+\" },\n      { name:\"Makan malam Jimbaran\",       meta:\"Sarah bayar · bagian Dewi\",  amt:300000, sign:\"−\" },\n    ],\n  },\n  \"andi>me\": {\n    routed:{ text:\"Andi ga langsung ngutang ke kamu. Tapi <b>Farhan<\u002Fb> ga cukup nutup semua piutangmu, jadi sisa <b>Rp 535.000<\u002Fb> diambil dari Andi. Jumlah yang kamu terima tetap sama kayak mode Langsung.\" },\n    title:\"Bagian piutangmu yang ditutup Andi\",\n    sources:[\n      { name:\"Tiket pesawat CGK–DPS\", meta:\"Kamu bayar · bagi 5\", amt:535000, sign:\"+\" },\n    ],\n  },\n  \"farhan>me\": {\n    title:\"Bagian Farhan atas yang kamu talangin\",\n    sources:[\n      { name:\"Sewa villa Uluwatu 3 malam\", meta:\"Kamu bayar · bagi 5\", amt:450000, sign:\"+\" },\n      { name:\"Tiket pesawat CGK–DPS\",      meta:\"Kamu bayar · bagi 5\", amt:255000, sign:\"+\" },\n    ],\n  },\n};\nconst TRACE_FALLBACK = {\n  title:\"Dari transaksi mana\",\n  sources:[\n    { name:\"Sewa villa Uluwatu 3 malam\", meta:\"bagi 5\", amt:900000, sign:\"+\" },\n    { name:\"Sewa mobil + sopir\",         meta:\"bagi 5\", amt:575000, sign:\"+\" },\n  ],\n};\n\n/* ---- util ---- */\nconst rp  = n => \"Rp \" + Math.abs(n).toLocaleString(\"id-ID\");\nconst rpn = n => Math.abs(n).toLocaleString(\"id-ID\");\nconst $ = s => document.querySelector(s);\nconst nm = id => MEMBERS[id].first;\nlet MODE = \"ringkas\";\n\n/* ---- ikon ---- */\nfunction icon(name){\n  const p = {\n    bell:'<path d=\"M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.7 21a2 2 0 0 1-3.4 0\"/>',\n    send:'<path d=\"M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z\"/>',\n    copy:'<rect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\"/><path d=\"M5 15V5a2 2 0 0 1 2-2h10\"/>',\n    check:'<path d=\"M5 13l4 4L19 7\"/>',\n    receipt:'<path d=\"M5 3v18l2-1.5L9 21l2-1.5L13 21l2-1.5L17 21l2-1.5V3l-2 1.5L15 3l-2 1.5L11 3 9 4.5 7 3 5 4.5z\"/><path d=\"M9 8h6M9 12h6\"/>',\n    route:'<circle cx=\"6\" cy=\"6\" r=\"2\"/><circle cx=\"18\" cy=\"18\" r=\"2\"/><path d=\"M8 6h6a4 4 0 0 1 4 4v6\"/>',\n    chev:'<path d=\"M9 6l6 6-6 6\"/>',\n    lock:'<rect x=\"4\" y=\"10\" width=\"16\" height=\"11\" rx=\"2\"/><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"/>',\n    undo:'<path d=\"M9 14L4 9l5-5\"/><path d=\"M4 9h11a5 5 0 0 1 0 10h-3\"/>',\n    scale:'<path d=\"M12 3v18M5 7h14M7 7l-3 6a3 3 0 0 0 6 0zM17 7l-3 6a3 3 0 0 0 6 0z\"/>',\n  }[name]||'';\n  return `<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${p}<\u002Fsvg>`;\n}\nfunction arrow(dir){\n  const d = dir===\"down\" ? \"M12 5v14M6 13l6 6 6-6\" : \"M12 19V5M6 11l6-6 6 6\";\n  return `<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"${d}\"/><\u002Fsvg>`;\n}\nfunction rArrow(){ return `<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12h15M13 6l6 6-6 6\"/><\u002Fsvg>`; }\nfunction av(id, cls=\"\"){ const m=MEMBERS[id]; return `<span class=\"avatar ${cls}\" style=\"--c:${m.c}\">${m.ini}<\u002Fspan>`; }\n\n/* ============================================================\n   HEADER — posisi kamu (satu-satunya ringkasan). Sinkron dgn\n   baris saldo \"kamu\" (nilai & tanda sama, susunan beda tapi angka\n   identik: tidak ada dua angka bertentangan).\n   ============================================================ */\nfunction renderPos(){\n  const net = MEMBERS[ME].net, pos = net>0, card=$(\"#posCard\");\n  card.classList.toggle(\"is-neg\", !pos);\n  $(\"#posAmt\").className = \"amt num \" + (pos?\"pos\":\"neg\");\n  $(\"#posAmt\").innerHTML = (pos?\"+\":\"&minus;\")+\"Rp&nbsp;\"+rpn(net);\n  const list = MODE===\"ringkas\"?RINGKAS:LANGSUNG;\n  const inbound  = list.filter(t=>t.to===ME).length;\n  const outbound = list.filter(t=>t.from===ME).length;\n  $(\"#posSub\").innerHTML = pos ? `<b>${inbound} orang<\u002Fb> bayar ke kamu` : `Kamu bayar ke <b>${outbound} orang<\u002Fb>`;\n}\n\n/* ============================================================\n   NETWORK DIAGRAM — struktur sbg bentuk. Tebal garis = besar\n   transfer; panah = arah; warna garis = warna pembayar (identitas,\n   BUKAN merah/hijau). Ketuk garis = telusuri, ketuk simpul = orang.\n   ============================================================ */\nfunction renderGraph(){\n  const list = MODE===\"ringkas\"?RINGKAS:LANGSUNG;\n  const max = Math.max(...list.map(t=>t.amt));\n  const R = 19, GAP = 24, HEAD = 9;\n  let edges = \"\", heads = \"\", hits = \"\";\n  list.forEach((t,i)=>{\n    const a=NODE[t.from], b=NODE[t.to];\n    const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy), ux=dx/len, uy=dy/len;\n    const x1=a.x+ux*GAP, y1=a.y+uy*GAP, x2=b.x-ux*GAP, y2=b.y-uy*GAP;\n    const w = 2.5 + (t.amt/max)*5.5;\n    const col = MEMBERS[t.from].c;\n    const dash = t.routed ? 'stroke-dasharray=\"1 7\"' : '';\n    edges += `<line class=\"graph-edge\" x1=\"${x1}\" y1=\"${y1}\" x2=\"${x2}\" y2=\"${y2}\" stroke=\"${col}\" stroke-width=\"${w}\" ${dash} opacity=\"${t.paid&&t.paid>=t.amt?0.35:0.9}\"/>`;\n    // arrowhead polygon at (x2,y2)\n    const bx=-ux, by=-uy, px=-uy, py=ux;\n    const p1=`${x2},${y2}`;\n    const p2=`${x2+bx*HEAD+px*HEAD*0.6},${y2+by*HEAD+py*HEAD*0.6}`;\n    const p3=`${x2+bx*HEAD-px*HEAD*0.6},${y2+by*HEAD-py*HEAD*0.6}`;\n    heads += `<polygon class=\"graph-arrow\" points=\"${p1} ${p2} ${p3}\" fill=\"${col}\"/>`;\n    hits  += `<line class=\"graph-edge-hit\" data-edge=\"${i}\" x1=\"${a.x}\" y1=\"${a.y}\" x2=\"${b.x}\" y2=\"${b.y}\"/>`;\n  });\n  let nodes = \"\";\n  ORDER.forEach(id=>{\n    const n=NODE[id], m=MEMBERS[id], me=id===ME;\n    const labelY = n.y > 130 ? n.y+R+15 : (n.y<60 ? n.y-R-8 : n.y-R-8);\n    nodes += `<g class=\"graph-node\">\n        <circle cx=\"${n.x}\" cy=\"${n.y}\" r=\"${R}\" fill=\"${m.c}\"/>\n        <circle class=\"${me?'graph-node-me':'graph-node-ring'}\" cx=\"${n.x}\" cy=\"${n.y}\" r=\"${R}\"/>\n        <text class=\"graph-init\" x=\"${n.x}\" y=\"${n.y+4}\">${m.ini}<\u002Ftext>\n        <text class=\"graph-label\" x=\"${n.x}\" y=\"${labelY}\">${me?'Kamu':m.first}<\u002Ftext>\n      <\u002Fg>\n      <circle class=\"graph-node-hit\" data-node=\"${id}\" cx=\"${n.x}\" cy=\"${n.y}\" r=\"26\" fill=\"transparent\"/>`;\n  });\n  $(\"#graphSvg\").innerHTML = edges + heads + nodes + hits;\n  $(\"#graphSvg\").querySelectorAll(\"[data-edge]\").forEach(el=>el.addEventListener(\"click\",()=>openTrace(list[+el.dataset.edge])));\n  $(\"#graphSvg\").querySelectorAll(\"[data-node]\").forEach(el=>el.addEventListener(\"click\",()=>openMember(el.dataset.node)));\n\n  $(\"#graphCap\").innerHTML = MODE===\"ringkas\"\n    ? `${icon('route')}<span>Garis <b>putus-putus<\u002Fb> = lewat perantara. Contoh: <b>Dewi<\u002Fb> cuma nerima Rp 80rb dari Andi.<\u002Fspan>`\n    : `${icon('route')}<span>Utang asli per pasangan. Di sini <b>Dewi malah bayar<\u002Fb> Rp 300rb ke Sarah — di Ringkas dia ga bayar siapa-siapa.<\u002Fspan>`;\n}\n\n/* ============================================================\n   SALDO TIAP ORANG — kolom kanan lurus (tnum), nama + avatar.\n   ============================================================ */\nfunction renderBalances(){\n  const wrap=$(\"#balList\"); wrap.innerHTML=\"\";\n  ORDER.forEach(id=>{\n    const m=MEMBERS[id], net=m.net, pos=net>0, neg=net<0;\n    const stateCls = pos?\"is-pos\":neg?\"is-neg\":\"is-zero\";\n    const tag = pos ? `<span class=\"tag tag--pos\">${arrow('down')} nerima<\u002Fspan>`\n              : neg ? `<span class=\"tag tag--neg\">${arrow('up')} bayar<\u002Fspan>`\n              : `<span class=\"tag tag--zero\">lunas<\u002Fspan>`;\n    const sign = pos?\"+\":neg?\"−\":\"\";\n    const b=document.createElement(\"button\");\n    b.className=`bal ${stateCls} ${id===ME?'is-me':''}`;\n    b.innerHTML =\n      `${av(id,'lg')}\n       <span class=\"bal-id\">\n         <span class=\"bal-name\"><span class=\"nm\">${m.name}<\u002Fspan>${id===ME?'<span class=\"you\">kamu<\u002Fspan>':''}<\u002Fspan>\n         <span class=\"bal-note\">${icon('copy')}${m.pay}<\u002Fspan>\n       <\u002Fspan>\n       <span class=\"bal-amt\">${tag}<span class=\"bal-num num\">${sign}${rp(net)}<\u002Fspan><\u002Fspan>`;\n    b.addEventListener(\"click\",()=>openMember(id));\n    wrap.appendChild(b);\n  });\n}\n\n/* ============================================================\n   TRANSFER — satu pola diulang, aliran from → to.\n   ============================================================ */\nfunction renderXfers(){\n  const list = MODE===\"ringkas\"?RINGKAS:LANGSUNG;\n  const wrap=$(\"#xferList\"); wrap.innerHTML=\"\";\n  list.forEach((t,i)=>{\n    const mine = t.from===ME||t.to===ME;\n    const done = t.paid && t.paid>=t.amt;\n    const el=document.createElement(\"div\");\n    el.className=`xfer ${mine?'is-mine':''} ${done?'is-done':''}`;\n    el.dataset.i=i; if(t.paid&&!done) el.dataset.partial=\"1\";\n    const routed = t.routed ? `<span class=\"routed\">${icon('route')} Lewat perantara — ketuk buat lihat<\u002Fspan>` : \"\";\n    let bottom=\"\";\n    if(t.paid && !done){\n      const pct=Math.round(t.paid/t.amt*100);\n      bottom = `<div><div class=\"partial-track\"><div class=\"partial-fill\" style=\"width:${pct}%\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"partial-txt\"><span>Udah dibayar <b>${rp(t.paid)}<\u002Fb><\u002Fspan><span>Sisa ${rp(t.amt-t.paid)}<\u002Fspan><\u002Fdiv><\u002Fdiv>`;\n    }\n    const action = t.to===ME\n      ? `<button class=\"mini\" data-act=\"lunas\">${icon('check')}Tandai lunas<\u002Fbutton><button class=\"mini mini--primary\" data-act=\"tagih\">Tagih<\u002Fbutton>`\n      : t.from===ME\n      ? `<button class=\"mini mini--primary\" data-act=\"bayar\">${icon('send')}Kirim info<\u002Fbutton>`\n      : `<button class=\"mini\" data-act=\"lunas\">${icon('check')}Lunas<\u002Fbutton>`;\n    el.innerHTML =\n      `${routed}\n       <div class=\"flow\">\n         <span class=\"flow-node ${t.from===ME?'is-me':''}\">${av(t.from,'sm')}<span class=\"flow-name\">${nm(t.from)}${t.from===ME?' (kamu)':''}<\u002Fspan><\u002Fspan>\n         <span class=\"flow-arrow\">${rArrow()}<\u002Fspan>\n         <span class=\"flow-node ${t.to===ME?'is-me':''}\">${av(t.to,'sm')}<span class=\"flow-name\">${nm(t.to)}${t.to===ME?' (kamu)':''}<\u002Fspan><\u002Fspan>\n       <\u002Fdiv>\n       <div class=\"xfer-body\"><span class=\"xfer-amt num\"><span class=\"rp\">Rp<\u002Fspan>${rpn(t.amt)}<\u002Fspan><span class=\"xfer-act\">${action}<\u002Fspan><\u002Fdiv>\n       ${bottom}`;\n    el.addEventListener(\"click\",e=>{\n      const act=e.target.closest(\"[data-act]\");\n      if(act){ e.stopPropagation(); handleAct(act,t); return; }\n      openTrace(t);\n    });\n    wrap.appendChild(el);\n  });\n  $(\"#xferSide\").textContent = MODE===\"ringkas\" ? `${list.length} transfer` : `${list.length} pasangan`;\n}\nfunction handleAct(btn,t){\n  const a=btn.dataset.act;\n  if(a===\"tagih\"){ openTagih(t.from===ME?t.to:t.from); return; }\n  if(a===\"bayar\"){ openMember(t.to); return; }\n  btn.classList.add(\"mini--primary\"); btn.innerHTML=`${icon('check')} Beres`;\n}\n\n/* segment hint */\nfunction renderHint(){\n  $(\"#segHint\").innerHTML = MODE===\"ringkas\"\n    ? `${icon('route')}<span><b>18 transaksi<\u002Fb> diringkas jadi <span class=\"seg-count num\">4 transfer<\u002Fspan>. Sistem cari jalur tersingkat — kadang kamu transfer ke orang yang bukan langsung ngutang.<\u002Fspan>`\n    : `${icon('route')}<span>Utang <b>per pasangan<\u002Fb>, apa adanya. <span class=\"seg-count num\">5 transfer<\u002Fspan> — lebih banyak, tapi tiap angka jelas dari siapa ke siapa.<\u002Fspan>`;\n}\n\n/* ============================================================\n   RIWAYAT\n   ============================================================ */\nfunction renderHistory(){\n  const wrap=$(\"#histList\"); wrap.innerHTML=\"\";\n  HISTORY.forEach(h=>{\n    const row=document.createElement(\"div\");\n    row.className=\"hist-row\";\n    row.innerHTML =\n      `<span class=\"hist-check ${h.part?'part':''}\">${icon('check')}<\u002Fspan>\n       <span class=\"hist-txt\">${nm(h.from)} <span style=\"color:var(--n-5)\">${'\\u2192'}<\u002Fspan> ${nm(h.to)}<span>${h.when} · ${h.note}<\u002Fspan><\u002Fspan>\n       <span class=\"hist-amt num\">${rp(h.amt)}<button class=\"hist-undo\">${icon('undo')} Undo<\u002Fbutton><\u002Fspan>`;\n    wrap.appendChild(row);\n  });\n  $(\"#histCount\").textContent = HISTORY.length + \" pelunasan\";\n}\n$(\"#histToggle\").addEventListener(\"click\",()=>{ $(\"#histToggle\").classList.toggle(\"is-open\"); $(\"#histList\").classList.toggle(\"is-open\"); });\n\n/* ============================================================\n   SHEET (telusuri / catatan / tagih) — layar terpisah yg didorong\n   ============================================================ */\nfunction openSheet(html){ $(\"#sheetBody\").innerHTML=html; $(\"#scrim\").classList.add(\"is-open\"); }\nfunction closeSheet(){ $(\"#scrim\").classList.remove(\"is-open\"); }\n$(\"#scrim\").addEventListener(\"click\",e=>{ if(e.target.id===\"scrim\") closeSheet(); });\n\nfunction openTrace(t){\n  const data = TRACE[`${t.from}>${t.to}`] || TRACE_FALLBACK;\n  let why=\"\";\n  if(t.routed && data.routed){\n    why = `<div class=\"why\"><span class=\"why-ic\">${icon('route')}<\u002Fspan>\n      <div class=\"why-txt\">${data.routed.text}\n        <div class=\"route-map\">\n          <span class=\"route-node\">${av(t.from,'sm')}${nm(t.from)}<\u002Fspan>\n          <span class=\"route-arr\">${miniArr()}<\u002Fspan>\n          <span class=\"route-node\">${av(t.to,'sm')}${t.to===ME?'kamu':nm(t.to)}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>`;\n  }\n  const sum = data.sources.reduce((a,s)=>a+(s.sign===\"−\"?-s.amt:s.amt),0);\n  const srcs = data.sources.map(s=>\n    `<a class=\"src\" href=\"${HREF}\">\n       <span class=\"src-ic\">${icon('receipt')}<\u002Fspan>\n       <span class=\"src-info\"><span class=\"src-name\">${s.name}<\u002Fspan><span class=\"src-meta\">${s.meta}<\u002Fspan><\u002Fspan>\n       <span class=\"src-sign ${s.sign==='+'?'plus':'minus'} num\">${s.sign} ${rp(s.amt)}${icon('chev')}<\u002Fspan>\n     <\u002Fa>`).join(\"\");\n  openSheet(\n    `<span class=\"pushtag\">${icon('scale')} Telusuri &middot; layar terpisah<\u002Fspan>\n     <div class=\"sheet-title\">Dari mana angka ini<\u002Fdiv>\n     <div class=\"sheet-sub\">Telusuri transfer ini sampai ke transaksi aslinya. Ketuk transaksi buat buka detail di tab Transaksi.<\u002Fdiv>\n     <div class=\"trace-head\">\n       <span class=\"trace-flow\">${av(t.from,'sm')}<span class=\"flow-arrow\" style=\"min-width:18px\">${rArrow()}<\u002Fspan>${av(t.to,'sm')}<\u002Fspan>\n       <span class=\"trace-amt num\">${rp(t.amt)}<\u002Fspan>\n     <\u002Fdiv>\n     ${why}\n     <div class=\"trace-lbl\">${data.title}<\u002Fdiv>\n     ${srcs}\n     <div class=\"trace-sum\"><span>${data.sources.length} transaksi asal<\u002Fspan><b class=\"num\">${sum<0?'−':'+'} ${rp(sum)}<\u002Fb><\u002Fdiv>`\n  );\n}\nfunction miniArr(){ return `<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\u002Fsvg>`; }\n\nfunction openMember(id){\n  const m=MEMBERS[id], net=m.net;\n  const line = net>0 ? `Nerima <b class=\"num\">${rp(net)}<\u002Fb>` : net<0 ? `Bayar <b class=\"num\">${rp(net)}<\u002Fb>` : `Lunas`;\n  const tagihBtn = (id!==ME && net<0) ? `<button class=\"btn btn--primary\" id=\"toTagih\">${icon('bell')} Susun pesan tagih<\u002Fbutton>` : \"\";\n  openSheet(\n    `<span class=\"pushtag\">${icon('copy')} Catatan bayar &middot; layar terpisah<\u002Fspan>\n     <div class=\"sheet-title\">${m.name}${id===ME?' (kamu)':''}<\u002Fdiv>\n     <div class=\"sheet-sub\">${line} &middot; di Trip Bali 2026<\u002Fdiv>\n     <div class=\"note-card\">\n       <div class=\"note-info\"><div class=\"note-lbl\">Catatan pembayaran<\u002Fdiv><div class=\"note-val\" id=\"payVal\">${m.pay}<\u002Fdiv><\u002Fdiv>\n       <button class=\"copy\" id=\"copyPay\">${icon('copy')}Salin<\u002Fbutton>\n     <\u002Fdiv>\n     <div class=\"disclaim\">${icon('lock')}<span>BagiBill ga megang uangmu. Ini cuma catatan buat disalin — transfernya lewat aplikasi bankmu sendiri.<\u002Fspan><\u002Fdiv>\n     ${tagihBtn}`\n  );\n  $(\"#copyPay\").addEventListener(\"click\",()=>copyText(m.pay,$(\"#copyPay\")));\n  const tb=$(\"#toTagih\"); if(tb) tb.addEventListener(\"click\",()=>openTagih(id));\n}\n\nfunction openTagih(id){\n  const m=MEMBERS[id], me=MEMBERS[ME];\n  const t=(MODE===\"ringkas\"?RINGKAS:LANGSUNG).find(x=>x.from===id&&x.to===ME);\n  const owe = t ? (t.paid?t.amt-t.paid:t.amt) : Math.abs(m.net);\n  const msg =\n`Hai ${m.first}! Buat Trip Bali 2026, sisa ke aku Rp ${rpn(owe)}.\n\nTransfer ke: ${me.pay}\n\nMakasih ya 🙏 — dikirim lewat BagiBill`;\n  openSheet(\n    `<span class=\"pushtag\">${icon('send')} Tagih &middot; layar terpisah<\u002Fspan>\n     <div class=\"sheet-title\">Tagih ${m.first}<\u002Fdiv>\n     <div class=\"sheet-sub\">Pesan udah siap. Cek dulu, lalu bagikan lewat chat mana pun.<\u002Fdiv>\n     <div class=\"msg\" id=\"msgVal\">${msg.replace(/<\u002Fg,\"&lt;\")}<\u002Fdiv>\n     <div class=\"sheet-actions\">\n       <button class=\"btn btn--primary\" id=\"shareMsg\">${icon('send')} Bagikan pesan<\u002Fbutton>\n       <button class=\"copy\" id=\"copyMsg\" style=\"width:100%; justify-content:center\">${icon('copy')} Salin pesan<\u002Fbutton>\n     <\u002Fdiv>\n     <div class=\"disclaim\">${icon('lock')}<span>Cuma teks. BagiBill ga narik pembayaran & ga nyambung ke bank.<\u002Fspan><\u002Fdiv>`\n  );\n  $(\"#copyMsg\").addEventListener(\"click\",()=>copyText(msg,$(\"#copyMsg\")));\n  $(\"#shareMsg\").addEventListener(\"click\",()=>{\n    if(navigator.share){ navigator.share({text:msg}).catch(()=>{}); }\n    $(\"#shareMsg\").innerHTML=`${icon('check')} Membuka share…`;\n  });\n}\nfunction copyText(text,btn){\n  const done=()=>{ btn.classList.add(\"is-done\"); btn.innerHTML=`${icon('check')} Tersalin`; setTimeout(()=>{ btn.classList.remove(\"is-done\"); btn.innerHTML=`${icon('copy')} Salin`; },1600); };\n  if(navigator.clipboard){ navigator.clipboard.writeText(text).then(done,done); } else done();\n}\n\n/* ============================================================\n   MODE + STATE\n   ============================================================ */\nfunction setMode(m){\n  MODE=m;\n  document.querySelectorAll(\".seg-btn\").forEach(b=>b.classList.toggle(\"is-active\",b.dataset.mode===m));\n  renderPos(); renderGraph(); renderXfers(); renderHint();\n}\ndocument.querySelectorAll(\".seg-btn\").forEach(b=>b.addEventListener(\"click\",()=>{ setMode(b.dataset.mode); syncDev(b.dataset.mode); }));\n\nfunction setState(s){\n  document.querySelectorAll(\"#devStates .dev-btn\").forEach(b=>b.classList.toggle(\"is-active\",b.dataset.state===s));\n  $(\"#doneState\").hidden=true; $(\"#emptyState\").hidden=true; closeSheet();\n  document.querySelectorAll(\".xfer.flash\").forEach(x=>x.classList.remove(\"flash\"));\n  if(s===\"ringkas\") setMode(\"ringkas\");\n  else if(s===\"langsung\") setMode(\"langsung\");\n  else if(s===\"trace\"){ setMode(\"ringkas\"); openTrace(RINGKAS[3]); }        // Andi→Dewi, routing terkuat\n  else if(s===\"note\"){ setMode(\"ringkas\"); openMember(\"farhan\"); }\n  else if(s===\"tagih\"){ setMode(\"ringkas\"); openTagih(\"farhan\"); }\n  else if(s===\"partial\"){ setMode(\"ringkas\"); const el=document.querySelector('.xfer[data-partial=\"1\"]'); if(el){ $(\"#body\").scrollTop=el.offsetTop-160; el.classList.add(\"flash\"); } }\n  else if(s===\"history\"){ setMode(\"ringkas\"); $(\"#histToggle\").classList.add(\"is-open\"); $(\"#histList\").classList.add(\"is-open\"); $(\"#body\").scrollTop=$(\"#body\").scrollHeight; }\n  else if(s===\"done\"){ $(\"#doneState\").hidden=false; }\n  else if(s===\"empty\"){ $(\"#emptyState\").hidden=false; }\n}\nfunction syncDev(s){ document.querySelectorAll(\"#devStates .dev-btn\").forEach(b=>b.classList.toggle(\"is-active\",b.dataset.state===s)); }\ndocument.querySelectorAll(\"#devStates .dev-btn\").forEach(b=>b.addEventListener(\"click\",()=>setState(b.dataset.state)));\ndocument.querySelectorAll(\"[data-theme-btn]\").forEach(b=>b.addEventListener(\"click\",()=>applyTheme(b.dataset.themeBtn)));\n$(\"#posCard\").addEventListener(\"click\",()=>{ const el=document.querySelector(\".bal.is-me\"); if(el){ $(\"#body\").scrollTop=el.offsetTop-80; el.classList.add(\"flash\"); setTimeout(()=>el.classList.remove(\"flash\"),900);} });\n\nfunction applyTheme(t){\n  document.documentElement.setAttribute(\"data-theme\",t);\n  document.querySelectorAll(\"[data-theme-btn]\").forEach(x=>x.classList.toggle(\"is-active\",x.dataset.themeBtn===t));\n  $(\"#themeBtn\").textContent = t===\"dark\"?\"Terang\":\"Gelap\";\n}\nfunction toggleTheme(){ applyTheme(document.documentElement.getAttribute(\"data-theme\")===\"dark\"?\"light\":\"dark\"); }\n\n/* ---- init ---- */\nrenderPos(); renderGraph(); renderBalances(); renderXfers(); renderHint(); renderHistory();\n\n/* ---- design notes ---- */\n$(\"#notes\").innerHTML = `\n<h3>Catatan desain — Saldo sebagai tab<\u002Fh3>\n<p><b>Keputusan bentuk.<\u002Fb> Isi settle-up tetap seperti mockup asli, tapi <b>header sendiri dibuang<\u002Fb>: layar ini nebeng header grup + baris tab dari <code>Detail_Grup_Transaksi.html<\u002Fcode>. Yang <b>tinggal di tab<\u002Fb>: jaringan transfer, saldo tiap orang, transfer disarankan, riwayat. Yang <b>didorong ke layar terpisah<\u002Fb> (sheet dari bawah, ditandai badge <code>sheet<\u002Fcode>): telusuri satu angka, catatan bayar + salin, dan susun pesan tagih — tiga hal yang butuh ruang penuh & fokus, ga muat rapi di tab.<\u002Fp>\n<h4>Anti duplikasi angka<\u002Fh4>\n<p>Brief melarang dua tempat menampilkan saldo yang sama dengan susunan beda. Karena header grup <b>sudah<\u002Fb> punya kartu \"Posisi kamu\", tab ini <b>tidak<\u002Fb> mengulang hero posisi pribadi. Kartu header = satu-satunya ringkasan; ketuk = flash ke baris \"kamu\" di daftar saldo (bukan pindah tempat). Angka & tanda di kartu header <b>identik<\u002Fb> dengan baris saldo \"kamu\" (+Rp 1.240.000, nerima). Satu angka, dua penempatan yang saling menunjuk — bukan dua versi.<\u002Fp>\n<h4>Ringkas vs Langsung sebagai bentuk<\u002Fh4>\n<p>Bedanya digambar, bukan dinarasikan: <b>diagram jaringan<\u002Fb> di atas daftar. Simpul = orang (warna identitas member, nama selalu ikut), garis = transfer, <b>tebal garis ∝ besar transfer<\u002Fb>, panah = arah, <b>garis putus-putus<\u002Fb> = lewat perantara. Ganti mode → jaringan berubah bentuk (4 garis vs 5, pola beda). <b>Kasus balik: Dewi<\u002Fb> — di Langsung dia <i>bayar<\u002Fi> Rp 300rb ke Sarah + nerima Rp 380rb dari Farhan; di Ringkas dia <i>cuma nerima<\u002Fi> Rp 80rb dari Andi, ga bayar siapa-siapa. Justru kasus ini yang paling bikin curiga, jadi telusurinya paling diperjelas.<\u002Fp>\n<h4>Telusuri lintas mode<\u002Fh4>\n<p>Ketuk garis di jaringan <b>atau<\u002Fb> baris transfer → sheet telusuri. Untuk transfer hasil Ringkas yang bukan pasangan utang asli (Andi→Dewi, Andi→kamu), sheet buka dgn blok <b>\"kenapa lewat sini\"<\u002Fb> + peta rute, lalu transaksi asal yang <b>dijumlah bertanda<\u002Fb> (+ nalangin, − bagian sendiri) sampai ketemu angka net. Tiap transaksi nge-link ke tab Transaksi.<\u002Fp>\n<h4>Buta warna & matahari terik<\u002Fh4>\n<p>Arah utang <b>tidak<\u002Fb> cuma merah/hijau: tiap baris punya glyph <b>+/−<\u002Fb>, <b>panah<\u002Fb> naik/turun, dan <b>label kata<\u002Fb> (\"nerima\"/\"bayar\"/\"lunas\"). Nominal tabular (tnum) + bobot tebal biar kebaca di bawah matahari. Nama <b>wajib<\u002Fb> di tiap baris & simpul; avatar telanjang cuma di tumpukan header.<\u002Fp>\n<h4>Uang ga lewat aplikasi<\u002Fh4>\n<p>Ga ada tombol bayar beneran. Tombol \"Kirim info\" & \"Tagih\" cuma <b>salin<\u002Fb> + <b>share sheet<\u002Fb> teks. Sheet catatan bayar & tagih ada catatan tegas: BagiBill ga megang uang, ga nyambung bank.<\u002Fp>\n<h4>9 keadaan<\u002Fh4>\n<p>Semua bisa dipindah lewat panel kanan. 4 native tab (Ringkas, Langsung, sebagian, riwayat), 3 sheet (telusuri, catatan, tagih), 2 full-bleed tab-state (semua lunas, belum ada transaksi). Tidak ada yang digabung/dihapus — sembilan utuh. \"Semua lunas\" & \"kosong\" tetap di file yang sama sebagai overlay dalam tab.<\u002Fp>\n<h4>Perubahan header (buat disesuaikan di tab Transaksi nanti)<\u002Fh4>\n<ul>\n  <li>Angka \"Posisi kamu\" diselaraskan ke <b>+Rp 1.240.000 (nerima)<\u002Fb> — di Transaksi sekarang masih <code>−Rp 485.000<\u002Fcode>. Harus satu sumber angka.<\u002Fli>\n  <li>Tumpukan avatar dibuat <b>5 orang<\u002Fb> (Nadia/Farhan/Sarah/Andi/Dewi) tanpa \"+N\", sesuai data grup 5 orang di brief ini.<\u002Fli>\n<\u002Ful>\n<h4>Token<\u002Fh4>\n<p>Semua dari <code>tokens.css<\u002Fcode>. Tambahan yang perlu disusul ke token: <code>--route/--route-text/--route-tint<\u002Fcode> (aksen \"lewat perantara\" & routing, ungu), <code>--route-line<\u002Fcode> (warna garis rute di diagram), <code>--scrim<\u002Fcode> (dim sheet), <code>--num-xl<\u002Fcode> (nominal besar). Warna <b>kategori<\u002Fb> masih diturunkan dari palet member (belum ada token khusus). Warna garis jaringan = warna pembayar (identitas), bukan semantik baru.<\u002Fp>\n`;\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
