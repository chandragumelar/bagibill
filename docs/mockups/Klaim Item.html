document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n  gap:var(--sp-6); padding:var(--sp-6);\n  min-height:100vh;\n}\n\n/* ---- Numeral helper ---- */\n.k-num{ font-variant-numeric:tabular-nums; font-feature-settings:\"tnum\" 1,\"lnum\" 1; }\n\n/* ---- Device shell ---- */\n.k-device{\n  position:relative; width:360px; height:780px;\n  background:var(--surface-sunken);\n  border-radius:34px; overflow:hidden;\n  box-shadow:var(--elev-3);\n  display:flex; flex-direction:column;\n}\n.k-statusbar{\n  flex:0 0 auto; height:44px; padding:0 var(--sp-5) 0 var(--sp-6);\n  display:flex; align-items:center; justify-content:space-between;\n  font-size:var(--fs-footnote); font-weight:var(--fw-semibold);\n  color:var(--text); background:var(--surface);\n}\n.k-statusbar .k-sb-right{ display:flex; align-items:center; gap:5px; opacity:.85; }\n.k-sb-glyph{ width:17px; height:11px; }\n.k-sb-glyph rect{ fill:currentColor; }\n\n/* ---- Scroll region ---- */\n.k-scroll{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; position:relative; }\n.k-scroll::-webkit-scrollbar{ width:0; }\n\n/* ---- Header / konteks ---- */\n.k-header{\n  padding:var(--sp-4) var(--sp-5) var(--sp-4);\n  background:var(--surface);\n  border-bottom:1px solid var(--border);\n}\n.k-brandrow{ display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--sp-4); }\n.k-brand{ display:flex; align-items:center; gap:var(--sp-2); font-size:var(--fs-footnote); font-weight:var(--fw-semibold); color:var(--text-secondary); }\n.k-brand-mark{ width:20px; height:20px; border-radius:6px; background:var(--brand); color:var(--on-brand); font-size:11px; font-weight:var(--fw-bold); display:flex; align-items:center; justify-content:center; }\n.k-secure{ display:flex; align-items:center; gap:5px; font-size:var(--fs-caption); color:var(--text-muted); }\n.k-secure svg{ width:12px; height:12px; }\n\n.k-invite{ display:flex; align-items:center; gap:var(--sp-3); }\n.k-invite .k-avatar{ width:40px; height:40px; font-size:var(--fs-subhead); flex:0 0 auto; }\n.k-invite-text{ min-width:0; }\n.k-group{ font-size:var(--fs-title3); font-weight:var(--fw-bold); line-height:var(--line-tight); letter-spacing:-.01em; }\n.k-invite-sub{ font-size:var(--fs-footnote); color:var(--text-secondary); margin-top:2px; }\n.k-invite-sub b{ color:var(--text); font-weight:var(--fw-semibold); }\n\n.k-billmeta{ display:flex; align-items:baseline; gap:var(--sp-2); margin-top:var(--sp-4); padding-top:var(--sp-4); border-top:1px dashed var(--border); }\n.k-billmeta-label{ font-size:var(--fs-caption); color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; }\n.k-billmeta-total{ margin-left:auto; font-size:var(--fs-body); font-weight:var(--fw-bold); }\n\n/* ---- Avatar ---- */\n.k-avatar{\n  --c:var(--n-5);\n  width:28px; height:28px; border-radius:var(--r-pill);\n  background:var(--c); color:#fff;\n  display:flex; align-items:center; justify-content:center;\n  font-size:var(--fs-caption); font-weight:var(--fw-bold);\n  flex:0 0 auto; line-height:1; letter-spacing:.01em;\n  box-shadow:0 0 0 2px var(--surface);\n}\n.k-avatar--sm{ width:22px; height:22px; font-size:var(--fs-caption2); }\n.k-avatar--me{ box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--brand); }\n\n/* ---- Presence (siapa yang lagi buka) ---- */\n.k-presence{\n  position:sticky; top:0; z-index:6;\n  display:flex; align-items:center; gap:var(--sp-2);\n  padding:var(--sp-2) var(--sp-5);\n  background:var(--surface-sunken);\n  border-bottom:1px solid var(--border);\n  font-size:var(--fs-caption); color:var(--text-secondary);\n}\n.k-presence-avatars{ display:flex; }\n.k-presence-avatars .k-avatar{ margin-left:-7px; }\n.k-presence-avatars .k-avatar:first-child{ margin-left:0; }\n.k-live-dot{ width:7px; height:7px; border-radius:50%; background:var(--pos); box-shadow:0 0 0 0 var(--pos); animation:k-pulse 2s var(--ease-standard) infinite; flex:0 0 auto; }\n@keyframes k-pulse{ 0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pos) 55%,transparent);} 70%{box-shadow:0 0 0 6px transparent;} 100%{box-shadow:0 0 0 0 transparent;} }\n\n/* ---- Progress ---- */\n.k-progress{ padding:var(--sp-3) var(--sp-5) var(--sp-2); }\n.k-progress-top{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; }\n.k-progress-label{ font-size:var(--fs-caption); color:var(--text-muted); }\n.k-progress-count{ font-size:var(--fs-caption); font-weight:var(--fw-semibold); color:var(--text-secondary); }\n.k-progress-track{ height:6px; border-radius:var(--r-pill); background:var(--n-3); overflow:hidden; }\n.k-progress-fill{ height:100%; width:0%; border-radius:var(--r-pill); background:var(--pos); transition:width var(--dur-base) var(--ease-standard); }\n\n/* ---- Section label ---- */\n.k-sectlabel{ padding:var(--sp-4) var(--sp-5) var(--sp-2); font-size:var(--fs-caption); font-weight:var(--fw-semibold); color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; display:flex; align-items:center; gap:var(--sp-2); }\n\n/* ---- Item list ---- */\n.k-list{ padding:0 var(--sp-4) var(--sp-4); display:flex; flex-direction:column; gap:var(--sp-2); }\n\n.k-item{\n  position:relative; text-align:left; width:100%;\n  background:var(--surface); border:1.5px solid var(--border);\n  border-radius:var(--r-card); padding:var(--sp-3);\n  display:flex; flex-direction:column; gap:var(--sp-2);\n  cursor:pointer; font-family:inherit; color:inherit;\n  transition:border-color var(--dur-tap) var(--ease-standard),\n             background var(--dur-tap) var(--ease-standard),\n             transform var(--dur-tap) var(--ease-standard),\n             box-shadow var(--dur-tap) var(--ease-standard);\n}\n.k-item:active{ transform:scale(.985); }\n.k-item:focus-visible{ outline:none; box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--brand); }\n\n.k-item-main{ display:flex; align-items:center; gap:var(--sp-3); }\n\n/* claim control — kotak centang besar, target sentuh nyaman */\n.k-check{\n  flex:0 0 auto; width:26px; height:26px; border-radius:8px;\n  border:2px solid var(--n-4); background:transparent;\n  display:flex; align-items:center; justify-content:center;\n  transition:all var(--dur-tap) var(--ease-standard);\n}\n.k-check svg{ width:15px; height:15px; opacity:0; transform:scale(.5); transition:all var(--dur-tap) var(--ease-emphasized); stroke:var(--on-brand); }\n\n.k-item-info{ flex:1 1 auto; min-width:0; }\n.k-item-name{ font-size:var(--fs-subhead); font-weight:var(--fw-semibold); line-height:var(--line-body); color:var(--text); overflow-wrap:anywhere; }\n.k-item-meta{ font-size:var(--fs-caption); color:var(--text-muted); margin-top:2px; }\n\n.k-item-right{ flex:0 0 auto; text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:3px; }\n.k-item-price{ font-size:var(--fs-subhead); font-weight:var(--fw-semibold); }\n.k-portion{ font-size:var(--fs-caption2); font-weight:var(--fw-semibold); color:var(--text-secondary); background:var(--n-2); border-radius:var(--r-pill); padding:2px 7px; white-space:nowrap; }\n\n/* claimers strip di bawah baris item */\n.k-claimers{ display:flex; flex-wrap:wrap; align-items:center; gap:var(--sp-2); padding-left:calc(26px + var(--sp-3)); min-height:22px; }\n.k-claimer{ display:flex; align-items:center; gap:5px; background:var(--n-2); border-radius:var(--r-pill); padding:2px 8px 2px 2px; }\n.k-claimer .k-avatar{ box-shadow:none; }\n.k-claimer-name{ font-size:var(--fs-caption); font-weight:var(--fw-medium); color:var(--text-secondary); }\n.k-claim-hint{ font-size:var(--fs-caption); color:var(--n-5); font-style:normal; }\n\n/* Badge \"belum diklaim\" — gampang keliatan */\n.k-open-tag{ display:inline-flex; align-items:center; gap:5px; font-size:var(--fs-caption2); font-weight:var(--fw-semibold); color:var(--brand); }\n.k-open-tag::before{ content:\"\"; width:6px; height:6px; border-radius:50%; background:var(--brand); }\n\n/* State: diklaim oleh kamu */\n.k-item.is-mine{ border-color:var(--brand); background:var(--brand-tint); }\n.k-item.is-mine .k-check{ border-color:var(--brand); background:var(--brand); }\n.k-item.is-mine .k-check svg{ opacity:1; transform:scale(1); }\n\n/* State: penuh diklaim orang lain (bukan kamu) */\n.k-item.is-full{ border-style:dashed; }\n.k-item.is-full .k-check{ border-color:var(--n-4); border-style:dashed; }\n\n/* State: shared / bareng rame */\n.k-item.is-shared .k-portion{ background:var(--brand-tint); color:var(--brand-strong); }\n\n/* ---- Sticky footer: nominal kamu (selalu keliatan) ---- */\n.k-footer{\n  flex:0 0 auto; padding:var(--sp-3) var(--sp-5) var(--sp-5);\n  background:var(--surface); border-top:1px solid var(--border);\n  box-shadow:0 -4px 14px rgba(16,22,30,.05);\n}\n[data-theme=\"dark\"] .k-footer{ box-shadow:0 -4px 14px rgba(0,0,0,.4); }\n.k-footer-row{ display:flex; align-items:center; gap:var(--sp-3); }\n.k-footer-label{ font-size:var(--fs-caption); color:var(--text-muted); }\n.k-footer-you{ display:flex; align-items:center; gap:var(--sp-2); font-size:var(--fs-footnote); color:var(--text-secondary); margin-bottom:2px; }\n.k-footer-amount{ font-size:var(--num-lg); font-weight:var(--fw-bold); letter-spacing:var(--num-tracking); line-height:1; transition:color var(--dur-base); }\n.k-footer-amount .k-rp{ font-size:var(--fs-title3); font-weight:var(--fw-semibold); color:var(--text-secondary); margin-right:2px; }\n.k-footer-items{ margin-left:auto; text-align:right; font-size:var(--fs-caption); color:var(--text-muted); }\n.k-footer-items b{ display:block; font-size:var(--fs-title3); font-weight:var(--fw-bold); color:var(--text); }\n.k-bump{ animation:k-bump var(--dur-base) var(--ease-emphasized); }\n@keyframes k-bump{ 0%{transform:scale(1);} 40%{transform:scale(1.06);} 100%{transform:scale(1);} }\n\n/* ---- Buttons ---- */\n.k-btn{\n  appearance:none; border:none; font-family:inherit; cursor:pointer;\n  font-size:var(--fs-headline); font-weight:var(--fw-semibold);\n  border-radius:var(--r-btn); padding:var(--sp-3) var(--sp-4);\n  display:flex; align-items:center; justify-content:center; gap:var(--sp-2);\n  transition:background var(--dur-tap) var(--ease-standard), transform var(--dur-tap) var(--ease-standard);\n  width:100%;\n}\n.k-btn:active{ transform:scale(.98); }\n.k-btn--primary{ background:var(--btn-bg); color:var(--btn-fg); }\n.k-btn--primary:hover{ background:var(--btn-bg-hover); }\n.k-btn--primary:disabled{ background:var(--btn-bg-disabled); color:var(--btn-fg-disabled); cursor:default; }\n.k-btn--secondary{ background:var(--btn2-bg); color:var(--btn2-fg); border:1px solid var(--btn2-border); }\n.k-btn--secondary:hover{ background:var(--btn2-bg-hover); }\n.k-btn--ghost{ background:transparent; color:var(--text-secondary); }\n\n/* ============================================================\n   State: PILIH IDENTITAS (overlay penuh)\n   ============================================================ */\n.k-identity{\n  position:absolute; inset:0; z-index:20;\n  background:var(--surface-sunken);\n  display:flex; flex-direction:column;\n  padding:var(--sp-6) var(--sp-5) var(--sp-5);\n  overflow-y:auto;\n  transition:opacity var(--dur-base) var(--ease-standard);\n}\n.k-identity-head{ margin-bottom:var(--sp-5); }\n.k-identity-kicker{ font-size:var(--fs-caption); font-weight:var(--fw-semibold); color:var(--brand); text-transform:uppercase; letter-spacing:.05em; }\n.k-identity-title{ font-size:var(--fs-title2); font-weight:var(--fw-bold); line-height:var(--line-tight); letter-spacing:-.01em; margin-top:var(--sp-2); }\n.k-identity-sub{ font-size:var(--fs-footnote); color:var(--text-secondary); margin-top:var(--sp-2); line-height:var(--line-relaxed); }\n.k-identity-note{ display:flex; gap:var(--sp-2); align-items:flex-start; margin-top:var(--sp-4); padding:var(--sp-3); background:var(--brand-tint); border-radius:var(--r-field); font-size:var(--fs-caption); color:var(--brand-strong); line-height:var(--line-body); }\n.k-identity-note svg{ width:14px; height:14px; flex:0 0 auto; margin-top:1px; }\n\n.k-picklabel{ font-size:var(--fs-caption); font-weight:var(--fw-semibold); color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; margin:var(--sp-5) 0 var(--sp-3); }\n.k-memberpick{ display:flex; flex-direction:column; gap:var(--sp-2); }\n.k-memberopt{\n  display:flex; align-items:center; gap:var(--sp-3);\n  background:var(--surface); border:1.5px solid var(--border);\n  border-radius:var(--r-card); padding:var(--sp-3) var(--sp-4);\n  cursor:pointer; font-family:inherit; text-align:left; width:100%;\n  transition:border-color var(--dur-tap), background var(--dur-tap), transform var(--dur-tap);\n}\n.k-memberopt:active{ transform:scale(.99); }\n.k-memberopt:hover{ border-color:var(--n-4); }\n.k-memberopt.is-sel{ border-color:var(--brand); background:var(--brand-tint); }\n.k-memberopt .k-avatar{ width:36px; height:36px; font-size:var(--fs-subhead); box-shadow:none; }\n.k-memberopt-name{ flex:1 1 auto; font-size:var(--fs-body); font-weight:var(--fw-semibold); color:var(--text); }\n.k-memberopt-tick{ width:22px; height:22px; border-radius:50%; border:2px solid var(--n-4); flex:0 0 auto; display:flex; align-items:center; justify-content:center; }\n.k-memberopt-tick svg{ width:12px; height:12px; opacity:0; stroke:var(--on-brand); }\n.k-memberopt.is-sel .k-memberopt-tick{ background:var(--brand); border-color:var(--brand); }\n.k-memberopt.is-sel .k-memberopt-tick svg{ opacity:1; }\n.k-samehint{ font-size:var(--fs-caption2); color:var(--m-11); font-weight:var(--fw-semibold); background:color-mix(in srgb,var(--m-11) 12%,transparent); padding:1px 7px; border-radius:var(--r-pill); }\n\n.k-newname{ margin-top:var(--sp-3); }\n.k-field{\n  width:100%; font-family:inherit; font-size:var(--fs-body); color:var(--text);\n  background:var(--surface); border:1.5px solid var(--border);\n  border-radius:var(--r-field); padding:var(--sp-3) var(--sp-4);\n  transition:border-color var(--dur-tap);\n}\n.k-field::placeholder{ color:var(--n-5); }\n.k-field:focus{ outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-tint); }\n\n.k-identity-foot{ margin-top:auto; padding-top:var(--sp-5); }\n\n/* ============================================================\n   Sheet konfirmasi bagi berdua\n   ============================================================ */\n.k-scrim{\n  position:absolute; inset:0; z-index:30; background:var(--scrim);\n  opacity:0; pointer-events:none; transition:opacity var(--dur-base) var(--ease-standard);\n  display:flex; align-items:flex-end;\n}\n.k-scrim.is-open{ opacity:1; pointer-events:auto; }\n.k-sheet{\n  width:100%; background:var(--surface);\n  border-radius:20px 20px 0 0; padding:var(--sp-5) var(--sp-5) var(--sp-6);\n  transform:translateY(100%); transition:transform var(--dur-sheet) var(--ease-emphasized);\n  box-shadow:var(--elev-3);\n}\n.k-scrim.is-open .k-sheet{ transform:translateY(0); }\n.k-sheet-grab{ width:36px; height:5px; border-radius:var(--r-pill); background:var(--n-4); margin:0 auto var(--sp-4); }\n.k-sheet-item{ display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3); background:var(--surface-sunken); border-radius:var(--r-card); margin-bottom:var(--sp-4); }\n.k-sheet-item .k-item-info{ flex:1 1 auto; }\n.k-sheet-title{ font-size:var(--fs-title3); font-weight:var(--fw-bold); line-height:var(--line-tight); }\n.k-sheet-sub{ font-size:var(--fs-footnote); color:var(--text-secondary); margin-top:var(--sp-2); line-height:var(--line-relaxed); }\n.k-sheet-who{ display:flex; align-items:center; gap:6px; margin-top:var(--sp-3); font-size:var(--fs-footnote); color:var(--text-secondary); flex-wrap:wrap; }\n.k-split-calc{ display:flex; align-items:baseline; justify-content:space-between; margin:var(--sp-4) 0; padding:var(--sp-3) var(--sp-4); background:var(--brand-tint); border-radius:var(--r-card); }\n.k-split-calc-label{ font-size:var(--fs-footnote); color:var(--brand-strong); }\n.k-split-calc-val{ font-size:var(--fs-title2); font-weight:var(--fw-bold); color:var(--brand-strong); }\n.k-split-calc-val s{ font-size:var(- ht:var(--fw-semibold); }\n\n.k-summary-foot{ flex:0 0 auto; padding:var(--sp-4) var(--sp-5) var(--sp-5); background:var(--surface); border-top:1px solid var(--border); display:flex; flex-direction:column; gap:var(--sp-2); }\n.k-dispute{ text-align:center; }\n\n/* ---- Dev switcher (bukan bagian produk) ---- */\n.k-dev{\n  width:220px; flex:0 0 auto; position:sticky; top:var(--sp-6);\n  background:var(--surface); color:var(--text);\n  border-radius:var(--r-card); padding:var(--sp-4); box-shadow:var(--elev-2);\n  font-size:var(--fs-footnote);\n}\n.k-dev h4{ font-size:var(--fs-caption); text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:var(--sp-3); font-weight:var(--fw-semibold); }\n.k-dev-group{ display:flex; flex-direction:column; gap:6px; margin-bottom:var(--sp-4); }\n.k-dev-btn{\n  appearance:none; text-align:left; font-family:inherit; font-size:var(--fs-footnote);\n  border:1px solid var(--border); background:var(--surface-sunken); color:var(--text);\n  border-radius:var(--r-btn); padding:var(--sp-2) var(--sp-3); cursor:pointer;\n  transition:all var(--dur-tap);\n}\n.k-dev-btn:hover{ border-color:var(--n-4); }\n.k-dev-btn.is-active{ background:var(--brand); color:var(--on-brand); border-color:var(--brand); }\n.k-dev-note{ font-size:var(--fs-caption); color:var(--text-muted); line-height:var(--line-relaxed); }\n.k-dev-theme{ display:flex; gap:6px; }\n.k-dev-theme .k-dev-btn{ flex:1; text-align:center; }\n\n@media(max-width:640px){ .k-dev{ display:none; } body{ padding:0; align-items:stretch; } .k-device{ border-radius:0; height:100vh; width:100%; max-width:420px; margin:0 auto; } }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n<div class=\"k-device\" id=\"device\">\n  <div class=\"k-statusbar\">\n    <span class=\"k-num\">19:42<\u002Fspan>\n    <span class=\"k-sb-right\">\n      <svg class=\"k-sb-glyph\" viewBox=\"0 0 17 11\" aria-hidden=\"true\"><rect x=\"0\" y=\"7\" width=\"3\" height=\"4\" rx=\"1\"><\u002Frect><rect x=\"4.5\" y=\ ">BS<\u002Fspan>\n        <span class=\"k-avatar k-avatar--sm\" style=\"--c:var(--m-7)\">DP<\u002Fspan>\n        <span class=\"k-avatar k-avatar--sm\" style=\"--c:var(--m-5)\">R<\u002Fspan>\n      <\u002Fspan>\n      <span><b id=\"presenceName\">Bagus<\u002Fb>, Dimas &amp; Rina lagi buka bareng kamu<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"k-progress\">\n      <div class=\"k-progress-top\">\n        <span class=\"k-progress-label\">Item keklaim<\u002Fspan>\n        <span class=\"k-progress-count k-num\"><span id=\"progCount\">0<\u002Fspan> dari 12<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"k-progress-track\"><div class=\"k-progress-fill\" id=\"progFill\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"k-sectlabel\">Tandai yang kamu makan<\u002Fdiv>\n    <div class=\"k-list\" id=\"list\"><!-- item di-render oleh JS --><\u002Fdiv>\n\n    <div class=\"k-sectlabel\">Dibagi rame-rame<\u002Fdiv>\n    <div class=\"k-list\" id=\"listShared\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===== FOOTER: NOMINAL KAMU ===== -->\n  <div class=\"k-footer\">\n    <div class=\"k-footer-you\">Punyamu, <b id=\"footYou\">…<\u002Fb><\u002Fdiv>\n    <div class=\"k-footer-row\">\n      <div class=\"k-footer-amount k-num\" id=\"footAmount\"><span class=\"k-rp\">Rp<\u002Fspan>0<\u002Fdiv>\n      <div class=\"k-footer-items\">\n        <b class=\"k-num\" id=\"footItems\">0<\u002Fb>\n        item ditandai\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===== OVERLAY: PILIH IDENTITAS ===== -->\n  <div class=\"k-identity\" id=\"identity\">\n    <div class=\"k-identity-head\">\n      <div class=\"k-identity-kicker\">Makan Malam Tim<\u002Fdiv>\n      <div class=\"k-identity-title\">Kamu yang mana?<\u002Fdiv>\n      <div class=\"k-identity-sub\">Bagus udah masukin nama teman-teman. Pilih namamu, atau tambah kalau belum ada. Ini biar tagihanmu ga ketuker.<\u002Fdiv>\n      <div class=\"k-identity-note\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"curr k-btn k-btn--ghost\" id=\"splitCancel\">Batal, bukan punyaku<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===== OVERLAY: RINGKASAN SETELAH FINALISASI ===== -->\n  <div class=\"k-summary\" id=\"summary\" hidden=\"\">\n    <div class=\"k-summary-hero\">\n      <div class=\"k-summary-lock\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"10\" rx=\"2\"><\u002Frect><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"><\u002Fpath><path d=\"M9.5 15l1.8 1.8 3.2-3.6\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"k-summary-kicker\"><b>Bagus<\u002Fb> udah nutup tagihan · Makan Malam Tim<\u002Fdiv>\n      <div class=\"k-summary-amount k-num\"><span class=\"k-rp\">Rp<\u002Fspan><span id=\"sumAmount\">0<\u002Fspan><\u002Fdiv>\n      <div class=\"k-summary-share\">Bagianmu, <span id=\"sumYou\">…<\u002Fspan> · <span id=\"sumCount\">0<\u002Fspan> item<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"k-summary-list\" id=\"sumList\"><\u002Fdiv>\n    <div class=\"k-summary-foot\">\n      <button class=\"k-btn k-btn--primary\">Bayar ke Bagus<\u002Fbutton>\n      <button class=\"k-btn k-btn--ghost k-dispute\" id=\"disputeBtn\">Ada yang salah? Kabari Bagus<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ===== DEV SWITCHER (bukan bagian produk) ===== -->\n<aside class=\"k-dev\">\n  <h4>Keadaan layar<\u002Fh4>\n  <div class=\"k-dev-group\" id=\"devStates\">\n    <button class=\"k-dev-btn\" data-state=\"identity\">1 · Pilih identitas<\u002Fbutton>\n    <button class=\"k-dev-btn is-active\" data-state=\"claim\">2 · Klaim berjalan<\u002Fbutton>\n    <button class=\"k-dev-btn\" data-state=\"split\">3 · Konfirmasi bagi berdua<\u002Fbutton>\n    <button class=\"k-dev-btn\" data-state=\"summary\">4 · Ringkasan finalisasi<\u002Fbutton>\n  <\u002Fdiv>\n  <h4>Tema<\u002Fh4>\n  <div class=\"k-dev-theme\">\n    <button class=\"k-dev-btn is-active\" data-theme-btn=\"light\">Terang<\u002Fbutton>\n    <button class=\"k-dev-btn\" data-theme-btn=\"dark\">Gelap<\u002Fbutton>\n  <\u002Fdiv>\n  <p class=\"k-dev-note\">Layar member. Tap item buat klaim; tap item penuh buat momen bagi berdua. Total kamu di bawah selalu keliatan.<\u002Fp>\n<\u002Faside>\n\n<script>\n/* ============================================================\n   DATA — realistis, menu Indonesia. Harga dalam rupiah.\n   claimers: array id member yang sudah klaim (satu porsi masing2).\n   cap: berapa porsi (qty). shared:true = item bagi rame otomatis.\n   ============================================================ */\nconst MEMBERS = {\n  bagus: { name:\"Bagus Santoso\", first:\"Bagus\", initials:\"BS\", color:\"var(--m-4)\" },\n  dimas: { name:\"Dimas Prasetyo\", first:\"Dimas\", initials:\"DP\", color:\"var(--m-7)\" },\n  dina:  { name:\"Dina Kartika\",   first:\"Dina\",  initials:\"DK\", color:\"var(--m-11)\", same:true },\n  rina:  { name:\"Rina\",           first:\"Rina\",  initials:\"R\",  color:\"var(--m-5)\" },\n  reza:  { name:\"Reza Aditya\",    first:\"Reza\",  initials:\"RA\", color:\"var(--m-2)\" },\n};\nconst ME = \"me\";\n\nconst ITEMS = [\n  { id:\"i1\",  name:\"Nasi Goreng Kampung\",       qty:2, price:32000, claimers:[\"bagus\"] },\n  { id:\"i2\",  name:\"Ayam Bakar Madu\",           qty:1, price:45000, claimers:[\"dimas\"] },\n  { id:\"i3\",  name:\"Sate Ayam Bumbu Kacang Spesial Racikan Pak Kumis\", qty:1, price:38000, claimers:[] },\n  { id:\"i4\",  name:\"Sop Buntut Bakar\",          qty:1, price:55000, claimers:[\"dina\"] },\n  { id:\"i5\",  name:\"Cumi Goreng Tepung\",        qty:1, price:42000, claimers:[] },\n  { id:\"i6\",  name:\"Tahu Telur Petis\",          qty:1, price:25000, claimers:[\"rina\"] },\n  { id:\"i7\",  name:\"Kangkung Terasi\",           qty:1, price:28000, claimers:[] },\n  { id:\"i8\",  name:\"Cah Kailan Bawang Putih\",   qty:1, price:30000, claimers:[\"reza\"] },\n  { id:\"i9\",  name:\"Es Jeruk\",                  qty:2, price:12000, claimers:[\"dimas\"] },\n  { id:\"i10\", name:\"Es Teh Manis\",              qty:3, price:8000,  claimers:[\"bagus\",\"rina\"] },\n];\nconst SHARED = [\n  { id:\"s1\", name:\"Nasi Putih\",   qty:4, price:6000, shared:true, claimers:[\"bagus\",\"dimas\",\"dina\",\"rina\"] },\n  { id:\"s2\", name:\"Air Mineral\",  qty:2, price:5000, shared:true, claimers:[\"bagus\",\"reza\"] },\n];\nconst ALL = ITEMS.concat(SHARED);\n\n/* ---- Util ---- */\nconst rp = n => \"Rp \" + n.toLocaleString(\"id-ID\");\nconst rpn = n => n.toLocaleString(\"id-ID\");\nconst $ = s => document.querySelector(s);\nconst meLabel = () => (state.meName || \"Kamu\");\n\nconst state = { meName:null, meInitials:\"K\", meColor:\"var(--m-8)\" };\n\n/* ============================================================\n   IDENTITAS\n   ============================================================ */\nfunction renderMembers(){\n  const wrap = $(\"#memberPick\");\n  wrap.innerHTML = \"\";\n  Object.entries(MEMBERS).forEach(([id, m]) => {\n    const b = document.createElement(\"button\");\n    b.className = \"k-memberopt\";\n    b.dataset.id = id;\n    b.innerHTML =\n      `<span class=\"k-avatar\" style=\"--c:${m.color}\">${m.initials}<\u002Fspan>\n       <span class=\"k-memberopt-name\">${m.name}<\u002Fspan>\n       ${m.same ? '<span class=\"k-samehint\">huruf D<\u002Fspan>' : ''}\n       <span class=\"k-memberopt-tick\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 13l4 4L19 7\"/><\u002Fsvg><\u002Fspan>`;\n    b.addEventListener(\"click\", () => selectIdentity(id, m));\n    wrap.appendChild(b);\n  });\n}\nfunction selectIdentity(id, m){\n  $(\"#newName\").value = \"\";\n  document.querySelectorAll(\".k-memberopt\").forEach(x => x.classList.toggle(\"is-sel\", x.dataset.id === id));\n  state.meName = m.first; state.meInitials = m.initials; state.meColor = m.color; state.meId = id;\n  const go = $(\"#identityGo\");\n  go.disabled = false; go.textContent = `Lanjut sebagai ${m.first}`;\n}\n$(\"#newName\").addEventListener(\"input\", e => {\n  const v = e.target.value.trim();\n  document.querySelectorAll(\".k-memberopt\").forEach(x => x.classList.remove(\"is-sel\"));\n  const go = $(\"#identityGo\");\n  if(v){\n    const parts = v.split(/\\s+/);\n    state.meName = parts[0];\n    state.meInitials = parts.length > 1 ? (parts[0][0]+parts[1][0]).toUpperCase() : parts[0].slice(0,1).toUpperCase();\n    state.meColor = \"var(--m-8)\"; state.meId = ME;\n    go.disabled = false; go.textContent = `Lanjut sebagai ${parts[0]}`;\n  } else {\n    go.disabled = true; go.textContent = \"Pilih dulu namamu\";\n  }\n});\n$(\"#identityGo\").addEventListener(\"click\", () => { commitIdentity(); setState(\"claim\"); });\nfunction commitIdentity(){\n  MEMBERS[ME] = { name:state.meName, first:state.meName, initials:state.meInitials, color:state.meColor };\n  $(\"#footYou\").textContent = state.meName;\n  $(\"#sumYou\").textContent = state.meName;\n}\n\n/* ============================================================\n   ITEM LIST + KLAIM\n   ============================================================ */\nfunction itemNode(it){\n  const mine = it.claimers.includes(ME);\n  const full = it.claimers.length >= it.qty;\n  const el = document.createElement(\"button\");\n  el.className = \"k-item\" + (mine ? \" is-mine\" : \"\") + (it.shared ? \" is-shared\" : \"\") + (!mine && full && !it.shared ? \" is-full\" : \"\");\n  el.dataset.id = it.id;\n\n  const portion = it.qty > 1\n    ? `<span class=\"k-portion k-num\">${it.claimers.length} dari ${it.qty} porsi<\u002Fspan>`\n    : \"\";\n  const openTag = (it.claimers.length === 0)\n    ? `<span class=\"k-open-tag\">Belum ada<\u002Fspan>` : \"\";\n\n  el.innerHTML =\n    `<div class=\"k-item-main\">\n       <span class=\"k-check\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 13l4 4L19 7\"/><\u002Fsvg><\u002Fspan>\n       <div class=\"k-item-info\">\n         <div class=\"k-item-name\">${it.name}<\u002Fdiv>\n         <div class=\"k-item-meta k-num\">${it.qty > 1 ? it.qty+\" × \" : \"\"}${rp(it.price)}${it.qty>1 ? \" · \"+rp(it.price*it.qty) : \"\"}<\u002Fdiv>\n       <\u002Fdiv>\n       <div class=\"k-item-right\">\n         <span class=\"k-item-price k-num\">${rp(it.price)}<\u002Fspan>\n         ${portion || openTag}\n       <\u002Fdiv>\n     <\u002Fdiv>\n     <div class=\"k-claimers\">${claimersHTML(it)}<\u002Fdiv>`;\n\n  el.addEventListener(\"click\", () => onItemTap(it));\n  return el;\n}\nfunction claimersHTML(it){\n  if(it.claimers.length === 0){\n    return `<span class=\"k-claim-hint\">Tap kalau kamu makan ini<\u002Fspan>`;\n  }\n  return it.claimers.map(id => {\n    const m = MEMBERS[id]; if(!m) return \"\";\n    const me = id === ME ? \" k-avatar--me\" : \"\";\n    return `<span class=\"k-claimer\"><span class=\"k-avatar k-avatar--sm${me}\" style=\"--c:${m.color}\">${m.initials}<\u002Fspan><span class=\"k-claimer-name\">${id===ME ? m.first+\" (kamu)\" : m.first}<\u002Fspan><\u002Fspan>`;\n  }).join(\"\");\n}\n\nfunction onItemTap(it){\n  const mine = it.claimers.includes(ME);\n  const full = it.claimers.length >= it.qty;\n  if(mine){                       // lepas klaim\n    it.claimers = it.claimers.filter(x => x !== ME);\n    refresh();\n  } else if(full && !it.shared){  // penuh → momen konfirmasi bagi berdua\n    openSplit(it);\n  } else {                        // klaim biasa / tambah porsi shared\n    it.claimers.push(ME);\n    refresh(true);\n  }\n}\n\nfunction renderLists(){\n  const list = $(\"#list\"), shared = $(\"#listShared\");\n  list.innerHTML = \"\"; shared.innerHTML = \"\";\n  ITEMS.forEach(it => list.appendChild(itemNode(it)));\n  SHARED.forEach(it => shared.appendChild(itemNode(it)));\n}\n\n/* ---- Total & progress ---- */\nfunction myTotal(){\n  let t = 0;\n  ALL.forEach(it => { if(it.claimers.includes(ME)) t += Math.round(it.price / it.claimers.length); });\n  return t;\n}\nfunction myCount(){ return ALL.filter(it => it.claimers.includes(ME)).length; }\nfunction claimedCount(){ return ALL.filter(it => it.claimers.length > 0).length; }\n\nfunction refresh(bump){\n  renderLists();\n  $(\"#footAmount\").innerHTML = `<span class=\"k-rp\">Rp<\u002Fspan>${rpn(myTotal())}`;\n  $(\"#footItems\").textContent = myCount();\n  const c = claimedCount(), total = ALL.length;\n  $(\"#progCount\").textContent = c;\n  $(\"#progFill\").style.width = (c/total*100) + \"%\";\n  if(bump){ const a = $(\"#footAmount\"); a.classList.remove(\"k-bump\"); void a.offsetWidth; a.classList.add(\"k-bump\"); }\n}\n\n/* ============================================================\n   SHEET: BAGI BERDUA\n   ============================================================ */\nlet splitTarget = null;\nfunction openSplit(it){\n  splitTarget = it;\n  $(\"#splitName\").textContent = it.name;\n  $(\"#splitMeta\").textContent = (it.qty>1 ? it.qty+\" × \" : \"\") + rp(it.price);\n  $(\"#splitPrice\").textContent = rp(it.price);\n  const who = it.claimers.map(id => {\n    const m = MEMBERS[id];\n    return `<span class=\"k-claimer\"><span class=\"k-avatar k-avatar--sm\" style=\"--c:${m.color}\">${m.initials}<\u002Fspan><span class=\"k-claimer-name\">${m.first}<\u002Fspan><\u002Fspan>`;\n  }).join(\"\");\n  $(\"#splitWho\").innerHTML = `<span>Sekarang di:<\u002Fspan>${who}`;\n  const half = Math.round(it.price / (it.claimers.length + 1));\n  $(\"#splitFull\").textContent = rp(it.price);\n  $(\"#splitHalf\").textContent = rp(half);\n  $(\"#splitScrim\").classList.add(\"is-open\");\n}\nfunction closeSplit(){ $(\"#splitScrim\").classList.remove(\"is-open\"); }\n$(\"#splitConfirm\").addEventListener(\"click\", () => {\n  if(splitTarget){ splitTarget.claimers.push(ME); refresh(true); }\n  closeSplit();\n});\n$(\"#splitCancel\").addEventListener(\"click\", closeSplit);\n$(\"#splitScrim\").addEventListener(\"click\", e => { if(e.target.id === \"splitScrim\") closeSplit(); });\n\n/* ============================================================\n   RINGKASAN\n   ============================================================ */\nfunction renderSummary(){\n  const mineItems = ALL.filter(it => it.claimers.includes(ME));\n  const listEl = $(\"#sumList\");\n  listEl.innerHTML = \"\";\n  if(mineItems.length === 0){\n    listEl.innerHTML = `<div class=\"k-summary-line\"><span class=\"k-summary-line-name\">Kamu belum nandain apa-apa<\u002Fspan><\u002Fdiv>`;\n  }\n  mineItems.forEach(it => {\n    const each = Math.round(it.price / it.claimers.length);\n    const split = it.claimers.length > 1;\n    const line = document.createElement(\"div\");\n    line.className = \"k-summary-line\";\n    line.innerHTML =\n      `<span class=\"k-avatar k-avatar--sm\" style=\"--c:${MEMBERS[ME].color}\">${MEMBERS[ME].initials}<\u002Fspan>\n       <span class=\"k-summary-line-name\">${it.name}${split ? `<span>Bagi ${it.claimers.length} · ${rp(it.price)}<\u002Fspan>` : \"\"}<\u002Fspan>\n       <span class=\"k-summary-line-amt k-num\">${rp(each)}<\u002Fspan>`;\n    listEl.appendChild(line);\n  });\n  $(\"#sumAmount\").textContent = rpn(myTotal());\n  $(\"#sumCount\").textContent = mineItems.length;\n}\n\n/* ============================================================\n   STATE SWITCHER\n   ============================================================ */\nfunction setState(s){\n  document.querySelectorAll(\"#devStates .k-dev-btn\").forEach(b => b.classList.toggle(\"is-active\", b.dataset.state === s));\n  const id = $(\"#identity\"), sum = $(\"#summary\"), scrim = $(\"#splitScrim\");\n  id.style.display = \"none\"; sum.hidden = true; scrim.classList.remove(\"is-open\");\n\n  if(s === \"identity\"){ id.style.display = \"flex\"; }\n  else if(s === \"claim\"){ if(!state.meName){ commitDefaultMe(); } }\n  else if(s === \"split\"){ if(!state.meName){ commitDefaultMe(); } refresh(); openSplit(ITEMS[1]); /* Ayam Bakar (punya Dimas, penuh) */ }\n  else if(s === \"summary\"){ if(!state.meName){ commitDefaultMe(); } renderSummary(); sum.hidden = false; }\n}\nfunction commitDefaultMe(){\n  // fallback demo identity supaya state claim/split/summary bisa dibuka langsung\n  state.meName = \"Kamu\"; state.meInitials = \"K\"; state.meColor = \"var(--m-8)\"; state.meId = ME;\n  commitIdentity();\n  // seed: kamu udah klaim 2 item biar total & ringkasan ada isinya\n  if(!ALL.some(it => it.claimers.includes(ME))){\n    ITEMS[4].claimers.push(ME);   // Cumi Goreng\n    SHARED[0].claimers.push(ME);  // Nasi Putih (shared)\n  }\n  refresh();\n}\ndocument.querySelectorAll(\"#devStates .k-dev-btn\").forEach(b => b.addEventListener(\"click\", () => setState(b.dataset.state)));\ndocument.querySelectorAll(\"[data-theme-btn]\").forEach(b => b.addEventListener(\"click\", () => {\n  document.documentElement.setAttribute(\"data-theme\", b.dataset.themeBtn);\n  document.querySelectorAll(\"[data-theme-btn]\").forEach(x => x.classList.toggle(\"is-active\", x === b));\n}));\n$(\"#disputeBtn\").addEventListener(\"click\", () => setState(\"claim\"));\n\n/* ---- Init ---- */\nrenderMembers();\nrefresh();\nsetState(\"claim\"); // buka di layar klaim; ganti ke \"identity\" lewat switcher\n\n/* ============================================================\n   CATATAN DESAIN (sekali, di bawah — untuk agent coding)\n   ------------------------------------------------------------\n   • Konteks pengguna: baru pertama buka, belum ada akun, di\n     restoran. Nol dinding install / izin / harga langganan.\n     Tugas tunggal: tandai item yang dia makan. Semua sisanya minggir.\n   • Identitas: avatar TIDAK berdiri sendiri — nama depan selalu\n     ikut. Inisial diambil dari kata (Dimas Prasetyo→DP, Dina\n     Kartika→DK). Kasus tabrakan huruf awal (dua \"D\") ditandai\n     eksplisit di layar pilih identitas + warna avatar dibedakan.\n   • Klaim = tap seluruh baris. Lepas = tap lagi. Ceklis besar\n     (26px) target sentuh nyaman. Item shared (Nasi Putih, Air\n     Mineral) menambah porsi, tidak memicu konfirmasi.\n   • Item penuh diklaim orang lain tetap bisa ditap → sheet\n     \"bagi berdua / batal\". Bagian dihitung price / jumlah claimer,\n     realtime, dan tampil di footer yang selalu terlihat.\n   • Counter porsi (\"1 dari 3 porsi\"), badge \"Belum ada\" untuk item\n     kosong, avatar claimer nempel di tiap baris = presence realtime.\n     Baris presence atas = siapa yang lagi buka bareng.\n   • Finalisasi (state 4): layar berubah jadi ringkasan \"bayar\n     sekian\" + jalan \"ada yang salah? kabari Bagus\".\n   • TOKEN yang perlu DITAMBAH ke tokens.css:\n       --scrim (dim sheet)  — light: rgba(16,22,30,.32),\n                              dark:  rgba(0,0,0,.55).\n     Sisanya (member colors, brand-tint, pos/neg, elev, radius,\n     motion, spacing) semuanya dari token yang ada.\n   ============================================================ */\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
