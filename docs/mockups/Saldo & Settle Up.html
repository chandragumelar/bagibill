document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 padding:0;}\nhtml,body{height:100%;}\nbody{\n  font-family:var(--bb-font);\n  color:var(--text);\n  background:var(--n-4);\n  -webkit-font-smoothing:antialiased;\n  display:flex; align-items:flex-start; justify-content:center;\n  gap:var(--sp-6); padding:var(--sp-6);\n  min-height:100vh;\n}\n.s-num{ font-variant-numeric:tabular-nums; font-feature-settings:\"tnum\" 1,\"lnum\" 1; }\n\n/* ---- Device shell ---- */\n.s-device{\n  position:relative; width:360px; height:800px;\n  background:var(--surface-sunken);\n  border-radius:34px; overflow:hidden;\n  box-shadow:var(--elev-3);\n  display:flex; flex-direction:column;\n}\n.s-statusbar{\n  flex:0 0 auto; height:44px; padding:0 var(--sp-5) 0 var(--sp-6);\n  display:flex; align-items:center; justify-content:space-between;\n  font-size:var(--fs-footnote); font-weight:var(--fw-semibold);\n  color:var(--text); background:var(--surface);\n}\n.s-sb-right{ display:flex; align-items:center; gap:5px; opacity:.85; }\n.s-sb-glyph{ width:17px; height:11px; }\n.s-sb-glyph rect{ fill:currentColor; }\n\n/* ---- Nav bar ---- */\n.s-nav{\n  flex:0 0 auto; display:flex; align-items:center; gap:var(--sp-2);\n  padding:var(--sp-2) var(--sp-3) var(--sp-3);\n  background:var(--surface);\n}\n.s-nav-back{\n  appearance:none; border:none; background:transparent; cursor:pointer;\n  color:var(--brand); display:flex; align-items:center; gap:2px;\n  font-family:inherit; font-size:var(--fs-body); padding:var(--sp-2);\n}\n.s-nav-back svg{ width:16px; height:16px; }\n.s-nav-title{ font-size:var(--fs-headline); font-weight:var(--fw-semibold); }\n.s-nav-title span{ display:block; font-size:var(--fs-caption2); font-weight:var(--fw-medium); color:var(--text-muted); margin-top:1px; }\n.s-nav-spacer{ flex:1 1 auto; }\n.s-nav-cur{\n  font-size:var(--fs-caption2); font-weight:var(--fw-semibold); color:var(--text-secondary);\n  background:var(--n-2); border-radius:var(--r-pill); padding:3px 9px;\n  display:flex; align-items:center; gap:5px;\n}\n.s-nav-cur svg{ width:11px; height:11px; }\n\n/* ---- Scroll region ---- */\n.s-scroll{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; position:relative; }\n.s-scroll::-webkit-scrollbar{ width:0; }\n\n/* ============================================================\n   HERO — posisi kamu sendiri, paling menonjol\n   ============================================================ */\n.s-hero{\n  padding:var(--sp-6) var(--sp-5) var(--sp-5);\n  background:var(--surface);\n  border-bottom:1px solid var(--border);\n  text-align:center;\n}\n.s-hero-eyebrow{\n  display:inline-flex; align-items:center; gap:6px;\n  font-size:var(--fs-caption); font-weight:var(--fw-semibold);\n  padding:4px 11px 4px 8px; border-radius:var(--r-pill);\n  color:var(--pos-text); background:var(--pos-tint);\n}\n.s-hero.is-neg .s-hero-eyebrow{ color:var(--neg-text); background:var(--neg-tint); }\n.s-hero-eyebrow svg{ width:14px; height:14px; }\n.s-hero-amount{\n  font-size:clamp(28px, 12vw, var(--num-lg)); font-weight:var(--fw-bold);\n  letter-spacing:var(--num-tracking); line-height:1.05; margin-top:var(--sp-3);\n  color:var(--pos-text); white-space:nowrap;\n}\n@container(max-width:0px){} /* noop */\n.s-hero-amount.is-long{ font-size:clamp(24px, 9.2vw, 32px); }\n.s-hero.is-neg .s-hero-amount{ color:var(--neg-text); }\n.s-hero-amount .s-rp{ font-size:var(--fs-title2); font-weight:var(--fw-semibold); opacity:.7; margin-right:3px; }\n.s-hero-sub{ font-size:var(--fs-footnote); color:var(--text-secondary); margin-top:var(--sp-3); line-height:var(--line-body); }\n.s-hero-sub b{ color:var(--text); font-weight:var(--fw-semibold); }\n.s-hero-cta{ display:flex; gap:var(--sp-2); margin-top:var(--sp-4); }\n\n/* ---- Segmented: mode ringkas / langsung ---- */\n.s-modewrap{ padding:var(--sp-4) var(--sp-5) var(--sp-1); background:var(--surface); }\n.s-seg{\n  display:flex; background:var(--n-2); border-radius:var(--r-btn); padding:3px; gap:3px;\n  position:relative;\n}\n.s-seg-btn{\n  flex:1; appearance:none; border:none; cursor:pointer; font-family:inherit;\n  font-size:var(--fs-footnote); font-weight:var(--fw-semibold); color:var(--text-secondary);\n  background:transparent; border-radius:8px; padding:7px 6px;\n  display:flex; align-items:center; justify-content:center; gap:6px;\n  transition:color var(--dur-tap) var(--ease-standard);\n}\n.s-seg-btn svg{ width:15px; height:15px; }\n.s-seg-btn.is-active{ background:var(--surface); color:var(--text); box-shadow:var(--elev-1); }\n.s-seg-hint{\n  display:flex; gap:var(--sp-2); align-items:flex-start;\n  margin-top:var(--sp-3); font-size:var(--fs-caption); color:var(--text-secondary);\n  line-height:var(--line-body);\n}\n.s-seg-hint svg{ width:14px; height:14px; flex:0 0 auto; margin-top:1px; color:var(--text-muted); }\n.s-seg-hint b{ color:var(--text); font-weight:var(--fw-semibold); }\n.s-seg-count{\n  color:var(--route-text); font-weight:var(--fw-semibold);\n  background:var(--route-tint); border-radius:var(--r-pill); padding:1px 7px; white-space:nowrap;\n}\n\n/* ---- Section label ---- */\n.s-sectlabel{\n  padding:var(--sp-5) var(--sp-5) var(--sp-2);\n  font-size:var(--fs-caption); font-weight:var(--fw-semibold); color:var(--text-muted);\n  text-transform:uppercase; letter-spacing:.05em;\n  display:flex; align-items:center; justify-content:space-between; gap:var(--sp-2);\n}\n.s-sectlabel .s-sect-side{ text-transform:none; letter-spacing:0; font-weight:var(--fw-medium); color:var(--n-5); }\n\n/* ---- Avatar ---- */\n.s-avatar{\n  --c:var(--n-5);\n  width:34px; height:34px; border-radius:var(--r-pill);\n  background:var(--c); color:#fff;\n  display:flex; align-items:center; justify-content:center;\n  font-size:var(--fs-footnote); font-weight:var(--fw-bold);\n  flex:0 0 auto; line-height:1; letter-spacing:.01em;\n}\n.s-avatar--sm{ width:26px; height:26px; font-size:var(--fs-caption2); }\n.s-avatar--lg{ width:40px; height:40px; font-size:var(--fs-subhead); }\n.s-avatar--me{ box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--brand); }\n\n/* ============================================================\n   BARIS SALDO — satu pola, diulang\n   ============================================================ */\n.s-list{ padding:0 var(--sp-4); display:flex; flex-direction:column; gap:var(--sp-2); }\n.s-bal{\n  width:100%; text-align:left; font-family:inherit; color:inherit; cursor:pointer;\n  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card);\n  padding:var(--sp-3) var(--sp-4);\n  display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:var(--sp-3);\n  transition:border-color var(--dur-tap), transform var(--dur-tap);\n}\n.s-bal:active{ transform:scale(.99); }\n.s-bal:hover{ border-color:var(--n-4); }\n.s-bal.is-me{ border-color:var(--brand); background:color-mix(in srgb,var(--brand) 5%,var(--surface)); }\n.s-bal-id{ min-width:0; }\n.s-bal-name{ font-size:var(--fs-subhead); font-weight:var(--fw-semibold); color:var(--text); display:flex; align-items:center; gap:6px; }\n.s-you{ font-size:var(--fs-caption2); font-weight:var(--fw-bold); color:var(--brand); background:var(--brand-tint); border-radius:var(--r-pill); padding:1px 7px; text-transform:uppercase; letter-spacing:.03em; }\n.s-bal-note{ font-size:var(--fs-caption); color:var(--text-muted); margin-top:2px; display:flex; align-items:center; gap:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }\n.s-bal-note svg{ width:11px; height:11px; flex:0 0 auto; }\n.s-bal-amt{ text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:3px; }\n.s-num-amt{ font-size:var(--fs-subhead); font-weight:var(--fw-bold); white-space:nowrap; }\n.s-bal.is-pos .s-num-amt{ color:var(--pos-text); }\n.s-bal.is-neg .s-num-amt{ color:var(--neg-text); }\n.s-bal.is-zero .s-num-amt{ color:var(--text-muted); }\n\n/* Tag arah — TIDAK andalkan warna saja: ada glyph +/- , panah, label */\n.s-tag{\n  display:inline-flex; align-items:center; gap:4px;\n  font-size:var(--fs-caption2); font-weight:var(--fw-bold);\n  padding:2px 7px 2px 5px; border-radius:var(--r-pill); letter-spacing:.01em;\n}\n.s-tag svg{ width:11px; height:11px; }\n.s-tag--pos{ color:var(--pos-text); background:var(--pos-tint); }\n.s-tag--neg{ color:var(--neg-text); background:var(--neg-tint); }\n.s-tag--zero{ color:var(--text-muted); background:var(--n-2); }\n\n/* ============================================================\n   BARIS TRANSFER — satu pola, diulang. Aliran from → to.\n   ============================================================ */\n.s-xfers{ padding:0 var(--sp-4); display:flex; flex-direction:column; gap:var(--sp-2); }\n.s-xfer{\n  width:100%; text-align:left; font-family:inherit; color:inherit; cursor:pointer;\n  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card);\n  padding:var(--sp-3) var(--sp-4) var(--sp-3);\n  display:flex; flex-direction:column; gap:var(--sp-3);\n  transition:border-color var(--dur-tap), transform var(--dur-tap);\n}\n.s-xfer:active{ transform:scale(.995); }\n.s-xfer:hover{ border-color:var(--n-4); }\n.s-xfer.is-mine{ border-color:var(--brand); }\n.s-xfer.is-done{ opacity:.62; }\n\n/* aliran: avatar — panah — avatar */\n.s-flow{ display:flex; align-items:center; gap:var(--sp-2); }\n.s-flow-node{ display:flex; align-items:center; gap:7px; min-width:0; }\n.s-flow-name{ font-size:var(--fs-footnote); font-weight:var(--fw-semibold); color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }\n.s-flow-arrow{\n  flex:1 1 auto; display:flex; align-items:center; justify-content:center;\n  position:relative; min-width:34px; color:var(--n-5);\n}\n.s-flow-arrow::before{ content:\"\"; position:absolute; left:0; right:8px; top:50%; height:2px; background:currentColor; border-radius:2px; opacity:.5; }\n.s-flow-arrow svg{ width:14px; height:14px; position:relative; }\n.s-xfer.is-mine .s-flow-arrow{ color:var(--brand); }\n/* aliran ke kamu = kamu nerima; dari kamu = kamu bayar */\n.s-flow-node.is-me .s-flow-name{ color:var(--brand); }\n\n.s-xfer-body{ display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3); }\n.s-xfer-amt{ font-size:var(--fs-title3); font-weight:var(--fw-bold); white-space:nowrap; }\n.s-xfer-amt .s-rp{ font-size:var(--fs-footnote); font-weight:var(--fw-semibold); color:var(--text-secondary); margin-right:2px; }\n.s-xfer-act{ display:flex; align-items:center; gap:6px; }\n.s-mini{\n  appearance:none; border:1px solid var(--btn2-border); background:var(--btn2-bg); color:var(--btn2-fg);\n  font-family:inherit; font-size:var(--fs-caption); font-weight:var(--fw-semibold);\n  border-radius:var(--r-pill); padding:6px 11px; cursor:pointer; white-space:nowrap;\n  transition:background var(--dur-tap), border-color var(--dur-tap);\n}\n.s-mini:hover{ background:var(--btn2-bg-hover); }\n.s-mini--primary{ background:var(--brand); color:var(--on-brand); border-color:var(--brand); }\n.s-mini--primary:hover{ background:var(--btn-bg-hover); }\n.s-mini svg{ width:12px; height:12px; vertical-align:-2px; margin-right:3px; }\n\n/* chip \"diringkas / lewat\" */\n.s-routed{\n  display:inline-flex; align-items:center; gap:5px; align-self:flex-start;\n  font-size:var(--fs-caption2); font-weight:var(--fw-semibold);\n  color:var(--route-text); background:var(--route-tint);\n  border-radius:var(--r-pill); padding:3px 9px 3px 7px;\n}\n.s-routed svg{ width:12px; height:12px; }\n\n/* progress bayar sebagian */\n.s-partial{ }\n.s-partial-track{ height:5px; border-radius:var(--r-pill); background:var(--n-3); overflow:hidden; }\n.s-partial-fill{ height:100%; background:var(--pos); border-radius:var(--r-pill); }\n.s-partial-txt{ display:flex; justify-content:space-between; font-size:var(--fs-caption2); color:var(--text-secondary); margin-top:5px; }\n.s-partial-txt b{ color:var(--pos-text); font-weight:var(--fw-semibold); }\n\n/* ---- Riwayat pelunasan ---- */\n.s-history{ padding:0 var(--sp-4) var(--sp-5); }\n.s-hist-toggle{\n  width:100%; appearance:none; border:none; background:transparent; cursor:pointer; font-family:inherit;\n  display:flex; align-items:center; gap:var(--sp-2); color:var(--text-secondary);\n  padding:var(--sp-3) var(--sp-2); font-size:var(--fs-footnote); font-weight:var(--fw-semibold);\n}\n.s-hist-toggle svg{ width:14px; height:14px; transition:transform var(--dur-base); }\n.s-hist-toggle.is-open svg{ transform:rotate(90deg); }\n.s-hist-count{ margin-left:auto; font-size:var(--fs-caption); color:var(--text-muted); font-weight:var(--fw-medium); }\n.s-hist-list{ display:none; flex-direction:column; }\n.s-hist-list.is-open{ display:flex; }\n.s-hist-row{ display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3) var(--sp-2); border-top:1px solid var(--border); }\n.s-hist-check{ width:22px; height:22px; border-radius:50%; background:var(--pos-tint); color:var(--pos-text); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }\n.s-hist-check svg{ width:12px; height:12px; }\n.s-hist-txt{ flex:1 1 auto; min-width:0; font-size:var(--fs-footnote); }\n.s-hist-txt span{ display:block; font-size:var(--fs-caption); color:var(--text-muted); margin-top:1px; }\n.s-hist-amt{ font-size:var(--fs-footnote); font-weight:var(--fw-semibold); color:var(--text-secondary); white-space:nowrap; }\n\n/* ============================================================\n   STATE: LUNAS (pencapaian, bukan layar kosong)\n   ============================================================ */\n.s-done-state{ position:absolute; inset:0; z-index:15; background:var(--surface-sunken); display:flex; flex-direction:column; }\n.s-done-state[hidden]{ display:none; }\n.s-done-hero{\n  flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center;\n  padding:var(--sp-6); text-align:center; position:relative; overflow:hidden;\n}\n.s-seal{\n  width:92px; height:92px; border-radius:50%; background:var(--pos-tint); color:var(--pos-text);\n  display:flex; align-items:center; justify-content:center; position:relative; z-index:2;\n  animation:s-pop var(--dur-sheet) var(--ease-emphasized);\n}\n.s-seal svg{ width:46px; height:46px; }\n.s-seal::after{ content:\"\"; position:absolute; inset:-10px; border-radius:50%; border:2px solid var(--pos); opacity:.35; animation:s-ring 1.8s var(--ease-standard) infinite; }\n@keyframes s-ring{ 0%{ transform:scale(.9); opacity:.35; } 70%{ transform:scale(1.35); opacity:0; } 100%{ opacity:0; } }\n@keyframes s-pop{ 0%{ transform:scale(.6); opacity:0; } 60%{ transform:scale(1.08); } 100%{ transform:scale(1); opacity:1; } }\n.s-done-title{ font-size:var(--fs-title1); font-weight:var(--fw-bold); letter-spacing:-.01em; margin-top:var(--sp-5); }\n.s-done-sub{ font-size:var(--fs-footnote); color:var(--text-secondary); margin-top:var(--sp-3); line-height:var(--line-relaxed); max-width:250px; }\n.s-done-stat{ display:flex; gap:var(--sp-6); margin-top:var(--sp-6); }\n.s-done-stat > div{ text-align:center; }\n.s-done-statnum{ font-size:var(--fs-title2); font-weight:var(--fw-bold); }\n.s-done-statlbl{ font-size:var(--fs-caption); color:var(--text-muted); margin-top:2px; }\n.s-confetti{ position:absolute; top:-10px; width:8px; height:8px; border-radius:2px; opacity:.9; animation:s-fall linear infinite; }\n@keyframes s-fall{ 0%{ transform:translateY(-20px) rotate(0); opacity:0; } 12%{ opacity:.95; } 100%{ transform:translateY(560px) rotate(420deg); opacity:0; } }\n.s-done-foot{ flex:0 0 auto; padding:var(--sp-4) var(--sp-5) var(--sp-6); background:var(--surface); border-top:1px solid var(--border); display:flex; flex-direction:column; gap:var(--sp-2); }\n\n/* ============================================================\n   STATE: KOSONG (belum ada transaksi)\n   ============================================================ */\n.s-empty-state{ position:absolute; inset:0; z-index:14; background:var(--surface-sunken); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:var(--sp-8) var(--sp-6); text-align:cen s-sectlabel\">Transfer yang disarankan<span class=\"s-sect-side\" id=\"xferSide\"><\u002Fspan><\u002Fdiv>\n    <div class=\"s-xfers\" id=\"xferList\"><\u002Fdiv>\n\n    <!-- RIWAYAT -->\n    <div class=\"s-history\">\n      <button class=\"s-hist-toggle\" id=\"histToggle\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n        Riwayat pelunasan\n        <span class=\"s-hist-count\" id=\"histCount\"><\u002Fspan>\n      <\u002Fbutton>\n      <div class=\"s-hist-list\" id=\"histList\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- STATE: LUNAS -->\n  <div class=\"s-done-state\" id=\"doneState\" hidden=\"\">\n    <div class=\"s-done-hero\" id=\"doneHero\">\n      <div class=\"s-seal\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 13l4 4L19 7\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"s-done-title\">Semua sudah beres<\u002Fdiv>\n      <div class=\"s-done-sub\">Ga ada yang ngutang siapa-siapa lagi di Trip Bali &amp; Tokyo. Semua saldo nol.<\u002Fdiv>\n      <div class=\"s-done-stat\">\n        <div><div class=\"s-done-statnum s-num\">19<\u002Fdiv><div class=\"s-done-statlbl\">transaksi<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"s-done-statnum s-num\">7<\u002Fdiv><div class=\"s-done-statlbl\">transfer<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"s-done-statnum s-num\">5<\u002Fdiv><div class=\"s-done-statlbl\">orang<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"s-done-foot\">\n      <button class=\"s-btn s-btn--secondary\">Lihat riwayat pelunasan<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- STATE: KOSONG -->\n  <div class=\"s-empty-state\" id=\"emptyState\" hidden=\"\">\n    <div class=\"s-empty-art\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7h18v12H3z\"><\u002Fpath><path d=\"M3 11h18\"><\u002Fpath><path d=\"M7 3v4M17 3v4\"><\u002Fpath><\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"s-empty-title\">Belum ada pengeluaran<\u002Fdiv>\n    <div class=\"s-empty-sub\">Begitu ada yang bayarin sesuatu, saldo dan siapa transfer ke siapa muncul di sini otomatis.<\u002Fdiv>\n    <button class=\"s-btn s-btn--primary s-empty-cta\">Catat pengeluaran pertama<\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- SHEET generik -->\n  <div class=\"s-scrim\" id=\"scrim\">\n    <div class=\"s-sheet\" id=\"sheet\"><div class=\"s-grab\"><\u002Fdiv><div id=\"sheetBody\"><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- DEV SWITCHER -->\n<aside class=\"s-dev\">\n  <h4>Keadaan layar<\u002Fh4>\n  <div class=\"s-dev-group\" id=\"devStates\">\n    <button class=\"s-dev-btn is-active\" data-state=\"ringkas\">1 · Mode ringkas<\u002Fbutton>\n    <button class=\"s-dev-btn\" data-state=\"langsung\">2 · Mode langsung<\u002Fbutton>\n    <button class=\"s-dev-btn\" data-state=\"trace\">3 · Telusuri satu angka<\u002Fbutton>\n    <button class=\"s-dev-btn\" data-state=\"note\">Catatan bayar + salin<\u002Fbutton>\n    <button class=\"s-dev-btn\" data-state=\"tagih\">Tagih (pesan siap kirim)<\u002Fbutton>\n    <button class=\"s-dev-btn\" data-state=\"done\">4 · Semua lunas<\u002Fbutton>\n    <button class=\"s-dev-btn\" data-state=\"empty\">5 · Belum ada transaksi<\u002Fbutton>\n  <\u002Fdiv>\n  <h4>Tema<\u002Fh4>\n  <div class=\"s-dev-theme\">\n    <button class=\"s-dev-btn is-active\" data-theme-btn=\"light\">Terang<\u002Fbutton>\n    <button class=\"s-dev-btn\" data-theme-btn=\"dark\">Gelap<\u002Fbutton>\n  <\u002Fdiv>\n  <p class=\"s-dev-note\">Layar penutup trip. Ringkas = transfer paling sedikit. Langsung = utang per pasangan. Tap transfer buat telusuri asal angkanya; tap baris saldo buat catatan bayar &amp; tagih.<\u002Fp>\n<\u002Faside>\n\n<script>\n/* ============================================================\n   DATA — Trip Bali & Tokyo, 5 orang, multi mata uang (saldo IDR).\n   net > 0 = dapet (piutang) · net < 0 = bayar (utang).\n   Inisial dari kata: Dimas Prasetyo→DP, Dina Kartika→DK.\n   Tabrakan huruf awal (D & R) dibedakan warna, nama selalu ikut.\n   ============================================================ */\nconst MEMBERS = {\n  me:    { name:\"Dimas Prasetyo\", first:\"Dimas\", initials:\"DP\", color:\"var(--m-7)\",  net: 156700000, pay:\"BCA 1234567890 a.n. Dimas Prasetyo\" },\n  dina:  { name:\"Dina Kartika\",   first:\"Dina\",  initials:\"DK\", color:\"var(--m-11)\", net:   8256789, pay:\"Bank Jago 5566-7788-9900 a.n. Dina Kartika\" },\n  reza:  { name:\"Reza Aditya\",    first:\"Reza\",  initials:\"RA\", color:\"var(--m-2)\",  net: -11500000, pay:\"GoPay 0812-3456-7890\" },\n  rina:  { name:\"Rina Wijaya\",    first:\"Rina\",  initials:\"RW\", color:\"var(--m-5)\",  net: -30000000, pay:\"OVO 0857-1122-3344\" },\n  bagus: { name:\"Bagus Santoso\",  first:\"Bagus\", initials:\"BS\", color:\"var(--m-4)\",  net:-123456789, pay:\"BCA 8899001122 a.n. Bagus Santoso\" },\n};\nconst ME = \"me\";\nconst ORDER = [\"me\",\"dina\",\"reza\",\"rina\",\"bagus\"];\n\n/* Mode RINGKAS — transfer paling sedikit (bisa lewat orang lain) */\nconst RINGKAS = [\n  { from:\"bagus\", to:\"me\",   amt:123456789 },\n  { from:\"rina\",  to:\"me\",   amt:30000000, partial:20000000 },\n  { from:\"reza\",  to:\"me\",   amt:3243211,  routed:true },\n  { from:\"reza\",  to:\"dina\", amt:8256789,  routed:true },\n];\n/* Mode LANGSUNG — utang per pasangan, tanpa digabung */\nconst LANGSUNG = [\n  { from:\"bagus\", to:\"me\",   amt:95000000 },\n  { from:\"bagus\", to:\"dina\", amt:8256789 },\n  { from:\"bagus\", to:\"reza\", amt:20200000 },\n  { from:\"rina\",  to:\"me\",   amt:26000000 },\n  { from:\"rina\",  to:\"reza\", amt:4000000 },\n  { from:\"reza\",  to:\"me\",   amt:35700000 },\n];\n\n/* Riwayat pelunasan — terpisah dari daftar pengeluaran */\nconst HISTORY = [\n  { from:\"rina\", to:\"me\",   amt:5000000, when:\"Kemarin 21:10\", note:\"lunas\" },\n  { from:\"reza\", to:\"dina\", amt:1500000, when:\"6 Agu\",         note:\"lunas\" },\n  { from:\"bagus\",to:\"rina\", amt:2000000, when:\"4 Agu\",         note:\"sebagian, sisa masuk saldo\" },\n];\n\n/* Sumber transaksi untuk telusuri (per transfer). last row = mata uang lain. */\nconst TRACE = {\n  \"bagus>me\": {\n    title:\"Bagian Bagus atas yang kamu talangin\",\n    sources:[\n      { name:\"Sewa Villa Seminyak · 5 malam\", meta:\"Kamu bayar · bagi 5\", amt:24500000, href:\"BagiBill - Detail Grup Transaksi (standalone).html\" },\n      { name:\"Tiket pesawat CGK–DPS–NRT\",     meta:\"Kamu bayar · bagi 5\", amt:61200000, href:\"BagiBill - Detail Grup Transaksi (standalone).html\" },\n      { name:\"Sewa mobil + sopir · 5 hari\",   meta:\"Kamu bayar · bagi 5\", amt:11256789, href:\"BagiBill - Detail Grup Transaksi (standalone).html\" },\n      { name:\"Aktivitas & tiket masuk\",       meta:\"Kamu bayar · bagi 5\", amt:18000000, href:\"BagiBill - Detail Grup Transaksi (standalone).html\" },\n      { name:\"Makan malam Tokyo\", meta:\"Kamu bayar · bagi 5\", amt:8500000, cur:\"¥60.000\", href:\"BagiBill - Detail Grup Transaksi (standalone).html\" },\n    ],\n  },\n  \"reza>dina\": {\n    routed:{ via:\"me\", text:\"Reza sebenarnya ga ngutang ke Dina. Tapi <b>Dina<\u002Fb> harusnya nerima segini dari <b>Bagus<\u002Fb>. Karena Bagus lebih gampang bayar penuh ke kamu, Reza yang nutup ke Dina. Total yang diterima tiap orang tetap sama.\" },\n    title:\"Piutang Dina yang dialihkan\",\n    sources:[\n      { name:\"Sewa Villa Seminyak · 5 malam\", meta:\"Dina bayar · bagian Bagus\", amt:4900000, href:\"BagiBill - Detail Grup Transaksi (standalone).html\" },\n      { name:\"Belanja oleh-oleh & cemilan\",   meta:\"Dina bayar · bagi 5\",       amt:3356789, href:\"BagiBill - Detail Grup Transaksi (standalone).html\" },\n    ],\n  },\n};\nconst TRACE_FALLBACK = {\n  title:\"Dari transaksi mana\",\n  sources:[\n    { name:\"Sewa Villa Seminyak · 5 malam\", meta:\"bagi 5\", amt:19600000, href:\"BagiBill - Detail Grup Transaksi (standalone).html\" },\n    { name:\"Aktivitas & tiket masuk\",       meta:\"bagi 5\", amt:7400000,  href:\"BagiBill - Detail Grup Transaksi (standalone).html\" },\n    { name:\"Makan malam Tokyo\",             meta:\"bagi 5\", amt:3000000, cur:\"¥21.000\", href:\"BagiBill - Detail Grup Transaksi (standalone).html\" },\n  ],\n};\n\n/* ---- util ---- */\nconst rp = n => \"Rp \" + n.toLocaleString(\"id-ID\");\nconst rpn = n => n.toLocaleString(\"id-ID\");\nconst $ = s => document.querySelector(s);\nconst av = (id, cls=\"\") => { const m=MEMBERS[id]; return `<span class=\"s-avatar ${cls} ${id===ME?'s-avatar--me':''}\" style=\"--c:${m.color}\">${m.initials}<\u002Fspan>`; };\nconst nm = id => MEMBERS[id].first + (id===ME ? \"\" : \"\");\n\nlet MODE = \"ringkas\";\n\n/* ============================================================\n   HERO\n   ============================================================ */\nfunction renderHero(){\n  const me = MEMBERS[ME], net = me.net, hero = $(\"#hero\");\n  const pos = net > 0;\n  hero.classList.toggle(\"is-neg\", !pos);\n  const inbound = (MODE===\"ringkas\"?RINGKAS:LANGSUNG).filter(t=>t.to===ME).length;\n  const outbound = (MODE===\"ringkas\"?RINGKAS:LANGSUNG).filter(t=>t.from===ME).length;\n  $(\"#heroEyebrow\").innerHTML = pos\n    ? `${arrow(\"down\")} Kamu dapet`\n    : `${arrow(\"up\")} Kamu bayar`;\n  const digits = rpn(Math.abs(net));\n  const el = $(\"#heroAmount\");\n  el.innerHTML = `<span class=\"s-rp\">Rp<\u002Fspan>${digits}`;\n  el.classList.toggle(\"is-long\", Math.abs(net) >= 100000000);\n  $(\"#heroSub\").innerHTML = pos\n    ? `<b>${inbound} orang<\u002Fb> mau transfer ke kamu buat nutup trip ini`\n    : `Kamu perlu transfer ke <b>${outbound} orang<\u002Fb> buat nutup trip ini`;\n  $(\"#heroPrimary\").innerHTML = pos\n    ? `${icon(\"bell\")} Tagih semua`\n    : `${icon(\"send\")} Bayar sekarang`;\n}\nfunction arrow(dir){\n  const d = dir===\"down\" ? \"M12 5v14M6 13l6 6 6-6\" : \"M12 19V5M6 11l6-6 6 6\";\n  return `<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"${d}\"/><\u002Fsvg>`;\n}\nfunction icon(name){\n  const p = {\n    bell:'<path d=\"M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.7 21a2 2 0 0 1-3.4 0\"/>',\n    send:'<path d=\"M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z\"/>',\n    copy:'<rect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\"/><path d=\"M5 15V5a2 2 0 0 1 2-2h10\"/>',\n    check:'<path d=\"M5 13l4 4L19 7\"/>',\n    receipt:'<path d=\"M5 3v18l2-1.5L9 21l2-1.5L13 21l2-1.5L17 21l2-1.5V3l-2 1.5L15 3l-2 1.5L11 3 9 4.5 7 3 5 4.5z\"/><path d=\"M9 8h6M9 12h6\"/>',\n    route:'<circle cx=\"6\" cy=\"6\" r=\"2\"/><circle cx=\"18\" cy=\"18\" r=\"2\"/><path d=\"M8 6h6a4 4 0 0 1 4 4v6\"/>',\n  }[name] || '';\n  return `<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${p}<\u002Fsvg>`;\n}\n\n/* ============================================================\n   SALDO TIAP ORANG\n   ============================================================ */\nfunction renderBalances(){\n  const wrap = $(\"#balList\"); wrap.innerHTML = \"\";\n  ORDER.forEach(id => {\n    const m = MEMBERS[id], net = m.net;\n    const pos = net>0, neg = net<0;\n    const stateCls = pos ? \"is-pos\" : neg ? \"is-neg\" : \"is-zero\";\n    const tag = pos\n      ? `<span class=\"s-tag s-tag--pos\">${arrow(\"down\")} dapet<\u002Fspan>`\n      : neg ? `<span class=\"s-tag s-tag--neg\">${arrow(\"up\")} bayar<\u002Fspan>`\n      : `<span class=\"s-tag s-tag--zero\">lunas<\u002Fspan>`;\n    const sign = pos ? \"+\" : neg ? \"−\" : \"\";\n    const b = document.createElement(\"button\");\n    b.className = `s-bal ${stateCls} ${id===ME?'is-me':''}`;\n    b.dataset.id = id;\n    b.innerHTML =\n      `${av(id,'s-avatar--lg')}\n       <span class=\"s-bal-id\">\n         <span class=\"s-bal-name\">${m.name}${id===ME?'<span class=\"s-you\">kamu<\u002Fspan>':''}<\u002Fspan>\n         <span class=\"s-bal-note\">${icon('copy')}${shortPay(m.pay)}<\u002Fspan>\n       <\u002Fspan>\n       <span class=\"s-bal-amt\">\n         ${tag}\n         <span class=\"s-num-amt s-num\">${sign}${rp(Math.abs(net))}<\u002Fspan>\n       <\u002Fspan>`;\n    b.addEventListener(\"click\", () => openMemberSheet(id));\n    wrap.appendChild(b);\n  });\n}\nfunction shortPay(s){ return s.length > 26 ? s.slice(0,24)+\"…\" : s; }\n\n/* ============================================================\n   TRANSFER\n   ============================================================ */\nfunction renderXfers(){\n  const list = MODE===\"ringkas\" ? RINGKAS : LANGSUNG;\n  const wrap = $(\"#xferList\"); wrap.innerHTML = \"\";\n  list.forEach((t, i) => {\n    const mine = t.from===ME || t.to===ME;\n    const done = t.partial >= t.amt;\n    const el = document.createElement(\"button\");\n    el.className = `s-xfer ${mine?'is-mine':''} ${done?'is-done':''}`;\n    el.dataset.i = i;\n\n    const routed = t.routed\n      ? `<span class=\"s-routed\">${icon('route')} Lewat perantara — ketuk buat lihat<\u002Fspan>` : \"\";\n\n    let bottom;\n    if(t.partial && !done){\n      const pct = Math.round(t.partial/t.amt*100);\n      bottom =\n        `<div class=\"s-partial\">\n           <div class=\"s-partial-track\"><div class=\"s-partial-fill\" style=\"width:${pct}%\"><\u002Fdiv><\u002Fdiv>\n           <div class=\"s-partial-txt\"><span>Udah <b>${rp(t.partial)}<\u002Fb><\u002Fspan><span>Sisa ${rp(t.amt - t.partial)}<\u002Fspan><\u002Fdiv>\n         <\u002Fdiv>`;\n    } else { bottom = \"\"; }\n\n    const action = t.to===ME\n      ? `<button class=\"s-mini\" data-act=\"lunas\">${icon('check')}Tandai lunas<\u002Fbutton>\n         <button class=\"s-mini s-mini--primary\" data-act=\"tagih\">Tagih<\u002Fbutton>`\n      : t.from===ME\n      ? `<button class=\"s-mini s-mini--primary\" data-act=\"bayar\">${icon('send')}Bayar<\u002Fbutton>`\n      : `<button class=\"s-mini\" data-act=\"lunas\">${icon('check')}Lunas<\u002Fbutton>`;\n\n    el.innerHTML =\n      `${routed}\n       <div class=\"s-flow\">\n         <span class=\"s-flow-node ${t.from===ME?'is-me':''}\">${av(t.from,'s-avatar--sm')}<span class=\"s-flow-name\">${nm(t.from)}${t.from===ME?' (kamu)':''}<\u002Fspan><\u002Fspan>\n         <span class=\"s-flow-arrow\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12h15M13 6l6 6-6 6\"/><\u002Fsvg><\u002Fspan>\n         <span class=\"s-flow-node ${t.to===ME?'is-me':''}\">${av(t.to,'s-avatar--sm')}<span class=\"s-flow-name\">${nm(t.to)}${t.to===ME?' (kamu)':''}<\u002Fspan><\u002Fspan>\n       <\u002Fdiv>\n       <div class=\"s-xfer-body\">\n         <span class=\"s-xfer-amt s-num\"><span class=\"s-rp\">Rp<\u002Fspan>${rpn(t.amt)}<\u002Fspan>\n         <span class=\"s-xfer-act\">${action}<\u002Fspan>\n       <\u002Fdiv>\n       ${bottom}`;\n\n    el.addEventListener(\"click\", (e) => {\n      const act = e.target.closest(\"[data-act]\");\n      if(act){ e.stopPropagation(); flashAct(act); return; }\n      openTrace(t);\n    });\n    wrap.appendChild(el);\n  });\n  $(\"#xferSide\").textContent = MODE===\"ringkas\"\n    ? `${list.length} transfer`\n    : `${list.length} pasangan`;\n}\nfunction flashAct(btn){\n  const label = btn.dataset.act;\n  if(label===\"tagih\"){ const i = btn.closest(\".s-xfer\").dataset.i; const t=(MODE===\"ringkas\"?RINGKAS:LANGSUNG)[i]; openTagih(t.from); return; }\n  btn.classList.add(\"is-done\"); btn.textContent = \"✓ Beres\";\n}\n\n/* segment hint */\nfunction renderHint(){\n  const h = $(\"#segHint\");\n  h.innerHTML = MODE===\"ringkas\"\n    ? `${icon('route')}<span><b>19 transaksi<\u002Fb> diringkas jadi <span class=\"s-seg-count s-num\">4 transfer<\u002Fspan>. Sistem cari jalur tersingkat — kadang kamu transfer ke orang yang bukan langsung ngutang.<\u002Fspan>`\n    : `${icon('route')}<span>Utang <b>per pasangan<\u002Fb>, apa adanya. <span class=\"s-seg-count s-num\">6 transfer<\u002Fspan> — lebih banyak, tapi tiap angka jelas dari siapa ke siapa.<\u002Fspan>`;\n}\n\n/* ============================================================\n   RIWAYAT\n   ============================================================ */\nfunction renderHistory(){\n  const wrap = $(\"#histList\"); wrap.innerHTML = \"\";\n  HISTORY.forEach(h => {\n    const row = document.createElement(\"div\");\n    row.className = \"s-hist-row\";\n    row.innerHTML =\n      `<span class=\"s-hist-check\">${icon('check')}<\u002Fspan>\n       <span class=\"s-hist-txt\">${nm(h.from)} → ${nm(h.to)}<span>${h.when} · ${h.note}<\u002Fspan><\u002Fspan>\n       <span class=\"s-hist-amt s-num\">${rp(h.amt)}<\u002Fspan>`;\n    wrap.appendChild(row);\n  });\n  $(\"#histCount\").textContent = HISTORY.length + \" pelunasan\";\n}\n$(\"#histToggle\").addEventListener(\"click\", () => {\n  $(\"#histToggle\").classList.toggle(\"is-open\");\n  $(\"#histList\").classList.toggle(\"is-open\");\n});\n\n/* ============================================================\n   SHEET generik\n   ============================================================ */\nfunction openSheet(html){ $(\"#sheetBody\").innerHTML = html; $(\"#scrim\").classList.add(\"is-open\"); }\nfunction closeSheet(){ $(\"#scrim\").classList.remove(\"is-open\"); }\n$(\"#scrim\").addEventListener(\"click\", e => { if(e.target.id===\"scrim\") closeSheet(); });\n\n/* ---- Telusuri ---- */\nfunction openTrace(t){\n  const key = `${t.from}>${t.to}`;\n  const data = TRACE[key] || TRACE_FALLBACK;\n  let why = \"\";\n  if(t.routed && data.routed){\n    why =\n      `<div class=\"s-why\">\n         <span class=\"s-why-ic\">${icon('route')}<\u002Fspan>\n         <div class=\"s-why-txt\">${data.routed.text}\n           <div class=\"s-route-map\">\n             <span class=\"s-route-node\">${av(\"bagus\",\"s-avatar--sm\")}${nm(\"bagus\")}<\u002Fspan>\n             <span class=\"s-route-arr\">${miniArr()}<\u002Fspan>\n             <span class=\"s-route-node\">${av(\"me\",\"s-avatar--sm\")}kamu<\u002Fspan>\n             <span class=\"s-route-arr\">${miniArr()}<\u002Fspan>\n             <span class=\"s-route-node\">${av(t.from,\"s-avatar--sm\")}${nm(t.from)}<\u002Fspan>\n             <span class=\"s-route-arr\">${miniArr()}<\u002Fspan>\n             <span class=\"s-route-node\">${av(t.to,\"s-avatar--sm\")}${nm(t.to)}<\u002Fspan>\n           <\u002Fdiv>\n         <\u002Fdiv>\n       <\u002Fdiv>`;\n  }\n  const sum = data.sources.reduce((a,s)=>a+s.amt,0);\n  const srcs = data.sources.map(s =>\n    `<a class=\"s-src\" href=\"${s.href}\">\n       <span class=\"s-src-ic\">${icon('receipt')}<\u002Fspan>\n       <span class=\"s-src-info\">\n         <span class=\"s-src-name\">${s.name}<\u002Fspan>\n         <span class=\"s-src-meta\">${s.meta}${s.cur?` · <span class=\"s-src-cur s-num\">${s.cur}<\u002Fspan>`:''}<\u002Fspan>\n       <\u002Fspan>\n       <span class=\"s-src-amt s-num\">${rp(s.amt)}${icon2chevron()}<\u002Fspan>\n     <\u002Fa>`).join(\"\");\n\n  openSheet(\n    `<div class=\"s-sheet-title\">Dari mana angka ini<\u002Fdiv>\n     <div class=\"s-sheet-sub\">Telusuri transfer ini sampai ke transaksi aslinya. Ketuk transaksi buat buka detailnya.<\u002Fdiv>\n     <div class=\"s-trace-head\">\n       <span class=\"s-trace-flow\">${av(t.from,'s-avatar--sm')}<span class=\"s-flow-arrow\" style=\"min-width:20px\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12h15M13 6l6 6-6 6\"/><\u002Fsvg><\u002Fspan>${av(t.to,'s-avatar--sm')}<\u002Fspan>\n       <span class=\"s-trace-amt s-num\">${rp(t.amt)}<\u002Fspan>\n     <\u002Fdiv>\n     ${why}\n     <div class=\"s-trace-lbl\">${data.title}<\u002Fdiv>\n     ${srcs}\n     <div class=\"s-trace-sum\"><span>${data.sources.length} transaksi<\u002Fspan><b class=\"s-num\">${rp(sum)}<\u002Fb><\u002Fdiv>`\n  );\n}\nfunction miniArr(){ return `<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\u002Fsvg>`; }\nfunction icon2chevron(){ return `<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 6l6 6-6 6\"/><\u002Fsvg>`; }\n\n/* ---- Catatan pembayaran + Tagih (member sheet) ---- */\nfunction openMemberSheet(id){\n  const m = MEMBERS[id];\n  const net = m.net;\n  const line = net>0\n    ? `Dapet <b class=\"s-num\">${rp(net)}<\u002Fb>`\n    : net<0 ? `Bayar <b class=\"s-num\">${rp(-net)}<\u002Fb>` : `Lunas`;\n  const tagihBtn = (id!==ME && net<0)\n    ? `<button class=\"s-btn s-btn--primary\" data-tagih=\"${id}\">${icon('bell')} Buat pesan tagihan<\u002Fbutton>` : \"\";\n  openSheet(\n    `<div class=\"s-sheet-title\">${m.name}${id===ME?' (kamu)':''}<\u002Fdiv>\n     <div class=\"s-sheet-sub\">${line} · di Trip Bali &amp; Tokyo<\u002Fdiv>\n     <div class=\"s-note-card\">\n       <div class=\"s-note-info\">\n         <div class=\"s-note-lbl\">Catatan pembayaran<\u002Fdiv>\n         <div class=\"s-note-val\" id=\"payVal\">${m.pay}<\u002Fdiv>\n       <\u002Fdiv>\n       <button class=\"s-copy\" id=\"copyPay\">${icon('copy')}Salin<\u002Fbutton>\n     <\u002Fdiv>\n     ${tagihBtn}`\n  );\n  $(\"#copyPay\").addEventListener(\"click\", () => copyText(m.pay, $(\"#copyPay\")));\n  const tb = document.querySelector(\"[data-tagih]\");\n  if(tb) tb.addEventListener(\"click\", () => openTagih(id));\n}\n\n/* ---- Pesan tagih siap kirim ---- */\nfunction openTagih(id){\n  const m = MEMBERS[id], me = MEMBERS[ME];\n  const amt = -m.net > 0 ? -m.net : m.net;\n  const t = (MODE===\"ringkas\"?RINGKAS:LANGSUNG).find(x=>x.from===id && x.to===ME);\n  const owe = t ? t.amt : Math.abs(m.net);\n  const msg =\n`Hai ${m.first}! Buat Trip Bali & Tokyo, saldomu ke aku Rp ${rpn(owe)}.\n\nTransfer ke: ${me.pay}\n\nMakasih ya 🙏 — dikirim lewat BagiBill`;\n  openSheet(\n    `<div class=\"s-sheet-title\">Tagih ${m.first}<\u002Fdiv>\n     <div class=\"s-sheet-sub\">Pesan udah siap. Cek dulu, lalu kirim ke chat.<\u002Fdiv>\n     <div class=\"s-msg\" id=\"msgVal\">${msg.replace(/<\u002Fg,\"&lt;\")}<\u002Fdiv>\n     <div class=\"s-sheet-actions\">\n       <button class=\"s-btn s-btn--primary\" id=\"sendMsg\">${icon('send')} Kirim ke WhatsApp<\u002Fbutton>\n       <button class=\"s-copy\" id=\"copyMsg\" style=\"width:100%;justify-content:center\">${icon('copy')} Salin pesan<\u002Fbutton>\n     <\u002Fdiv>`\n  );\n  $(\"#copyMsg\").addEventListener(\"click\", () => copyText(msg, $(\"#copyMsg\")));\n  $(\"#sendMsg\").addEventListener(\"click\", () => { $(\"#sendMsg\").innerHTML = `${icon('check')} Membuka chat…`; });\n}\n\nfunction copyText(text, btn){\n  const done = () => { btn.classList.add(\"is-done\"); btn.innerHTML = `${icon('check')} Tersalin`; setTimeout(()=>{ btn.classList.remove(\"is-done\"); btn.innerHTML = `${icon('copy')} Salin`; }, 1600); };\n  if(navigator.clipboard){ navigator.clipboard.writeText(text).then(done, done); } else { done(); }\n}\n\n/* ============================================================\n   STATE SWITCHER (dev)\n   ============================================================ */\nfunction setMode(m){\n  MODE = m;\n  document.querySelectorAll(\".s-seg-btn\").forEach(b => b.classList.toggle(\"is-active\", b.dataset.mode===m));\n  renderHero(); renderXfers(); renderHint();\n}\ndocument.querySelectorAll(\".s-seg-btn\").forEach(b => b.addEventListener(\"click\", () => { setMode(b.dataset.mode); syncDev(b.dataset.mode); }));\n\nfunction setState(s){\n  document.querySelectorAll(\"#devStates .s-dev-btn\").forEach(b => b.classList.toggle(\"is-active\", b.dataset.state===s));\n  $(\"#doneState\").hidden = true; $(\"#emptyState\").hidden = true; closeSheet();\n  if(s===\"ringkas\"){ setMode(\"ringkas\"); }\n  else if(s===\"langsung\"){ setMode(\"langsung\"); }\n  else if(s===\"trace\"){ setMode(\"ringkas\"); openTrace(RINGKAS[3]); /* Reza→Dina, contoh routing terkuat */ }\n  else if(s===\"note\"){ openMemberSheet(\"bagus\"); }\n  else if(s===\"tagih\"){ openTagih(\"bagus\"); }\n  else if(s===\"done\"){ $(\"#doneState\").hidden = false; spawnConfetti(); }\n  else if(s===\"empty\"){ $(\"#emptyState\").hidden = false; }\n}\nfunction syncDev(s){ document.querySelectorAll(\"#devStates .s-dev-btn\").forEach(b => b.classList.toggle(\"is-active\", b.dataset.state===s)); }\ndocument.querySelectorAll(\"#devStates .s-dev-btn\").forEach(b => b.addEventListener(\"click\", () => setState(b.dataset.state)));\ndocument.querySelectorAll(\"[data-theme-btn]\").forEach(b => b.addEventListener(\"click\", () => {\n  document.documentElement.setAttribute(\"data-theme\", b.dataset.themeBtn);\n  document.querySelectorAll(\"[data-theme-btn]\").forEach(x => x.classList.toggle(\"is-active\", x===b));\n}));\n\nfunction spawnConfetti(){\n  const host = $(\"#doneHero\");\n  host.querySelectorAll(\".s-confetti\").forEach(c=>c.remove());\n  const cols = [\"var(--m-2)\",\"var(--m-5)\",\"var(--m-7)\",\"var(--m-11)\",\"var(--pos)\"];\n  for(let i=0;i<14;i++){\n    const c = document.createElement(\"span\");\n    c.className = \"s-confetti\";\n    c.style.left = (6 + Math.random()*88) + \"%\";\n    c.style.background = cols[i%cols.length];\n    c.style.animationDuration = (2.4 + Math.random()*1.6) + \"s\";\n    c.style.animationDelay = (Math.random()*1.2) + \"s\";\n    host.appendChild(c);\n  }\n}\n\n/* ---- Init ---- */\nrenderHero(); renderBalances(); renderXfers(); renderHint(); renderHistory();\n\n/* ============================================================\n   CATATAN DESAIN (sekali, di bawah — untuk agent coding)\n   ------------------------------------------------------------\n   • Hierarki: posisi KAMU paling atas & paling besar (hero).\n     \"dapet / bayar\" jelas dari eyebrow + panah + warna + nominal.\n   • Piutang/utang TIDAK andalkan warna: tiap baris punya glyph\n     +/-, panah naik/turun, dan label kata (\"dapet\"/\"bayar\"/\"lunas\").\n     Aman buta warna & kebaca di bawah matahari (bobot tebal, tnum).\n   • Nama WAJIB di baris saldo & baris transfer — salah baca =\n     salah transfer. Inisial dari kata (Dimas Prasetyo→DP, Dina\n     Kartika→DK). Tabrakan huruf awal (D: Dimas/Dina, R: Rina/Reza)\n     dibedakan warna avatar, bukan dipanjangin inisialnya.\n   • Ringkas vs Langsung = segmented + kalimat hint yang beda +\n     angka \"N transfer\" yang ikut berubah, jadi bedanya kepahami\n     tanpa dibaca. Ringkas bisa munculin transfer ke orang yang\n     bukan langsung ngutang (mis. Reza→Dina) — ditandai chip\n     \"Lewat perantara\".\n   • Telusuri: ketuk transfer → sheet. Kalau routed, ada blok\n     \"kenapa lewat sini\" + mini peta rute (Bagus→kamu→Reza→Dina),\n     lalu daftar transaksi asal yang dijumlahkan. Tiap transaksi\n     nge-link ke layar Detail Grup (menelusuri ke sumber asli).\n   • Multi mata uang: transaksi ¥ ditampilkan apa adanya tapi\n     saldo tetap Rupiah (mata uang grup); baris sumber nunjukin\n     \"¥60.000\" di samping nominal Rupiah-nya.\n   • Tandai lunas + bayar sebagian: transfer Rina→kamu contoh\n     partial (progress + \"sisa\"). Riwayat pelunasan terpisah dari\n     daftar pengeluaran, bisa dibuka-tutup.\n   • Catatan bayar per orang (rekening/e-wallet, teks bebas) +\n     tombol Salin. Tagih menghasilkan pesan siap kirim ke chat.\n   • Lunas = pencapaian (seal + ring + confetti + statistik trip),\n     bukan layar kosong. Kosong = ajakan catat pengeluaran pertama.\n   • Angka 9 digit (Rp 123.456.789, Bagus→kamu) sengaja ada buat\n     nguji tata letak: hero pakai --num-xl 48px + word-break,\n     baris transfer nowrap, baris saldo kolom kanan nowrap + nama\n     boleh ellipsis. Ga ada yang pecah.\n\n   TOKEN yang perlu DITAMBAH ke tokens.css:\n     --scrim  (dim sheet)   light rgba(16,22,30,.32) / dark rgba(0,0,0,.55)\n     --num-xl (hero balance) 48px  — nominal 9 digit muat di 360px\n     --route / --route-text / --route-tint  (aksen \"diringkas/rute\n       perantara\", ungu) — light #7C3AED/#5B21B6/#F1EAFE,\n       dark #A78BFA/#C4B5FD/#221A38. Dipakai buat chip \"Lewat\n       perantara\", angka \"N transfer\", dan blok penjelasan routing.\n   Sisanya (member colors, brand, pos/neg, elev, radius, motion,\n   spacing) semua dari token yang ada.\n   ============================================================ */\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
