document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

smoothing:antialiased;\n  display:flex; flex-direction:column; align-items:center; gap:var(--sp-4);\n  padding:var(--sp-5) 0;\n  min-height:100vh;\n}\na{color:var(--brand);text-decoration:none}\na:hover{color:var(--brand-strong)}\n\n/* ---- Dev chrome (bukan bagian mockup) ---- */\n.j-dev{\n  display:flex; gap:var(--sp-2); align-items:center; flex-wrap:wrap; justify-content:center;\n  width:360px; padding:0 var(--sp-2);\n}\n.j-dev button{\n  font:var(--fw-medium) var(--fs-caption)/1 var(--bb-font);\n  padding:var(--sp-2) var(--sp-3); border-radius:var(--r-pill);\n  border:1px solid var(--border); background:var(--surface); color:var(--text-secondary);\n  cursor:pointer;\n}\n.j-dev button[aria-pressed=\"true\"]{ background:var(--text); color:var(--surface); border-color:var(--text); }\n\n/* ---- Frame ---- */\n.j-phone{\n  width:360px; height:720px;\n  background:var(--surface-sunken);\n  border-radius:24px; overflow:hidden;\n  box-shadow:var(--elev-3);\n  position:relative;\n  display:flex; flex-direction:column;\n}\n.j-view{ display:none; flex-direction:column; height:100%; overflow:hidden; }\n.j-view.is-active{ display:flex; }\n\n/* ---- Scroll body + footer (footer = flex sibling, tidak overlap) ---- */\n.j-body{ flex:1; min-height:0; overflow-y:auto; padding:var(--sp-5) var(--sp-4) var(--sp-4); display:flex; flex-direction:column; gap:var(--sp-5); }\n.j-footer{\n  flex:none;\n  padding:var(--sp-3) var(--sp-4) calc(var(--sp-4) + env(safe-area-inset-bottom));\n  background:var(--surface-sunken);\n  border-top:1px solid var(--border);\n}\n\n/* ---- Kicker ---- */\n.j-kicker{\n  font-size:var(--fs-footnote); font-weight:var(--fw-semibold);\n  letter-spacing:.02em; color:var(--text-muted);\n  display:flex; align-items:center; gap:var(--sp-2);\n}\n\n/* ---- Group hero ---- */\n.j-hero{ display:flex; flex-direction:column; gap:var(--sp-3); animation:rise var(--dur-sheet) var(--ease-standard) both; }\n.j-hero-name{ font-size:var(--fs-title1); font-weight:var(--fw-bold); letter-spacing:-.01em; line-height:var(--line-tight); }\n.j-meta{ display:flex; align-items:center; gap:var(--sp-2); font-size:var(--fs-footnote); color:var(--text-secondary); flex-wrap:wrap; }\n.j-dot{ width:6px; height:6px; border-radius:var(--r-pill); background:var(--n-4); }\n.j-live{ display:inline-flex; align-items:center; gap:6px; color:var(--pos-text); font-weight:var(--fw-medium); }\n.j-live .j-pulse{ width:7px; height:7px; border-radius:var(--r-pill); background:var(--pos); position:relative; }\n.j-live .j-pulse::after{ content:\"\"; position:absolute; inset:-3px; border-radius:var(--r-pill); background:var(--pos); opacity:.4; animation:pulse 2s var(--ease-standard) infinite; }\n\n/* ---- Inviter + member cluster card ---- */\n.j-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); padding:var(--sp-4); display:flex; flex-direction:column; gap:var(--sp-3); }\n.j-inviter{ display:flex; align-items:center; gap:var(--sp-3); }\n.j-inviter-txt{ display:flex; flex-direction:column; gap:2px; min-width:0; }\n.j-inviter-txt .lbl{ font-size:var(--fs-caption); color:var(--text-muted); }\n.j-inviter-txt .nm{ font-size:var(--fs-subhead); font-weight:var(--fw-semibold); }\n.j-hr{ height:1px; background:var(--border); border:0; }\n.j-members{ display:flex; align-items:center; gap:var(--sp-3); }\n.j-stack{ display:flex; }\n.j-stack .j-avatar{ margin-left:-8px; box-shadow:0 0 0 2px var(--surface); }\n.j-stack .j-avatar:first-child{ margin-left:0; }\n.j-members-txt{ font-size:var(--fs-footnote); color:var(--text-secondary); line-height:var(--line-body); }\n.j-members-txt b{ color:var(--text); font-weight:var(--fw-semibold); }\n\n/* ---- Avatar ---- */\n.j-avatar{\n  --c:var(--m-7);\n  width:36px; height:36px; flex:none; border-radius:var(--r-pill);\n  background:var(--c); color:#fff;\n  display:flex; align-items:center; justify-content:center;\n  font-size:var(--fs-footnote); font-weight:var(--fw-bold); letter-spacing:.01em;\n}\n.j-avatar--lg{ width:44px; height:44px; font-size:var(--fs-subhead); }\n\n/* ---- Question + identity list ---- */\n.j-ask{ font-size:var(--fs-title3); font-weight:var(--fw-bold); }\n.j-list{ display:flex; flex-direction:column; gap:var(--sp-2); }\n.j-row{\n  display:flex; align-items:center; gap:var(--sp-3);\n  width:100%; text-align:left; cursor:pointer;\n  background:var(--surface); border:1.5px solid var(--border);\n  border-radius:var(--r-btn); padding:var(--sp-3);\n  transition:border-color var(--dur-tap),background var(--dur-tap),transform var(--dur-tap);\n  font-family:var(--bb-font);\n}\n.j-row:active{ transform:scale(.99); }\n.j-row .nm{ font-size:var(--fs-subhead); font-weight:var(--fw-medium); color:var(--text); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }\n.j-row .tick{ width:22px; height:22px; flex:none; border-radius:var(--r-pill); border:2px solid var(--n-4); display:flex; align-items:center; justify-content:center; color:transparent; transition:all var(--dur-tap); }\n.j-row[aria-checked=\"true\"]{ border-color:var(--brand); background:var(--brand-tint); }\n.j-row[aria-checked=\"true\"] .tick{ background:var(--brand); border-color:var(--brand); color:#fff; }\n\n.j-newname{\n  display:flex; align-items:center; gap:var(--sp-3); width:100%; text-align:left; cursor:pointer;\n  background:transparent; border:1.5px dashed var(--border); border-radius:var(--r-btn);\n  padding:var(--sp-3); color:var(--text-secondary); font:var(--fw-medium) var(--fs-subhead)/1 var(--bb-font);\n}\n.j-newname:hover{ border-color:var(--n-4); color:var(--text); }\n.j-plus{ width:36px; height:36px; flex:none; border-radius:var(--r-pill); background:var(--n-2); color:var(--text-secondary); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:var(--fw-regular); }\n\n/* ---- Buttons ---- */\n.j-btn{\n  width:100%; border:0; cursor:pointer; border-radius:var(--r-btn);\n  font:var(--fw-semibold) var(--fs-body)/1 var(--bb-font);\n  padding:var(--sp-4); background:var(--btn-bg); color:var(--btn-fg);\n  transition:background var(--dur-tap),transform var(--dur-tap);\n  display:flex; align-items:center; justify-content:center; gap:var(--sp-2);\n}\n.j-btn:hover{ background:var(--btn-bg-hover); }\n.j-btn:active{ transform:scale(.99); background:var(--btn-bg-active); }\n.j-btn:disabled{ background:var(--btn-bg-disabled); color:var(--btn-fg-disabled); cursor:default; }\n.j-btn--ghost{ background:transparent; color:var(--text-secondary); padding:var(--sp-3); font-weight:var(--fw-medium); font-size:var(--fs-subhead); }\n.j-btn--ghost:hover{ background:transparent; color:var(--text); }\n\n/* ---- New name input ---- */\n.j-back{ display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-subhead); font-weight:var(--fw-medium); color:var(--text-secondary); background:none; border:0; cursor:pointer; font-family:var(--bb-font); padding:0; }\n.j-back:hover{ color:var(--text); }\n.j-preview{ display:flex; flex-direction:column; align-items:center; gap:var(--sp-3); padding:var(--sp-5) 0; }\n.j-avatar--xl{ width:72px; height:72px; font-size:var(--fs-title2); }\n.j-field{\n  width:100%; font:var(--fw-medium) var(--fs-body)/1.2 var(--bb-font);\n  color:var(--text); background:var(--surface); border:1.5px solid var(--border);\n  border-radius:var(--r-field); padding:var(--sp-4); text-align:center;\n}\n.j-field::placeholder{ color:var(--text-muted); font-weight:var(--fw-regular); }\n.j-field:focus{ outline:none; border-color:var(--brand); box-shadow:var(--focus-ring); }\n\n/* ---- Joined state ---- */\n.j-done-mark{\n  width:64px; height:64px; border-radius:var(--r-pill); background:var(--pos-tint); color:var(--pos-text);\n  display:flex; align-items:center; justify-content:center; margin:0 auto;\n  animation:pop var(--dur-sheet) var(--ease-emphasized) both;\n}\n.j-done-head{ text-align:center; display:flex; flex-direction:column; gap:var(--sp-2); }\n.j-done-head h2{ font-size:var(--fs-title2); font-weight:var(--fw-bold); }\n.j-done-head p{ font-size:var(--fs-subhead); color:var(--text-secondary); }\n.j-you{ display:flex; align-items:center; gap:var(--sp-3); background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); padding:var(--sp-3) var(--sp-4); }\n.j-you .nm{ font-size:var(--fs-subhead); font-weight:var(--fw-semibold); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }\n.j-you .tag{ font-size:var(--fs-caption); color:var(--pos-text); background:var(--pos-tint); padding:4px 10px; border-radius:var(--r-pill); font-weight:var(--fw-semibold); flex:none; }\n.j-glance{ display:flex; flex-direction:column; gap:var(--sp-1); }\n.j-glance-lbl{ font-size:var(--fs-caption); font-weight:var(--fw-semibold); color:var(--text-muted); letter-spacing:.02em; padding:0 var(--sp-1); }\n.j-txn{ display:flex; align-items:center; gap:var(--sp-3); background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); padding:var(--sp-3) var(--sp-4); }\n.j-txn-txt{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }\n.j-txn-txt .t{ font-size:var(--fs-subhead); font-weight:var(--fw-medium); }\n.j-txn-txt .s{ font-size:var(--fs-caption); color:var(--text-muted); }\n.j-amt{ font-variant-numeric:tabular-nums; font-feature-settings:\"tnum\" 1,\"lnum\" 1; font-size:var(--fs-subhead); font-weight:var(--fw-semibold); letter-spacing:var(--num-tracking); }\n.j-amt--neg{ color:var(--neg-text); }\n\n/* ---- Install nudge (muncul belakangan, tenang, bisa ditutup) ---- */\n.j-nudge{\n  position:absolute; left:var(--sp-3); right:var(--sp-3); bottom:var(--sp-4);\n  background:var(--surface-raised); border:1px solid var(--border); border-radius:var(--r-card);\n  box-shadow:var(--elev-3); padding:var(--sp-4);\n  display:flex; gap:var(--sp-3); align-items:flex-start;\n  transform:translateY(140%); opacity:0; pointer-events:none;\n  transition:transform var(--dur-sheet) var(--ease-emphasized),opacity <!-- ========================= STATE: PILIH IDENTITAS ========================= -->\n  <section class=\"j-view is-active\" data-view=\"pick\">\n    <div class=\"j-body\">\n      <div class=\"j-kicker\">Kamu diajak gabung<\u002Fdiv>\n\n      <div class=\"j-hero\">\n        <div class=\"j-hero-name\">Trip Bali<\u002Fdiv>\n        <div class=\"j-meta\">\n          <span>6 anggota<\u002Fspan><span class=\"j-dot\"><\u002Fspan>\n          <span>23 transaksi<\u002Fspan><span class=\"j-dot\"><\u002Fspan>\n          <span class=\"j-live\"><span class=\"j-pulse\"><\u002Fspan>aktif barusan<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"j-card\">\n        <div class=\"j-inviter\">\n          <div class=\"j-avatar j-avatar--lg\" style=\"--c:var(--m-7)\">DP<\u002Fdiv>\n          <div class=\"j-inviter-txt\">\n            <span class=\"lbl\">Diajak oleh<\u002Fspan>\n            <span class=\"nm\">Dimas Prasetyo<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <hr class=\"j-hr\">\n        <div class=\"j-members\">\n          <div class=\"j-stack\">\n            <div class=\"j-avatar\" style=\"--c:var(--m-7)\">DP<\u002Fdiv>\n            <div class=\"j-avatar\" style=\"--c:var(--m-11)\">RW<\u002Fdiv>\n            <div class=\"j-avatar\" style=\"--c:var(--m-4)\">RS<\u002Fdiv>\n            <div class=\"j-avatar\" style=\"--c:var(--m-1)\">B<\u002Fdiv>\n            <div class=\"j-avatar\" style=\"--c:var(--m-6)\">+2<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"j-members-txt\"><b>Rani<\u002Fb>, <b>Rangga<\u002Fb>, <b>Bella<\u002Fb> &amp; 2 lainnya sudah di dalam<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"j-ask\">Yang mana kamu?<\u002Fdiv>\n      <div class=\"j-list\" id=\"pickList\">\n        <button class=\"j-row\" type=\"button\" role=\"checkbox\" aria-checked=\"false\" data-name=\"Rani Wijaya\" data-color=\"11\" data-initial=\"RW\">\n          <span class=\"j-avatar\" style=\"--c:var(--m-11)\">RW<\u002Fspan>\n          <span class=\"nm\">Rani Wijaya<\u002Fspan>\n          <span class=\"tick\"><svg class=\"svic\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 13l4 4L19 7\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <\u002Fbutton>\n        <button class=\"j-row\" type=\"button\" role=\"checkbox\" aria-checked=\"false\" data-name=\"Rangga Saputra\" data-color=\"4\" data-initial=\"RS\">\n          <span class=\"j-avatar\" style=\"--c:var(--m-4)\">RS<\u002Fspan>\n          <span class=\"nm\">Rangga Saputra<\u002Fspan>\n          <span class=\"tick\"><svg class=\"svic\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 13l4 4L19 7\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <\u002Fbutton>\n        <button class=\"j-row\" type=\"button\" role=\"checkbox\" aria-checked=\"false\" data-name=\"Bella\" data-color=\"1\" data-initial=\"B\">\n          <span class=\"j-avatar\" style=\"--c:var(--m-1)\">B<\u002Fspan>\n          <span class=\"nm\">Bella<\u002Fspan>\n          <span class=\"tick\"><svg class=\"svic\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 13l4 4L19 7\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <\u002Fbutton>\n        <button class=\"j-row\" type=\"button\" role=\"checkbox\" aria-checked=\"false\" data-name=\"Bagus\" data-color=\"3\" data-initial=\"B\">\n          <span class=\"j-avatar\" style=\"--c:var(--m-3)\">B<\u002Fspan>\n          <span class=\"nm\">Bagus<\u002Fspan>\n          <span class=\"tick\"><svg class=\"svic\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 13l4 4L19 7\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <\u002Fbutton>\n        <button class=\"j-row\" type=\"button\" role=\"checkbox\" aria-checked=\"false\" data-name=\"Muhammad Reza Aditya Nugroho\" data-color=\"9\" data-initial=\"MN\">\n          <span class=\"j-avatar\" style=\"--c:var(--m-9)\">MN<\u002Fspan>\n          <span class=\"nm\">Muhammad Reza Aditya Nugroho<\u002Fspan>\n          <span class=\"tick\"><svg class=\"svic\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 13l4 4L19 7\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <\u002Fbutton>\n        <button class=\"j-newname\" type=\"button\" data-go=\"new\">\n          <span class=\"j-plus\">+<\u002Fspan>\n          <span>Namaku belum ada<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"j-footer\">\n      <button class=\"j-btn\" id=\"pickCta\" type=\"button\" disabled=\"\" data-go=\"joined\">Pilih namamu dulu<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ========================= STATE: NAMA BARU ========================= -->\n  <section class=\"j-view\" data-view=\"new\">\n    <div class=\"j-body\">\n      <button class=\"j-back\" type=\"button\" data-go=\"pick\">\n        <svg class=\"svic\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M15 5l-7 7 7 7\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        Pilih dari daftar\n      <\u002Fbutton>\n\n      <div class=\"j-hero\" style=\"gap:var(--sp-1)\">\n        <div class=\"j-ask\">Siapa namamu?<\u002Fdiv>\n        <div class=\"j-meta\"><span>Kamu gabung ke <b style=\"color:var(--text)\">Trip Bali<\u002Fb><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"j-preview\">\n        <div class=\"j-avatar j-avatar--xl\" id=\"newAvatar\" style=\"--c:var(--m-5)\">?<\u002Fdiv>\n        <input class=\"j-field\" id=\"newInput\" type=\"text\" placeholder=\"Tulis namamu\" autocomplete=\"name\" maxlength=\"40\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"j-footer\">\n      <button class=\"j-btn\" id=\"newCta\" type=\"button\" disabled=\"\" data-go=\"joined\">Masuk<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ========================= STATE: SUDAH MASUK ========================= -->\n  <section class=\"j-view\" data-view=\"joined\">\n    <div class=\"j-body\">\n      <div class=\"j-done-mark\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" width=\"30\" height=\"30\"><path d=\"M5 13l4 4L19 7\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"j-done-head\">\n        <h2>Kamu di dalam <span id=\"joinGroup\">Trip Bali<\u002Fspan><\u002Fh2>\n        <p>Semua transaksi grup sekarang kebuka untukmu.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"j-you\">\n        <span class=\"j-avatar j-avatar--lg\" id=\"youAvatar\" style=\"--c:var(--m-11)\">RW<\u002Fspan>\n        <span class=\"nm\" id=\"youName\">Rani Wijaya<\u002Fspan>\n        <span class=\"tag\">Itu kamu<\u002Fspan>\n      <\u002Fdiv>\n\n      <div class=\"j-glance\">\n        <div class=\"j-glance-lbl\">TRANSAKSI TERAKHIR<\u002Fdiv>\n        <div class=\"j-txn\">\n          <span class=\"j-avatar\" style=\"--c:var(--m-7)\">DP<\u002Fspan>\n          <span class=\"j-txn-txt\"><span class=\"t\">Makan malam Jimbaran<\u002Fspan><span class=\"s\">Dibayar Dimas · hari ini<\u002Fspan><\u002Fspan>\n          <span class=\"j-amt j-amt--neg\">−Rp84.000<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"j-txn\">\n          <span class=\"j-avatar\" style=\"--c:var(--m-4)\">RS<\u002Fspan>\n          <span class=\"j-txn-txt\"><span class=\"t\">Sewa motor 3 hari<\u002Fspan><span class=\"s\">Dibayar Rangga · kemarin<\u002Fspan><\u002Fspan>\n          <span class=\"j-amt j-amt--neg\">−Rp50.000<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"j-footer\">\n      <button class=\"j-btn\" type=\"button\">Lihat grup<\u002Fbutton>\n      <button class=\"j-btn j-btn--ghost\" type=\"button\" data-go=\"pick\">Bukan kamu? Ganti identitas<\u002Fbutton>\n    <\u002Fdiv>\n\n    <!-- Ajakan install: muncul belakangan, tenang, bisa ditutup. BUKAN modal. -->\n    <div class=\"j-nudge\" id=\"nudge\" role=\"status\">\n      <div class=\"j-nudge-ico\">\n        <svg class=\"svic\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3v12m0 0l-4-4m4 4l4-4M5 21h14\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"j-nudge-txt\">\n        <span class=\"t\">Simpan Trip Bali ke layar utama<\u002Fspan>\n        <span class=\"s\">Biar sekali tap langsung buka, tanpa cari link lagi.<\u002Fspan>\n        <div class=\"j-nudge-act\">\n          <button class=\"go\" type=\"button\">Tambahkan<\u002Fbutton>\n          <button class=\"later\" type=\"button\" id=\"nudgeLater\">Nanti aja<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <button class=\"j-nudge-x\" id=\"nudgeX\" type=\"button\" aria-label=\"Tutup\">\n        <svg class=\"svic\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 6l12 12M18 6L6 18\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<script>\n(function(){\n  var phone = document.querySelector('.j-phone');\n  var views = {};\n  document.querySelectorAll('.j-view').forEach(function(v){ views[v.dataset.view]=v; });\n  var devBtns = document.querySelectorAll('.j-dev [data-go]');\n  var nudge = document.getElementById('nudge');\n  var chosen = null; // {name, color, initial}\n\n  function initials(name){\n    var w = name.trim().split(/\\s+/).filter(Boolean);\n    if(w.length === 0) return '?';\n    if(w.length === 1) return w[0][0].toUpperCase();\n    return (w[0][0] + w[w.length-1][0]).toUpperCase();\n  }\n\n  function show(view){\n    Object.keys(views).forEach(function(k){ views[k].classList.toggle('is-active', k===view); });\n    devBtns.forEach(function(b){ if(b.dataset.go!=='nudge') b.setAttribute('aria-pressed', b.dataset.go===view); });\n    var b = views[view].querySelector('.j-body'); if(b) b.scrollTop = 0;\n    if(view === 'joined'){\n      // Reflect chosen identity, then let the install nudge arrive LATER.\n      if(chosen){\n        var av = document.getElementById('youAvatar');\n        av.textContent = chosen.initial; av.style.setProperty('--c','var(--m-'+chosen.color+')');\n        document.getElementById('youName').textContent = chosen.name;\n      }\n      nudge.classList.remove('is-in');\n      clearTimeout(show._t);\n      show._t = setTimeout(function(){ nudge.classList.add('is-in'); }, 3200);\n    } else {\n      nudge.classList.remove('is-in');\n    }\n  }\n\n  // Identity rows\n  var cta = document.getElementById('pickCta');\n  document.querySelectorAll('#pickList .j-row').forEach(function(row){\n    row.addEventListener('click', function(){\n      document.querySelectorAll('#pickList .j-row').forEach(function(r){ r.setAttribute('aria-checked', r===row); });\n      chosen = { name: row.dataset.name, color: row.dataset.color, initial: row.dataset.initial };\n      cta.disabled = false;\n      cta.textContent = 'Masuk sebagai ' + row.dataset.name.split(/\\s+/)[0];\n    });\n  });\n\n  // New name\n  var input = document.getElementById('newInput');\n  var newAvatar = document.getElementById('newAvatar');\n  var newCta = document.getElementById('newCta');\n  var newColors = [5,6,8,2,10]; // warna netral utk anggota baru\n  input.addEventListener('input', function(){\n    var v = input.value.trim();\n    newAvatar.textContent = v ? initials(v) : '?';\n    var c = newColors[v.length % newColors.length];\n    newAvatar.style.setProperty('--c','var(--m-'+c+')');\n    newCta.disabled = !v;\n    newCta.textContent = v ? 'Masuk sebagai ' + v.split(/\\s+/)[0] : 'Masuk';\n    if(v) chosen = { name:v, color:c, initial:initials(v) };\n  });\n\n  // Buttons that navigate\n  document.querySelectorAll('[data-go]').forEach(function(el){\n    if(el.dataset.go === 'nudge'){\n      el.addEventListener('click', function(){ show('joined'); clearTimeout(show._t); nudge.classList.add('is-in'); });\n      return;\n    }\n    el.addEventListener('click', function(){\n      if(el === cta && cta.disabled) return;\n      if(el === newCta && newCta.disabled) return;\n      if(el.dataset.go === 'new') input.focus();\n      show(el.dataset.go);\n    });\n  });\n\n  // Nudge dismiss\n  document.getElementById('nudgeX').addEventListener('click', function(){ nudge.classList.remove('is-in'); });\n  document.getElementById('nudgeLater').addEventListener('click', function(){ nudge.classList.remove('is-in'); });\n\n  // Theme\n  document.getElementById('devTheme').addEventListener('click', function(){\n    var el = document.documentElement;\n    el.setAttribute('data-theme', el.getAttribute('data-theme')==='dark' ? 'light' : 'dark');\n  });\n\n  show('pick');\n})();\n<\u002Fscript>\n\n<!-- ============================================================\n  CATATAN DESAIN\n  Tujuan: 1 detik pertama harus jawab \"ini apaan, daftar ga, bayar\n  ga, install ga\" tanpa ditanya. Bukti nyata dulu (nama grup, yang\n  ngajak + avatarnya, anggota yang udah di dalam, indikator hidup),\n  baru SATU aksi: \"Yang mana kamu?\".\n\n  Yang sengaja TIDAK ada: harga/langganan, dinding install, minta\n  izin, onboarding/tur, logo raksasa + tagline. Ajakan install\n  cuma muncul di state \"sudah masuk\", nongol belakangan (~3 dtk),\n  tenang, bisa ditutup — bukan modal.\n\n  Identitas: inisial dari kata (Dimas Prasetyo→DP; satu kata→huruf\n  pertama saja). Tabrakan inisial (Bella & Bagus = B) tidak\n  dipanjangin — dibedain lewat warna, dan nama selalu tampil karena\n  dia lagi milih dirinya sendiri. \"Muhammad Reza Aditya Nugroho\"\n  dipakai untuk menguji baris nama panjang (di-ellipsis, avatar MN).\n\n  State bisa dipindah lewat bar dev di atas (bukan bagian mockup).\n\n  Token yang perlu DITAMBAH ke tokens.css:\n  - Tidak ada. Semua warna/spacing/radius/durasi diambil dari token\n    yang ada. Warna avatar anggota baru dipilih dari palet --m-* .\n  ============================================================ -->\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
