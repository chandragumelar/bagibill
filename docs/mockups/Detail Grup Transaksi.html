document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ckground:var(--surface-sunken);\n  display:flex;flex-direction:column;position:relative;color:var(--text);}\n.notch{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:118px;height:32px;background:#000;border-radius:20px;z-index:5;}\n\n.statusbar{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--sp-6) 0 var(--sp-6);font-size:var(--fs-subhead);}\n.statusbar .t{font-weight:var(--fw-semibold);}\n.statusbar .r{display:flex;align-items:center;gap:var(--sp-1);font-size:var(--fs-caption);}\n.batt{width:22px;height:11px;border:1.5px solid var(--text);border-radius:3px;position:relative;display:inline-block;}\n.batt::after{content:\"\";position:absolute;inset:1.5px;right:6px;background:var(--text);border-radius:1px;}\n\n/* ---- group header ---- */\n.ghead{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--border);\n  padding:var(--sp-1) var(--sp-4) 0;box-shadow:var(--elev-1);z-index:2;}\n.ghead-top{display:flex;align-items:center;gap:var(--sp-2);height:36px;}\n.icobtn{border:none;background:none;color:var(--brand);font-size:26px;line-height:1;cursor:pointer;width:30px;height:30px;\n  display:flex;align-items:center;justify-content:center;padding:0;border-radius:var(--r-pill);}\n.gtitle{flex:1;min-width:0;text-align:center;}\n.gtitle h1{margin:0;font-size:var(--fs-body);font-weight:var(--fw-semibold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n.icobtn.menu{font-size:20px;color:var(--text-secondary);}\n\n/* member stack + your position */\n.ghead-mid{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) 0 var(--sp-4);}\n.avstack{display:flex;flex:0 0 auto;}\n.avstack .av{width:32px;height:32px;border-radius:var(--r-pill);border:2px solid var(--surface);color:#fff;\n  font-size:var(--fs-caption);font-weight:var(--fw-semibold);display:flex;align-items:center;justify-content:center;margin-left:-8px;background:var(--av,var(--n-5));}\n.avstack .av:first-child{margin-left:0;}\n.avstack .more{background:var(--n-3);color:var(--text-secondary);}\n\n/* the most-sought info: your position */\n.position{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end;text-align:right;\n  background:var(--surface-sunken);border:1px solid var(--border);border-radius:var(--r-card);padding:var(--sp-2) var(--sp-3);cursor:pointer;}\n.position .lbl{font-size:var(--fs-caption);color:var(--text-muted);}\n.position .amt{font-size:var(--fs-title3);font-weight:var(--fw-bold);letter-spacing:-.01em;line-height:1.15;}\n.position .amt.neg{color:var(--neg-text);}\n.position .amt.pos{color:var(--pos-text);}\n.position .sub{font-size:var(--fs-caption);color:var(--text-secondary);}\n.position .sub b{color:var(--text);font-weight:var(--fw-semibold);}\n\n/* tabs */\n.tabs{display:flex;gap:var(--sp-5);}\n.tab{border:none;background:none;font-family:inherit;font-size:var(--fs-subhead);font-weight:var(--fw-medium);\n  color:var(--text-muted);padding:var(--sp-2) 0 var(--sp-3);cursor:pointer;position:relative;}\n.tab.active{color:var(--text);font-weight:var(--fw-semibold);}\n.tab.active::after{content:\"\";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--brand);border-radius:var(--r-pill);}\n.tab .count{color:var(--text-muted);font-weight:var(--fw-regular);}\n\n/* ---- toolbar: search + filter ---- */\n.toolbar{flex:0 0 auto;display:flex;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);background:var(--surface-sunken);}\n.search{flex:1;display:flex;align-items:center;gap:var(--sp-2);height:38px;padding:0 var(--sp-3);border-radius:var(--r-field);\n  background:var(--surface);border:1px solid var(--border);color:var(--text-muted);font-size:var(--fs-subhead);}\n.filter{flex:0 0 auto;display:flex;align-items:center;gap:var(--sp-1);height:38px;padding:0 var(--sp-3);border-radius:var(--r-field);\n  background:var(--surface);border:1px solid var(--border);color:var(--text-secondary);font-size:var(--fs-footnote);font-weight:var(--fw-medium);cursor:pointer;font-family:inherit;}\n.filter .dot{width:6px;height:6px;border-radius:var(--r-pill);background:var(--brand);}\n\n/* ---- list ---- */\n.list{flex:1;overflow-y:auto;padding-bottom:110px;}\n.daysep{display:flex;align-items:baseline;justify-content:space-between;padding:var(--sp-4) var(--sp-4) var(--sp-2);position:sticky;top:0;\n  background:var(--surface-sunken);z-index:1;}\n.daysep .d{font-size:var(--fs-footnote);font-weight:var(--fw-semibold);color:var(--text-secondary);}\n.daysep .s{font-size:var(--fs-caption);color:var(--text-muted);}\n.group{background:var(--surface);margin:0 var(--sp-4) var(--sp-3);border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--elev-1);}\n\n/* transaction row — ONE pattern, diulang */\n.tx{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:var(--sp-4);\n  padding:var(--sp-3);border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--dur-tap) var(--ease);}\n.tx:last-child{border-bottom:none;}\n.tx:active{background:var(--surface-sunken);}\n.cat{width:40px;height:40px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;font-size:19px;\n  background:color-mix(in srgb, var(--cat,var(--n-5)) 16%, transparent);}\n.tx-main{min-width:0;}\n.tx-title{font-size:var(--fs-subhead);font-weight:var(--fw-medium);color:var(--text);line-height:1.3;\n  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}\n.tx-meta{display:flex;align-items:center;gap:var(--sp-2);margin-top:3px;min-width:0;flex-wrap:wrap;row-gap:var(--sp-1);}\n.tx-meta .payer{flex:0 0 auto;font-size:var(--fs-caption);color:var(--text-muted);white-space:nowrap;}\n.marks{display:flex;align-items:center;gap:var(--sp-2);flex:0 0 auto;}\n.mk{font-size:var(--fs-caption);color:var(--text-muted);display:inline-flex;align-items:center;gap:2px;font-style:normal;}\n.fx{flex:0 0 auto;display:inline-flex;align-items:center;height:18px;padding:0 var(--sp-1);border-radius:var(--r-pill);\n  font-size:var(--fs-caption2);font-weight:var(--fw-semibold);background:var(--n-2);color:var(--text-secondary);}\n\n/* effect-on-you column */\n.tx-eff{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;text-align:right;min-width:84px;padding-left:var(--sp-2);}\n.eff-amt{font-size:var(--fs-subhead);font-weight:var(--fw-semibold);white-space:nowrap;}\n.eff-lbl{font-size:var(--fs-caption2);color:var(--text-muted);margin-top:1px;}\n.tx-eff.neg .eff-amt{color:var(--neg-text);}\n.tx-eff.pos .eff-amt{color:var(--pos-text);}\n.tx-eff.out .eff-amt{color:var(--text-muted);font-weight:var(--fw-medium);}\n\n/* not-involved: mute the whole row without adding noise */\n.tx.out .cat{background:var(--n-2);filter:grayscale(1);opacity:.7;}\n.tx.out .tx-title{color:var(--text-secondary);}\n\n/* settlement — bentuk beda, ga boleh ketuker dgn pengeluaran */\n.tx.settle{grid-template-columns:40px 1fr auto;background:var(--pos-tint);}\n.tx.settle .cat{background:transparent;color:var(--pos-text);border:1.5px dashed color-mix(in srgb,var(--pos) 55%,transparent);font-size:16px;font-weight:var(--fw-bold);}\n.tx.settle .tx-title{font-size:var(--fs-footnote);font-weight:var(--fw-semibold);color:var(--pos-text);letter-spacing:.02em;text-transform:uppercase;}\n.tx.settle .flow{font-size:var(--fs-subhead);color:var(--text);font-weight:var(--fw-medium);margin-top:1px;}\n.tx.settle .eff-amt{color:var(--pos-text);}\n\n/* ---- FAB: tambah + jalur cepat scan ---- */\n.fab{position:absolute;right:var(--sp-4);bottom:var(--sp-6);display:flex;align-items:center;gap:2px;\n  background:var(--brand);border-radius:var(--r-pill);box-shadow:var(--elev-3);}\n.fab-scan{border:none;background:none;color:var(--on-brand);width:48px;height:52px;font-size:20px;cursor:pointer;\n  border-radius:var(--r-pill) 0 0 var(--r-pill);display:flex;align-items:center;justify-content:center;opacity:.92;}\n.fab-scan::after{content:\"\";width:1px;height:24px;background:color-mix(in srgb,var(--on-brand) 30%,transparent);position:absolute;right:0;}\n.fab-main{position:relative;border:none;background:none;color:var(--on-brand);height:52px;padding:0 var(--sp-5) 0 var(--sp-4);\n  font-size:var(--fs-subhead);font-weight:var(--fw-semibold);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:var(--sp-2);border-radius:0 var(--r-pill) var(--r-pill) 0;}\n.fab-main .plus{font-size:20px;line-height:0;}\n\n/* ---- empty state ---- */\n.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--sp-6);gap:var(--sp-4);}\n.empty .art{width:150px;height:150px;border-radius:var(--r-card);border:1px dashed var(--border);\n  background:repeating-linear-gradient(135deg,var(--surface) 0 10px,var(--surface-sunken) 10px 20px);\n  display:flex;align-items:center;justify-content:center;font-size:44px;opacity:.9;}\n.empty h2{margin:0;font-size:var(--fs-title3);font-weight:var(--fw-bold);color:var(--text);}\n.empty p{margin:0;font-size:var(--fs-footnote);color:var(--text-muted);line-height:1.45;max-width:230px;}\n.empty .cta{width:100%;max-width:250px;display:flex;flex-direction:column;gap:var(--sp-2);margin-top:var(--sp-2);}\n.btn-primary{height:50px;border:none;border-radius:var(--r-card);background:var(--brand);color:var(--on-brand);\n  font-size:var(--fs-body);font-weight:var(--fw-semibold);cursor:pointer;font-family:inherit;box-shadow:var(--elev-1);}\n.btn-ghost{height:44px;border:none;background:none;color:var(--brand);font-size:var(--fs-subhead);font-weight:var(--fw-medium);cursor:pointer;font-family:inherit;}\n\n.notes{max-width:760px;font-size:var(--fs-footnote);color:#69717E;line-height:1.6;}\n.notes h3{font-size:var(--fs-subhead);color:#282D35;margin:0 0 var(--sp-2);}\n.notes b{color:#282D35;}\n.notes code{background:#EDF0F3;padding:1px 5px;border-radius:6px;font-size:var(--fs-caption);}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<div class=\"controls\">\n  <span>BagiBill · Detail Grup — Transaksi<\u002Fspan>\n  <button id=\"themeBtn\" onclick=\"toggleTheme()\">Gelap<\u002Fbutton>\n<\u002Fdiv>\n\n<div class=\"frames\">\n\n  <!-- ================= MAIN: filled ================= -->\n  <div class=\"phone\" data-theme=\"light\">\n    <div class=\"notch\"><\u002Fdiv>\n    <div class=\"screen\">\n      <div class=\"statusbar\"><span class=\"t num\">9:41<\u002Fspan><span class=\"r\"><span>●●●<\u002Fspan><b>5G<\u002Fb><span class=\"batt\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n\n      <header class=\"ghead\">\n        <div class=\"ghead-top\">\n          <button class=\"icobtn\">‹<\u002Fbutton>\n          <div class=\"gtitle\"><h1>Trip Bali 2026<\u002Fh1><\u002Fdiv>\n          <button class=\"icobtn menu\">⋯<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div class=\"ghead-mid\">\n          <div class=\"avstack\">\n            <span class=\"av\" style=\"--av:var(--m-7)\">A<\u002Fspan>\n            <span class=\"av\" style=\"--av:var(--m-4)\">B<\u002Fspan>\n            <span class=\"av\" style=\"--av:var(--m-11)\">C<\u002Fspan>\n            <span class=\"av\" style=\"--av:var(--m-2)\">D<\u002Fspan>\n            <span class=\"av more\">+3<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"position\">\n            <span class=\"lbl\">Posisi kamu<\u002Fspan>\n            <span class=\"amt neg num\">−Rp&nbsp;485.000<\u002Fspan>\n            <span class=\"sub\"><b>Kamu utang<\u002Fb> ke grup ›<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <nav class=\"tabs\">\n          <button class=\"tab active\">Transaksi<\u002Fbutton>\n          <button class=\"tab\">Saldo<\u002Fbutton>\n          <button class=\"tab\">Ringkasan<\u002Fbutton>\n        <\u002Fnav>\n      <\u002Fheader>\n\n      <div class=\"toolbar\">\n        <div class=\"search\">🔍 Cari transaksi<\u002Fdiv>\n        <button class=\"filter\"><span class=\"dot\"><\u002Fspan>Filter<\u002Fbutton>\n      <\u002Fdiv>\ m ada transaksi<\u002Fh2>\n        <p>Catat pengeluaran pertama grup ini. Bayar dulu, bagi belakangan.<\u002Fp>\n        <div class=\"cta\">\n          <button class=\"btn-primary\">+ Tambah pengeluaran<\u002Fbutton>\n          <button class=\"btn-ghost\">📷 Scan struk<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<div class=\"notes\">\n  <h3>Catatan desain<\u002Fh3>\n  <p><b>Posisi kamu<\u002Fb> dinaikkan ke header sebagai kartu di kanan avatar — angka + tanda + label (bukan warna saja), ketuk untuk lompat ke tab Saldo. <b>Baris transaksi<\u002Fb> satu pola grid <code>ikon · isi · efek<\u002Fcode>, diulang dengan isi beda. Efek ke kamu ada di kolom kanan: <span style=\"color:var(--neg-text)\">− bagianmu<\u002Fspan>, <span style=\"color:var(--pos-text)\">+ buat kamu<\u002Fspan>, atau <b>nggak ikut<\u002Fb> (baris diredupkan, ikon grayscale, tanpa nambah elemen). <b>Penanda<\u002Fb> struk/komentar/per-item sebagai ikon kecil di baris meta. <b>Beda mata uang<\u002Fb> pakai badge <code>SGD<\u002Fcode> + nominal asli; efek tetap dikonversi ke Rp grup. <b>Pelunasan<\u002Fb> dibedakan total: latar hijau tipis, ikon panah putus-putus, judul kapital, arah \"X melunasi ke kamu\" — tak akan ketuker dengan pengeluaran.<\u002Fp>\n  <p><b>Warna di luar token:<\u002Fb> tokens.css belum punya <b>warna kategori<\u002Fb>. Saya turunkan tint kategori dari palet member (<code>--m-*<\u002Fcode>) via <code>color-mix()<\u002Fcode> alih-alih memaksakan warna semantik yang salah. Kalau kategori mau jadi elemen tetap, sebaiknya tambah set token khusus, mis. <code>--cat-makan<\u002Fcode>, <code>--cat-transport<\u002Fcode>, dst. Sisanya (surface, border, text, brand, pos/neg, elevasi, spacing, radius, durasi) murni dari token.<\u002Fp>\n<\u002Fdiv>\n\n<script>\nfunction toggleTheme(){\n  var next = document.querySelector('.phone').getAttribute('data-theme')==='light'?'dark':'light';\n  document.querySelectorAll('.phone').forEach(functio
