  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"id\" data-theme=\"light\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>BagiBill — Scan Struk &amp; Editor Item<\u002Ftitle>\n<style>\n/* ============================================================\n   BagiBill — Scan Struk & Editor Item\n   Token dari tokens.css (di-inline supaya satu file mandiri).\n   Prefix kelas: .s-  Class dipakai ulang, tidak ada style inline\n   per elemen (kecuali --c warna member), semua nilai lewat variabel.\n   Catatan desain: sekali di bawah <script>.\n   ============================================================ */\n\n:root{\n  --bb-font:-apple-system,BlinkMacSystemFont,\"SF Pro Text\",\"SF Pro Display\",system-ui,\"Segoe UI\",Roboto,sans-serif;\n  --mono:ui-monospace,SFMono-Regular,\"SF Mono\",Menlo,Consolas,monospace;\n\n  --fs-caption2:11px; --fs-caption:12px; --fs-footnote:13px; --fs-subhead:15px;\n  --fs-body:17px; --fs-headline:17px; --fs-title3:20px; --fs-title2:22px; --fs-title1:28px; --fs-large:34px;\n  --num-lg:40px; --num-xl:48px; --num-tracking:-0.02em;\n  --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700;\n  --line-tight:1.2; --line-body:1.3; --line-relaxed:1.45;\n\n  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;\n  --sp-6:24px; --sp-7:32px; --sp-8:40px; --sp-9:48px; --sp-10:64px;\n\n  --r-btn:10px; --r-card:14px; --r-field:10px; --r-pill:999px;\n\n  --dur-tap:120ms; --dur-base:200ms; --dur-sheet:320ms;\n  --ease-standard:cubic-bezier(.2,.8,.2,1);\n  --ease-emphasized:cubic-bezier(.4,0,.2,1);\n\n  --m-1:#E5484D; --m-2:#E1620F; --m-3:#A9820C; --m-4:#4B9E2F;\n  --m-5:#12967A; --m-6:#0E8FB0; --m-7:#3A5BD9; --m-8:#5B4BD6;\n  --m-9:#7C3AED; --m-10:#A83BC0; --m-11:#C42C86; --m-12:#D33B63;\n}\n[data-theme=\"light\"]{\n  --n-0:#F6F7F9; --n-1:#FFFFFF; --n-2:#EDF0F3; --n-3:#E1E5EA; --n-4:#C8CED7;\n  --n-5:#98A0AC; --n-6:#69717E; --n-7:#49515D; --n-8:#282D35; --n-9:#12161C;\n  - #A78BFA; --route-text:#C4B5FD; --route-tint:#221A38;\n  --paper:#EDE9DE; --paper-ink:#2B2A26; --paper-faint:#7C786E; --paper-line:#D6D1C4;\n  --elev-1:0 1px 2px rgba(0,0,0,.4);\n  --elev-2:0 4px 14px rgba(0,0,0,.5);\n  --elev-3:0 10px 28px rgba(0,0,0,.6);\n}\n\n*{box-sizing:border-box; margin:0; padding:0;}\nhtml,body{height:100%;}\nbody{\n  font-family:var(--bb-font); color:var(--text); background:var(--n-4);\n  -webkit-font-smoothing:antialiased;\n  display:flex; align-items:flex-start; justify-content:center;\n  gap:var(--sp-6); padding:var(--sp-6); min-height:100vh;\n}\n.s-num{ font-variant-numeric:tabular-nums; font-feature-settings:\"tnum\" 1,\"lnum\" 1; }\nsvg{ display:block; }\n\n/* ---- Device shell ---- */\n.s-device{\n  position:relative; width:360px; height:800px;\n  background:var(--surface-sunken); border-radius:34px; overflow:hidden;\n  box-shadow:var(--elev-3); display:flex; flex-direction:column;\n}\n.s-statusbar{\n  flex:0 0 auto; height:44px; padding:0 var(--sp-5) 0 var(--sp-6); z-index:6;\n  display:flex; align-items:center; justify-content:space-between;\n  font-size:var(--fs-footnote); font-weight:var(--fw-semibold);\n  color:var(--text); background:var(--surface);\n}\n.s-sb-right{ display:flex; align-items:center; gap:5px; opacity:.85; }\n.s-sb-right rect{ fill:currentColor; }\n\n/* ---- Top bar ---- */\n.s-top{\n  flex:0 0 auto; display:flex; align-items:center; gap:var(--sp-2);\n  padding:var(--sp-1) var(--sp-3) var(--sp-3); background:var(--surface); z-index:5;\n}\n.s-iconbtn{\n  appearance:none; border:none; cursor:pointer; font-family:inherit;\n  width:38px; height:38px; border-radius:var(--r-pill); background:transparent; color:var(--text);\n  display:flex; align-items:center; justify-content:center; transition:background var(--dur-tap); flex:0 0 auto;\n}\n.s-iconbtn:hover{ background:var(--n-2); }\n.s-iconbtn svg{ width:22px; height:22px; }\n.s-top-id{ flex:1 1 auto; min-width:0; }\n.s-top-title{ font-size:var(--fs-headline); font-weight:var(--fw-bold); line-height:1.1; }\n.s-top-sub{ font-size:var(--fs-caption); color:var(--text-muted); margin-top:1px; display:flex; align-items:center; gap:5px; }\n.s-quota{ display:inline-flex; align-items:center; gap:4px; }\n.s-quota svg{ width:12px; height:12px; }\n.s-quota b{ color:var(--text-secondary); font-weight:var(--fw-semibold); }\n\n/* ---- Scroll region ---- */\n.s-scroll{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; }\n.s-scroll::-webkit-scrollbar{ width:0; }\n.s-screen{ display:none; }\n.s-screen.is-active{ display:block; }\n\n/* ===== Buttons (reusable) ===== */\n.s-btn{\n  appearance:none; border:none; font-family:inherit; cursor:pointer;\n  font-size:var(--fs-headline); font-weight:var(--fw-semibold);\n  border-radius:var(--r-btn); padding:var(--sp-3) var(--sp-4);\n  display:flex; align-items:center; justify-content:center; gap:var(--sp-2);\n  transition:background var(--dur-tap), transform var(--dur-tap), border-color var(--dur-tap); width:100%;\n}\n.s-btn:active{ transform:scale(.98); }\n.s-btn svg{ width:19px; height:19px; }\n.s-btn--primary{ background:var(--btn-bg); color:var(--btn-fg); }\n.s-btn--primary:hover{ background:var(--btn-bg-hover); }\n.s-btn--secondary{ background:var(--btn2-bg); color:var(--btn2-fg); border:1px solid var(--btn2-border); }\n.s-btn--secondary:hover{ background:var(--btn2-bg-hover); }\n.s-btn--ghost{ background:transparent; color:var(--brand); }\n.s-btn--ghost:hover{ background:var(--brand-tint); }\n\n/* ============================================================\n   1 · AMBIL STRUK (capture)\n   ============================================================ */\n.s-cap{ padding:var(--sp-4) var(--sp-4) var(--sp-8); display:flex; flex-direction:column; min-height:100%; }\n.s-cap-lead{ padding:var(--sp-2) var(--sp-2) var(--sp-5); }\n.s-cap-h{ font-size:var(--fs-title2); font-weight:var(--fw-bold); letter-spacing:-.02em; }\n.s-cap-p{ font-size:var(--fs-footnote); color:var(--text-secondary); margin-top:var(--sp-2); line-height:var(--line-relaxed); }\n\n/* Kartu kamera besar — aksi utama */\n.s-cam{\n  appearance:none; font-family:inherit; cursor:pointer; text-align:left; width:100%;\n  border:none; border-radius:var(--r-card); overflow:hidden; color:#fff;\n  background:linear-gradient(150deg, var(--brand) 0%, var(--brand-strong) 100%);\n  box-shadow:var(--elev-2); position:relative; aspect-ratio:5/4;\n  display:flex; flex-direction:column; justify-content:flex-end; padding:var(--sp-5);\n  transition:transform var(--dur-tap);\n}\n.s-cam:active{ transform:scale(.99); }\n.s-cam-grid{ position:absolute; inset:0; opacity:.5; }\n.s-cam-corner{ position:absolute; width:34px; height:34px; border:2.5px solid rgba(255,255,255,.9); }\n.s-cam-corner.tl{ top:20px; left:20px; border-right:none; border-bottom:none; border-radius:8px 0 0 0; }\n.s-cam-corner.tr{ top:20px; right:20px; border-left:none; border-bottom:none; border-radius:0 8px 0 0; }\n.s-cam-corner.bl{ bottom:64px; left:20px; border-right:none; border-top:none; border-radius:0 0 0 8px; }\n.s-cam-corner.br{ bottom:64px; right:20px; border-left:none; border-top:none; border-radius:0 0 8px 0; }\n.s-cam-ic{ width:40px; height:40px; border-radius:var(--r-pill); background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center; margin-bottom:var(--sp-3); }\n.s-cam-ic svg{ width:22px; height:22px; }\n.s-cam-t{ font-size:var(--fs-title3); font-weight:var(--fw-bold); position:relative; }\n.s-cam-s{ font-size:var(--fs-footnote); opacity:.85; margin-top:2px; position:relative; }\n\n/* Dua aksi sekunder */\n.s-cap-row{ display:flex; gap:var(--sp-3); margin-top:var(--sp-3); }\n.s-tile{\n  appearance:none; font-family:inherit; cursor:pointer; flex:1 1 0; min-width:0;\n  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card);\n  padding:var(--sp-4) var(--sp-3); display:flex; flex-direction:column; gap:var(--sp-2); color:var(--text);\n  transition:border-color var(--dur-tap), transform var(--dur-tap);\n}\n.s-tile:hover{ border-color:var(--n-4); }\n.s-tile:active{ transform:scale(.98); }\n.s-tile-ic{ width:34px; height:34px; border-radius:10px; background:var(--n-2); color:var(--text-secondary); display:flex; align-items:center; justify-content:center; }\n.s-tile-ic svg{ width:19px; height:19px; }\n.s-tile-t{ font-size:var(--fs-footnote); font-weight:var(--fw-semibold); }\n.s-tile-s{ font-size:var(--fs-caption2); color:var(--text-muted); line-height:var(--line-body); }\n\n/* Nada jujur */\n.s-honest{\n  display:flex; gap:var(--sp-3); margin-top:var(--sp-4);\n  background:var(--surface-sunken); border:1px solid var(--border); border-radius:var(--r-card); padding:var(--sp-3) var(--sp-4);\n}\n.s-honest svg{ width:18px; height:18px; color:var(--text-muted); flex:0 0 auto; margin-top:1px; }\n.s-honest p{ font-size:var(--fs-caption); color:var(--text-secondary); line-height:var(--line-relaxed); }\n.s-honest b{ color:var(--text); font-weight:var(--fw-semibold); }\n\n.s-cap-foot{ margin-top:auto; padding-top:var(--sp-5); text-align:center; }\n.s-manual{ appearance:none; border:none; background:transparent; font-family:inherit; cursor:pointer; color:var(--text-secondary); font-size:var(--fs-footnote); font-weight:var(--fw-medium); padding:var(--sp-2); }\n.s-manual b{ color:var(--brand); font-weight:var(--fw-semibold); }\n\n/* ============================================================\n   RECEIPT (kertas termal) — dipakai di waiting, peek, failure\n   ============================================================ */\n.s-receipt{\n  background:var(--paper); color:var(--paper-ink); border-radius:6px;\n  font-family:var(--mono); font-size:12px; line-height:1.5; box-shadow:var(--elev-2);\n  padding:16px 16px 22px; position:relative; overflow:hidden;\n}\n.s-receipt::after{ content:\"\"; position:absolute; left:0; right:0; bottom:0; height:12px;\n  background:repeating-linear-gradient(-45deg, var(--paper) 0 7px, transparent 7px 14px);\n  filter:drop-shadow(0 -1px 0 var(--paper)); }\n.s-rc-head{ text-align:center; border-bottom:1px dashed var(--paper-line); padding-bottom:10px; margin-bottom:8px; }\n.s-rc-name{ font-weight:700; letter-spacing:.06em; font-size:13px; }\n.s-rc-meta{ color:var(--paper-faint); font-size:10px; margin-top:3px; }\n.s-rc-line{ display:flex; gap:8px; padding:2px 0; }\n.s-rc-line .q{ width:18px; flex:0 0 auto; color:var(--paper-faint); }\n.s-rc-line .n{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }\n.s-rc-line .p{ flex:0 0 auto; }\n.s-rc-line.is-hi{ background:color-mix(in srgb, var(--warn) 40%, transparent); border-radius:3px; margin:0 -4px; padding:2px 4px; }\n.s-rc-sep{ border-top:1px dashed var(--paper-line); margin:8px 0; }\n.s-rc-tot{ display:flex; justify-content:space-between; padding:2px 0; }\n.s-rc-tot.grand{ font-weight:700; font-size:13px; border-top:1px solid var(--paper-ink); margin-top:6px; padding-top:8px; }\n.s-rc-foot{ text-align:center; color:var(--paper-faint); font-size:10px; margin-top:12px; }\n\n/* ============================================================\n   2 · MENUNGGU HASIL (waiting)\n   ============================================================ */\n.s-wait{ padding:var(--sp-5) var(--sp-4) var(--sp-6); }\n.s-wait-photo{ position:relative; width:190px; margin:0 auto; border-radius:8px; }\n.s-wait-photo .s-receipt{ transform:rotate(-1.6deg); }\n.s-scanline{\n  position:absolute; left:-6px; right:-6px; height:44px; z-index:3; pointer-events:none;\n  background:linear-gradient(180deg, transparent, color-mix(in srgb, var(--brand) 26%, transparent) 60%, transparent);\n  border-radius:8px; animation:scan 2s var(--ease-standard) infinite;\n}\n.s-scanline::after{ content:\"\"; position:absolute; left:0; right:0; bottom:14px; height:2px; background:var(--brand); box-shadow:0 0 12px 2px var(--brand); border-radius:2px; }\n@keyframes scan{ 0%{ top:-10px } 50%{ top:76% } 100%{ top:-10px } }\n.s-wait-status{ margin-top:var(--sp-6); text-align:center; }\n.s-wait-t{ font-size:var(--fs-subhead); font-weight:var(--fw-semibold); }\n.s-wait-t span{ display:inline-block; }\n.s-wait-dots::after{ content:\"\"; animation:dots 1.4s steps(4,end) infinite; }\n@keyframes dots{ 0%{content:\"\"} 25%{content:\"·\"} 50%{content:\"··\"} 75%{content:\"···\"} }\n.s-wait-s{ font-size:var(--fs-caption); color:var(--text-muted); margin-top:var(--sp-2); }\n.s-skel{ margin-top:var(--sp-5); display:flex; flex-direction:column; gap:var(--sp-2); }\n.s-skel-row{ display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3) var(--sp-4); background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); opacity:0; animation:pop var(--dur-base) var(--ease-standard) forwards; }\n.s-skel-row:nth-child(1){ animation-delay:.3s } .s-skel-row:nth-child(2){ animation-delay:.7s } .s-skel-row:nth-child(3){ animation-delay:1.1s } .s-skel-row:nth-child(4){ animation-delay:1.5s }\n@keyframes pop{ from{ opacity:0; transform:translateY(6px) } to{ opacity:1; transform:none } }\n.s-bar{ height:11px; border-radius:6px; background:linear-gradient(90deg,var(--n-2) 25%,var(--n-3) 37%,var(--n-2) 63%); background-size:400% 100%; animation:sheen 1.4s linear infinite; }\n@keyframes sheen{ 0%{background-position:100% 0} 100%{background-position:0 0} }\n.s-skel-row .a{ flex:1 1 auto } .s-skel-row .b{ width:56px }\n.s-wait-cancel{ margin-top:var(--sp-6); text-align:center; }\n\n/* ============================================================\n   3 · REVIEW (editor item) — hasil baca\n   ============================================================ */\n.s-rev{ padding:0 0 130px; }\n\n/* Peek struk — bar tipis di atas daftar, buka overlay */\n.s-peek{\n  position:sticky; top:0; z-index:4; display:flex; align-items:center; gap:var(--sp-3);\n  padding:var(--sp-3) var(--sp-4); background:var(--surface); border-bottom:1px solid var(--border);\n  appearance:none; font-family:inherit; cursor:pointer; width:100%; color:var(--text); text-align:left;\n}\n.s-peek-thumb{ width:34px; height:44px; border-radius:5px; flex:0 0 auto; overflow:hidden; box-shadow:var(--elev-1); background:var(--paper); position:relative; }\n.s-peek-thumb::before{ content:\"\"; position:absolute; inset:5px 5px auto; height:3px; border-radius:2px; background:var(--paper-faint); box-shadow:0 6px 0 var(--paper-line),0 12px 0 var(--paper-line),0 18px 0 var(--paper-line),0 24px 0 var(--paper-line); opacity:.6; }\n.s-peek-id{ flex:1 1 auto; min-width:0; }\n.s-peek-t{ display:block; font-size:var(--fs-footnote); font-weight:var(--fw-semibold); }\n.s-peek-s{ display:block; font-size:var(--fs-caption2); color:var(--text-muted); margin-top:1px; }\n.s-peek-cta{ display:flex; align-items:center; gap:3px; font-size:var(--fs-caption); font-weight:var(--fw-semibold); color:var(--brand); flex:0 0 auto; }\n.s-peek-cta svg{ width:14px; height:14px; }\n\n/* Banner status (per keadaan) */\n.s-banner{ margin:var(--sp-3) var(--sp-4); border-radius:var(--r-card); padding:var(--sp-3) var(--sp-4); display:flex; gap:var(--sp-3); align-items:flex-start; }\n.s-banner-ic{ width:22px; height:22px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; }\n.s-banner-ic svg{ width:20px; height:20px; }\n.s-banner-b{ flex:1 1 auto; min-width:0; }\n.s-banner-t{ font-size:var(--fs-footnote); font-weight:var(--fw-semibold); line-height:var(--line-body); }\n.s-banner-p{ font-size:var(--fs-caption); margin-top:2px; line-height:var(--line-relaxed); }\n.s-banner--ok{ background:var(--surface); border:1px solid var(--border); }\n.s-banner--ok .s-banner-ic{ color:var(--pos-text); }\n.s-banner--ok .s-banner-p{ color:var(--text-secondary); }\n.s-banner--warn{ background:var(--warn-tint); }\n.s-banner--warn .s-banner-ic{ color:var(--warn-text); }\n.s-banner--warn .s-banner-t{ color:var(--warn-text); }\n.s-banner--warn .s-banner-p{ color:var(--warn-text); opacity:.85; }\n.s-banner--neg{ background:var(--neg-tint); }\n.s-banner--neg .s-banner-ic{ c rcle><circle cx=\"6\" cy=\"12\" r=\"3\"><\u002Fcircle><circle cx=\"18\" cy=\"19\" r=\"3\"><\u002Fcircle><path d=\"M8.6 13.5l6.8 4M15.4 6.5l-6.8 4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <span class=\"s-tile-t\">Terima share<\u002Fspan>\n            <span class=\"s-tile-s\">Gambar dari app lain<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n\n        <div class=\"s-honest\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 16v-4M12 8h.01\"><\u002Fpath><\u002Fsvg>\n          <p>Cahaya cukup dan struk terbentang rata bikin hasil bacanya jauh lebih akurat. <b>Yang ragu selalu bisa kamu betulkan.<\u002Fb><\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"s-cap-foot\">\n          <button class=\"s-manual\" data-go=\"fail-manual\">Nggak ada struk fisik? <b>Input manual<\u002Fb><\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ 2 · MENUNGGU HASIL ============ -->\n    <section class=\"s-screen\" id=\"scr-waiting\">\n      <div class=\"s-wait\">\n        <div class=\"s-wait-photo\">\n          <div class=\"s-scanline\"><\u002Fdiv>\n          <div class=\"s-receipt\" id=\"waitReceipt\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"s-wait-status\">\n          <div class=\"s-wait-t\"><span class=\"s-wait-dots\">Membaca struk<\u002Fspan><\u002Fdiv>\n          <div class=\"s-wait-s\">Struknya sudah di tangan kami — sebentar, lagi dirapikan.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"s-skel\">\n          <div class=\"s-skel-row\"><div class=\"s-bar a\"><\u002Fdiv><div class=\"s-bar b\"><\u002Fdiv><\u002Fdiv>\n          <div class=\"s-skel-row\"><div class=\"s-bar a\"><\u002Fdiv><div class=\"s-bar b\"><\u002Fdiv><\u002Fdiv>\n          <div class=\"s-skel-row\"><div class=\"s-bar a\"><\u002Fdiv><div class=\"s-bar b\"><\u002Fdiv><\u002Fdiv>\n          <div class=\"s-skel-row\"><div class=\"s-bar a\"><\u002Fdiv><div class=\"s-bar b\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"s-wait-cancel\"><button class=\"s-btn s-btn--ghost\" data-go=\"capture\">Batal<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ 3 · REVIEW (editor) ============ -->\n    <section class=\"s-screen\" id=\"scr-review\">\n      <button class=\"s-peek\" id=\"peekBar\">\n        <span class=\"s-peek-thumb\"><\u002Fspan>\n        <span class=\"s-peek-id\">\n          <span class=\"s-peek-t\">Sambal Bakar Indonesia<\u002Fspan>\n          <span class=\"s-peek-s\">Foto struk · ketuk buat cocokkan<\u002Fspan>\n        <\u002Fspan>\n        <span class=\"s-peek-cta\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M21 21l-4-4\"><\u002Fpath><\u002Fsvg>Lihat struk<\u002Fspan>\n      <\u002Fbutton>\n\n      <div id=\"banner\"><\u002Fdiv>\n\n      <div class=\"s-sect\">\n        <span class=\"s-sect-t\">Item terbaca<\u002Fspan>\n        <span class=\"s-sect-count\" id=\"checkCount\"><\u002Fspan>\n      <\u002Fdiv>\n\n      <div class=\"s-items\" id=\"itemList\"><\u002Fdiv>\n      <button class=\"s-additem\" id=\"addItem\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>Tambah item yang kelewat<\u002Fbutton>\n\n      <div class=\"s-sect\"><span class=\"s-sect-t\">Biaya &amp; total<\u002Fspan><\u002Fdiv>\n      <div class=\"s-tot\" id=\"totCard\"><\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ 6 · GAGAL TOTAL ============ -->\n    <section class=\"s-screen\" id=\"scr-fail\">\n      <div class=\"s-fail\">\n        <div class=\"s-fail-photo\">\n          <div class=\"s-receipt\" id=\"failReceipt\"><\u002Fdiv>\n          <div class=\"s-fail-q\"><span>?<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"s-fail-t\">Struk ini belum kebaca<\u002Fdiv>\n        <div class=\"s-fail-p\">Kami nggak berhasil menemukan daftar item di foto ini. Kami memilih tidak menebak daripada kasih angka yang salah.<\u002Fdiv>\n        <div class=\"s-fail-tips\">\n          <span class=\"s-tip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><path d=\"M12 2v2M12 20v2M2 12h2M20 12h2\"><\u002Fpath><\u002Fsvg>Coba lebih terang<\u002Fspan>\n          <span class=\"s-tip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"4\" width=\"16\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"M4 9h16\"><\u002Fpath><\u002Fsvg>Struk terbentang rata<\u002Fspan>\n          <span class=\"s-tip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2\"><\u002Fpath><\u002Fsvg>Semua item masuk frame<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"s-fail-acts\">\n          <button class=\"s-btn s-btn--primary\" data-go=\"waiting\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z\"><\u002Fpath><circle cx=\"12\" cy=\"13\" r=\"4\"><\u002Fcircle><\u002Fsvg>Foto ulang<\u002Fbutton>\n          <button class=\"s-btn s-btn--secondary\" data-go=\"waiting\">Pilih foto lain dari galeri<\u002Fbutton>\n          <button class=\"s-btn s-btn--ghost\" data-go=\"review-input\">Input item manual<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fdiv><!-- /scroll -->\n\n  <!-- Footer aksi lanjut (hanya di review) -->\n  <div class=\"s-foot\" id=\"foot\" hidden=\"\">\n    <div class=\"s-foot-row\">\n      <button class=\"s-btn s-btn--secondary\" id=\"shareLink\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7\"><\u002Fpath><path d=\"M16 6l-4-4-4 4M12 2v13\"><\u002Fpath><\u002Fsvg>Bagikan link<\u002Fbutton>\n      <button class=\"s-btn s-btn--primary\" id=\"assign\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"M19 8v6M22 11h-6\"><\u002Fpath><\u002Fsvg>Bagi ke orang<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"s-foot-hint\" id=\"footHint\">Link klaim: tiap orang tandai sendiri item yang dia makan.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- OVERLAY: cocokkan dengan struk -->\n  <div class=\"s-overlay\" id=\"overlay\">\n    <div class=\"s-scrim\" data-close=\"\"><\u002Fdiv>\n    <div class=\"s-sheet\">\n      <div class=\"s-sheet-grip\"><\u002Fdiv>\n      <div class=\"s-sheet-head\">\n        <div>\n          <div class=\"s-sheet-t\">Cocokkan dengan struk<\u002Fdiv>\n          <div class=\"s-sheet-s\" id=\"sheetSub\">Yang ditandai kuning perlu kamu cek<\u002Fdiv>\n        <\u002Fdiv>\n        <button class=\"s-iconbtn s-sheet-close\" data-close=\"\" aria-label=\"Tutup\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"s-sheet-body\">\n        <div class=\"s-sheet-photo\"><div class=\"s-receipt\" id=\"sheetReceipt\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- DEV SWITCHER -->\n<aside class=\"s-dev\">\n  <h4>Keadaan layar<\u002Fh4>\n  <div class=\"s-dev-group\" id=\"devStates\">\n    <button class=\"s-dev-btn is-active\" data-state=\"capture\">1 · Ambil struk<\u002Fbutton>\n    <button class=\"s-dev-btn\" data-state=\"waiting\">2 · Menunggu hasil<\u002Fbutton>\n    <button class=\"s-dev-btn\" data-state=\"good\">3 · Hasil bagus<\u002Fbutton>\n    <button class=\"s-dev-btn\" data-state=\"flagged\">4 · Perlu dicek<\u002Fbutton>\n    <button class=\"s-dev-btn\" data-state=\"mismatch\">5 · Selisih total<\u002Fbutton>\n    <button class=\"s-dev-btn\" data-state=\"fail\">6 · Gagal total<\u002Fbutton>\n  <\u002Fdiv>\n  <h4>Tema<\u002Fh4>\n  <div class=\"s-dev-theme\">\n    <button class=\"s-dev-btn is-active\" data-theme-btn=\"light\">Terang<\u002Fbutton>\n    <button class=\"s-dev-btn\" data-theme-btn=\"dark\">Gelap<\u002Fbutton>\n  <\u002Fdiv>\n  <p class=\"s-dev-note\">Tugas layar: bikin orang percaya hasil baca dalam hitungan detik, dan bikin koreksi terasa ringan. Nadanya jujur — ini hasil baca, bukan angka final. State 3/4/5 memakai daftar &amp; total yang sama, beda data + banner.<\u002Fp>\n<\u002Faside>\n\n<script>\n/* ============================================================\n   DATA — hasil baca OCR. conf per field: 'ok' | 'low' | 'empty'.\n   'empty' = tak kebaca → dikosongkan, TIDAK ditebak.\n   Restoran: Sambal Bakar Indonesia. Pajak 10%, service 5%.\n   ============================================================ */\nconst RESTO = { name:\"SAMBAL BAKAR INDONESIA\", meta:\"Jl. Riau No.18 Bdg · Meja 12 · 19:07\", taxRate:.10, svcRate:.05, disc:20000 };\n\n/* base: qty, unit price (rupiah). Nama panjang no.11 utk tes potong. */\nconst BASE = [\n  { name:\"Nasi Goreng Kampung\", qty:2, unit:32000 },\n  { name:\"Ayam Bakar Madu\", qty:3, unit:38000 },\n  { name:\"Sate Ayam (10 tusuk)\", qty:2, unit:45000 },\n  { name:\"Cah Kangkung Terasi\", qty:2, unit:28000 },\n  { name:\"Sop Buntut Bakar\", qty:1, unit:68000 },\n  { name:\"Tahu Telor Petis\", qty:1, unit:30000 },\n  { name:\"Es Teh Manis\", qty:6, unit:8000 },\n  { name:\"Es Jeruk Peras\", qty:3, unit:12000 },\n  { name:\"Jus Alpukat Susu\", qty:2, unit:22000 },\n  { name:\"Nasi Putih\", qty:8, unit:6000 },\n  { name:\"Nasi Goreng Seafood Spesial Kampung Pedas Level 3\", qty:1, unit:42000 },\n  { name:\"Kerupuk Udang\", qty:2, unit:10000 },\n];\n\n/* Peta keyakinan per-state. key = index item, value = {field:conf}.\n   Di 'flagged': satu nama kepotong (low), satu harga low, satu qty low,\n   satu harga kosong (empty). */\nconst FLAGS = {\n  good:     {},\n  flagged:  { 1:{name:\"low\"}, 4:{unit:\"low\"}, 6:{qty:\"low\"}, 10:{unit:\"empty\"} },\n  mismatch: {},\n};\n/* Total tertera di struk per state (utk perbandingan). */\nconst STRUK_TOTAL = { good:\"match\", flagged:\"match\", mismatch:754000 };\n\nconst $ = s => document.querySelector(s);\nconst rpn = n => (n==null ? \"\" : n.toLocaleString(\"id-ID\"));\nconst parseNum = s => parseInt(String(s).replace(/\\D/g,\"\"),10) || 0;\n\n/* ---- Receipt termal (dibangun sekali, dipakai di beberapa layar) ---- */\nfunction receiptHTML(hiIndex){\n  let sub=0, rows=\"\";\n  BASE.forEach((it,i)=>{\n    const line = it.qty*it.unit; sub+=line;\n    const hi = (hiIndex!=null && hiIndex===i) ? \" is-hi\" : \"\";\n    rows += `<div class=\"s-rc-line${hi}\"><span class=\"q\">${it.qty}<\u002Fspan><span class=\"n\">${it.name}<\u002Fspan><span class=\"p\">${rpn(line)}<\u002Fspan><\u002Fdiv>`;\n  });\n  const tax=Math.round(sub*RESTO.taxRate), svc=Math.round(sub*RESTO.svcRate), tot=sub+tax+svc-RESTO.disc;\n  return `\n    <div class=\"s-rc-head\"><div class=\"s-rc-name\">${RESTO.name}<\u002Fdiv><div class=\"s-rc-meta\">${RESTO.meta}<\u002Fdiv><\u002Fdiv>\n    ${rows}\n    <div class=\"s-rc-sep\"><\u002Fdiv>\n    <div class=\"s-rc-tot\"><span>Subtotal<\u002Fspan><span>${rpn(sub)}<\u002Fspan><\u002Fdiv>\n    <div class=\"s-rc-tot\"><span>Pajak 10%<\u002Fspan><span>${rpn(tax)}<\u002Fspan><\u002Fdiv>\n    <div class=\"s-rc-tot\"><span>Service 5%<\u002Fspan><span>${rpn(svc)}<\u002Fspan><\u002Fdiv>\n    <div class=\"s-rc-tot\"><span>Diskon<\u002Fspan><span>-${rpn(RESTO.disc)}<\u002Fspan><\u002Fdiv>\n    <div class=\"s-rc-tot grand\"><span>TOTAL<\u002Fspan><span>${rpn(tot)}<\u002Fspan><\u002Fdiv>\n    <div class=\"s-rc-foot\">Terima kasih · simpan struk ini<\u002Fdiv>`;\n}\n\n/* ---- ikon kecil ---- */\nconst icWarn = `<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 9v4M12 17h.01\"/><path d=\"M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"/><\u002Fsvg>`;\nconst icCheck = `<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"/><\u002Fsvg>`;\nconst icInfo = `<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 16v-4M12 8h.01\"/><\u002Fsvg>`;\nconst icFlag = `<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 9v3M12 16h.01\"/><\u002Fsvg>`;\n\n/* ============================================================\n   RENDER item list untuk state review tertentu\n   ============================================================ */\nlet CUR = \"good\";\nfunction renderReview(state){\n  CUR = state;\n  const flags = FLAGS[state] || {};\n  const list = $(\"#itemList\"); list.innerHTML = \"\";\n\n  BASE.forEach((it,i)=>{\n    const f = flags[i] || {};\n    const nameCls = f.name===\"low\" ? \" is-low\" : \"\";\n    const qtyCls  = f.qty===\"low\"  ? \" is-low\" : \"\";\n    const priceEmpty = f.unit===\"empty\";\n    const priceCls = f.unit===\"low\" ? \" is-low\" : priceEmpty ? \" is-empty\" : \"\";\n    // nama kepotong utk simulasi low\n    const nameVal = f.name===\"low\" ? \"Ayam Bakar Ma\" : it.name;\n    const qtyVal  = it.qty;\n    const unitVal = priceEmpty ? \"\" : it.unit;\n    const line = priceEmpty ? null : it.qty*it.unit;\n\n    const row = document.createElement(\"div\");\n    row.className = \"s-item\"; row.dataset.i = i;\n    row.innerHTML = `\n      <div class=\"s-item-body\">\n        <div class=\"s-item-r1\">\n          <input class=\"s-field s-field--name${nameCls}\" value=\"${nameVal.replace(/\"/g,'&quot;')}\" aria-label=\"Nama item\">\n          ${f.name===\"low\" ? `<span class=\"s-flag\">${icFlag}kepotong?<\u002Fspan>` : ``}\n          <span class=\"s-item-line${priceEmpty?' is-empty':''}\">${priceEmpty ? 'perlu harga' : `<span class=\"s-rp\">Rp<\u002Fspan>${rpn(line)}`}<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"s-item-r2\">\n          <input class=\"s-field s-field--qty${qtyCls}\" value=\"${qtyVal}\" inputmode=\"numeric\" aria-label=\"Jumlah\">\n          <span class=\"s-x\">×<\u002Fspan>\n          <span class=\"s-rp\">Rp<\u002Fspan>\n          <input class=\"s-field s-field--price${priceCls}\" value=\"${rpn(unitVal)}\" placeholder=\"belum kebaca\" inputmode=\"numeric\" aria-label=\"Harga satuan\">\n          ${f.unit===\"low\" ? `<span class=\"s-flag\">${icFlag}cek harga<\u002Fspan>` : ``}\n          <button class=\"s-item-del\" aria-label=\"Hapus baris\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6\"/><\u002Fsvg><\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n    list.appendChild(row);\n\n    row.querySelector(\".s-item-del\").addEventListener(\"click\", ()=>{ row.remove(); recalc(); });\n    row.querySelectorAll(\".s-field\").forEach(inp=>{\n      inp.addEventListener(\"input\", ()=>{\n        // begitu disentuh, tanda ragu hilang — koreksi terasa selesai\n        inp.classList.remove(\"is-low\",\"is-empty\");\n        const flagEl = inp.parentElement.querySelector(\".s-flag\");\n        if(flagEl && (inp.classList.contains(\"s-field--name\") || inp.classList.contains(\"s-field--price\"))) flagEl.remove();\n        recalc();\n      });\n    });\n  });\n\n  renderBanner(state);\n  renderTotals(state);\n  updateCheckCount();\n}\n\n/* ---- Banner per-state ---- */\nfunction renderBanner(state){\n  const b = $(\"#banner\");\n  if(state===\"good\"){\n    b.innerHTML = `<div class=\"s-banner s-banner--ok\"><span class=\"s-banner-ic\">${icCheck}<\u002Fspan><div class=\"s-banner-b\">\n      <div class=\"s-banner-t\">Kelihatannya rapi<\u002Fdiv>\n      <div class=\"s-banner-p\">Ini tetap hasil baca otomatis. Lihat sekilas, kalau ada yang aneh tinggal ketuk buat betulin.<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n  } else if(state===\"flagged\"){\n    b.innerHTML = `<div class=\"s-banner s-banner--warn\"><span class=\"s-banner-ic\">${icWarn}<\u002Fspan><div class=\"s-banner-b\">\n      <div class=\"s-banner-t\"><span id=\"bnCount\">4<\u002Fspan> hal perlu kamu cek<\u002Fdiv>\n      <div class=\"s-banner-p\">Yang kami ragu ditandai kuning. Yang tak kebaca sengaja dikosongkan — kami nggak menebak.<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n  } else if(state===\"mismatch\"){\n    b.innerHTML = `<div class=\"s-banner s-banner--neg\"><span class=\"s-banner-ic\">${icWarn}<\u002Fspan><div class=\"s-banner-b\">\n      <div class=\"s-banner-t\">Hitungan kami beda <span class=\"s-banner-diff\" id=\"diffAmt\">Rp 15.000<\u002Fspan> dari total di struk<\u002Fdiv>\n      <div class=\"s-banner-p\">Biasanya ada item yang kelewat kebaca, atau satu harga salah baca.<\u002Fdiv>\n      <div class=\"s-banner-acts\">\n        <button class=\"s-chip s-chip--solid\" id=\"fixAdd\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M5 12h14\"/><\u002Fsvg>Ada item kelewat<\u002Fbutton>\n        <button class=\"s-chip s-chip--out\" data-open>Cek dengan struk<\u002Fbutton>\n        <button class=\"s-chip s-chip--out\" id=\"useStruk\">Pakai total struk<\u002Fbutton>\n      <\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n  }\n}\n\n/* ---- Hitung total & perbandingan ---- */\nfunction collect(){\n  let sub=0, hasEmpty=false;\n  document.querySelectorAll(\"#itemList .s-item\").forEach(row=>{\n    const qty = parseNum(row.querySelector(\".s-field--qty\").value);\n    const priceStr = row.querySelector(\".s-field--price\").value.trim();\n    if(priceStr===\"\" ){ hasEmpty=true; return; }\n    sub += qty * parseNum(priceStr);\n  });\n  return { sub, hasEmpty };\n}\nfunction renderTotals(state){\n  const { sub, hasEmpty } = collect();\n  const tax=Math.round(sub*RESTO.taxRate), svc=Math.round(sub*RESTO.svcRate);\n  const tot = sub+tax+svc-RESTO.disc;\n  const strukTot = STRUK_TOTAL[state]===\"match\" ? tot : STRUK_TOTAL[state];\n\n  let cmp;\n  if(hasEmpty){\n    cmp = `<div class=\"s-prov\">${icWarn}<span>Ada item tanpa harga — total masih sementara sampai kamu isi.<\u002Fspan><\u002Fdiv>`;\n  } else if(tot===strukTot){\n    cmp = `<div class=\"s-tot-cmp ok\">${icCheck}<span>Cocok dengan total di struk<\u002Fspan><\u002Fdiv>`;\n  } else {\n    const d = strukTot - tot; const sign = d>0?\"kurang\":\"lebih\";\n    cmp = `<div class=\"s-tot-cmp bad\">${icWarn}<span>Selisih <b>Rp ${rpn(Math.abs(d))}<\u002Fb> — hitungan kami ${sign} dari struk (<b>Rp ${rpn(strukTot)}<\u002Fb>)<\u002Fspan><\u002Fdiv>`;\n  }\n\n  $(\"#totCard\").innerHTML = `\n    <div class=\"s-tot-row\"><span class=\"s-tot-lbl\">Subtotal item<\u002Fspan><span class=\"s-tot-val\"><span class=\"s-rp\">Rp<\u002Fspan> ${rpn(sub)}<\u002Fspan><\u002Fdiv>\n    <div class=\"s-tot-row\"><span class=\"s-tot-lbl tag\">Pajak <span class=\"badge\">10%<\u002Fspan><\u002Fspan><span class=\"s-tot-val\">${rpn(tax)}<\u002Fspan><\u002Fdiv>\n    <div class=\"s-tot-row\"><span class=\"s-tot-lbl tag\">Service <span class=\"badge\">5%<\u002Fspan><\u002Fspan><span class=\"s-tot-val\">${rpn(svc)}<\u002Fspan><\u002Fdiv>\n    <div class=\"s-tot-row\"><span class=\"s-tot-lbl tag\">Diskon <span class=\"badge\">promo<\u002Fspan><\u002Fspan><span class=\"s-tot-val neg\">− ${rpn(RESTO.disc)}<\u002Fspan><\u002Fdiv>\n    <div class=\"s-tot-row grand\"><span class=\"s-tot-lbl\">Total dihitung<\u002Fspan><span class=\"s-tot-val\"><span class=\"s-rp\">Rp<\u002Fspan> ${rpn(tot)}<\u002Fspan><\u002Fdiv>\n    ${cmp}`;\n\n  if(state===\"mismatch\"){ const el=$(\"#diffAmt\"); if(el) el.textContent = \"Rp \"+rpn(Math.abs(strukTot-tot)); }\n}\nfunction recalc(){ renderTotals(CUR); updateCheckCount(); }\n\n/* ---- Hitung berapa field yg masih perlu dicek ---- */\nfunction updateCheckCount(){\n  const low = document.querySelectorAll(\"#itemList .is-low\").length;\n  const empty = document.querySelectorAll(\"#itemList .s-field--price.is-empty\").length;\n  const n = low + empty;\n  const el = $(\"#checkCount\");\n  if(n>0){ el.className=\"s-sect-count\"; el.innerHTML = `${icFlag} ${n} perlu dicek`; }\n  else { el.className=\"s-sect-count is-clear\"; el.innerHTML = `${icCheck} semua terperiksa`; }\n  const bn = $(\"#bnCount\"); if(bn) bn.textContent = n;\n}\n\n/* ============================================================\n   NAVIGASI antar keadaan (dev + tombol produk)\n   ============================================================ */\nconst REVIEW_STATES = [\"good\",\"flagged\",\"mismatch\"];\nfunction screenFor(state){\n  if(state===\"capture\") return \"capture\";\n  if(state===\"waiting\") return \"waiting\";\n  if(state===\"fail\") return \"fail\";\n  return \"review\";\n}\nfunction go(state){\n  // alias dari tombol produk\n  if(state===\"fail-manual\"){ state=\"fail\"; }\n  if(state===\"review-input\"){ state=\"flagged\"; }\n  const scr = screenFor(state);\n  document.querySelectorAll(\".s-screen\").forEach(s=>s.classList.remove(\"is-active\"));\n  $(\"#scr-\"+scr).classList.add(\"is-active\");\n  $(\"#scroll\").scrollTop = 0;\n\n  const isReview = scr===\"review\";\n  $(\"#foot\").hidden = !isReview;\n  if(isReview) renderReview(state);\n\n  // top bar konteks\n  const map = {\n    capture:[\"Scan struk\", true],\n    waiting:[\"Membaca…\", false],\n    review:[\"Cek hasil scan\", true],\n    fail:[\"Scan gagal\", false],\n  };\n  $(\"#topTitle\").textContent = map[scr][0];\n  $(\"#topSub\").style.visibility = map[scr][1] ? \"visible\" : \"hidden\";\n\n  // sync dev buttons\n  document.querySelectorAll(\"#devStates .s-dev-btn\").forEach(x=>{\n    const s = x.dataset.state;\n    const active = (s===state) || (isReview && s===state);\n    x.classList.toggle(\"is-active\", s===state);\n  });\n}\n\n/* tombol data-go (produk) */\ndocument.addEventListener(\"click\", e=>{\n  const g = e.target.closest(\"[data-go]\"); if(g){ go(g.dataset.go); }\n  const op = e.target.closest(\"[data-open]\"); if(op){ openOverlay(); }\n  const cl = e.target.closest(\"[data-close]\"); if(cl){ $(\"#overlay\").classList.remove(\"is-open\"); }\n});\n$(\"#backBtn\").addEventListener(\"click\", ()=>{\n  const cur = document.querySelector(\".s-screen.is-active\").id;\n  go(cur===\"scr-capture\" ? \"capture\" : \"capture\");\n});\n\n/* dev switcher */\ndocument.querySelectorAll(\"#devStates .s-dev-btn\").forEach(b=> b.addEventListener(\"click\", ()=>go(b.dataset.state)));\ndocument.querySelectorAll(\"[data-theme-btn]\").forEach(b=> b.addEventListener(\"click\", ()=>{\n  document.documentElement.setAttribute(\"data-theme\", b.dataset.themeBtn);\n  document.querySelectorAll(\"[data-theme-btn]\").forEach(x=>x.classList.toggle(\"is-active\", x===b));\n}));\n\n/* overlay cocokkan struk */\nfunction openOverlay(hi){\n  $(\"#sheetReceipt\").innerHTML = receiptHTML(hi);\n  $(\"#sheetSub\").textContent = (CUR===\"mismatch\")\n    ? \"Bandingkan total di bawah struk dengan hitungan kami\"\n    : \"Ketuk item di daftar untuk menyorotinya di sini\";\n  $(\"#overlay\").classList.add(\"is-open\");\n}\n$(\"#peekBar\").addEventListener(\"click\", ()=>openOverlay());\n$(\"#addItem\").addEventListener(\"click\", ()=>{\n  const list = $(\"#itemList\");\n  const row = document.createElement(\"div\");\n  row.className=\"s-item\"; row.innerHTML = `\n    <div class=\"s-item-body\">\n      <div class=\"s-item-r1\"><input class=\"s-field s-field--name\" placeholder=\"Nama item\" aria-label=\"Nama item\"><span class=\"s-item-line\"><span class=\"s-rp\">Rp<\u002Fspan>0<\u002Fspan><\u002Fdiv>\n      <div class=\"s-item-r2\"><input class=\"s-field s-field--qty\" value=\"1\" inputmode=\"numeric\"><span class=\"s-x\">×<\u002Fspan><span class=\"s-rp\">Rp<\u002Fspan><input class=\"s-field s-field--price\" placeholder=\"0\" inputmode=\"numeric\"><button class=\"s-item-del\" aria-label=\"Hapus\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6\"/><\u002Fsvg><\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>`;\n  list.appendChild(row);\n  row.querySelector(\".s-item-del\").addEventListener(\"click\", ()=>{ row.remove(); recalc(); });\n  row.querySelectorAll(\".s-field\").forEach(inp=> inp.addEventListener(\"input\", recalc));\n  row.querySelector(\".s-field--name\").focus();\n  recalc();\n});\n\n/* ---- init ---- */\n$(\"#waitReceipt\").innerHTML = receiptHTML();\n$(\"#failReceipt\").innerHTML = receiptHTML();\ngo(\"capture\");\n\n/* auto-maju dari waiting → hasil (biar demo terasa hidup) */\nlet waitTimer=null;\nconst _go = go;\ngo = function(state){ _go(state); if(screenFor(state)===\"waiting\"){ clearTimeout(waitTimer); waitTimer=setTimeout(()=>{ if(document.querySelector(\".s-screen.is-active\").id===\"scr-waiting\") _go(\"flagged\"); }, 2600); } };\ngo(\"capture\");\n\n/* ============================================================\n   CATATAN DESAIN (sekali — untuk agent coding)\n   ------------------------------------------------------------\n   • Tugas layar BUKAN memamerkan hasil scan, tapi bikin orang\n     PERCAYA hasil baca cepat + bikin KOREKSI terasa ringan.\n     Nada jujur di mana-mana: \"hasil baca\", \"belum kebaca\",\n     \"total dihitung\" vs \"total di struk\". Tidak pernah klaim akurat.\n   • Alur: Ambil struk → Menunggu (foto struk yg sudah di tangan\n     dipakai, ada scan-line + item skeleton muncul bertahap, tidak\n     kosong) → Review → aksi lanjut.\n   • Penanda keyakinan, 3 tingkat, TANPA jadi lautan peringatan:\n       ok    = tampil biasa.\n       low   = field di-highlight kuning + underline + chip kecil\n               (\"kepotong?\" / \"cek harga\"). Warna TIDAK sendiri —\n               selalu ada ikon + kata.\n       empty = tak kebaca → SENGAJA dikosongkan (box putus kuning\n               + placeholder \"belum kebaca\"), tidak ditebak.\n     Menyentuh field = tanda ragu hilang → progres koreksi terasa.\n     Ringkasan \"N perlu dicek\" di header seksi jadi to-do ringan.\n   • Cocokkan dg struk asli = inti layar. Foto struk selalu ada:\n     bar peek sticky di atas + overlay sheet menampilkan struk\n     termal (dirender dari data yang sama) supaya bisa diadu\n     baris per baris. Overlay bisa dibuka kapan saja.\n   • Total dihitung dibanding total tertera di struk:\n       cocok  → konfirmasi hijau ringkas.\n       selisih→ banner merah + nominal selisih + jalan keluar\n               (tambah item kelewat / cek dg struk / pakai total\n               struk). Buntu itu dilarang.\n       ada field kosong → total ditandai \"sementara\", bukan salah.\n   • Biaya tambahan ikut kebaca: pajak 10%, service 5%, diskon.\n   • Aksi lanjut: \"Bagi ke orang\" (assign) atau \"Bagikan link\"\n     (klaim mandiri). Kuota scan tampil seperlunya di sub-header,\n     bukan jualan.\n   • Gagal total: tidak buntu — foto ulang / galeri / input manual.\n     Jujur: \"kami memilih tidak menebak\".\n   • Baris item = SATU pola, diulang dari array BASE (12 item).\n     Item no.11 nama sangat panjang → uji ellipsis, tata letak\n     tetap utuh. State good/flagged/mismatch pakai daftar & total\n     yang sama, beda peta FLAGS + STRUK_TOTAL + banner.\n\n   TOKEN BARU yang perlu ditambah ke tokens.css (SUDAH ditambah\n   di file token terlampir):\n     --warn / --warn-text / --warn-tint  (light & dark + media dark)\n       → keperluan: menandai field OCR yang \"ragu/belum kebaca\".\n         Ini keadaan caution, beda makna dari neg (error/utang) dan\n         warn juga tak boleh dipinjam dari brand. Sudah dipasangkan\n         dgn ikon+label+underline supaya tak andalkan warna saja.\n     --paper / --paper-ink / --paper-faint / --paper-line\n       → keperluan: render \"foto struk\" (kertas termal) untuk momen\n         cocokkan. Bukan warna UI; khusus artefak struk. Bila tak\n         mau dimasukkan ke tokens inti, boleh disimpan lokal di\n         layar ini. (Saat ini di-inline di file ini; TIDAK saya\n         tambahkan ke tokens.css inti karena sifatnya lokal.)\n   ============================================================ */\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
